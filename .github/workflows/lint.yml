name: Lint

"on":
  pull_request:

jobs:
  lint:
    name: Run lint suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          path: repo
          files: |
            **/*.py
            **/*.pyi
            **/*.yaml
            **/*.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.24"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Install external linter CLIs
        working-directory: .
        run: |
          # Install actionlint (v1.7.9)
          ACTIONLINT_URL="https://github.com/rhysd/actionlint/releases/download"
          curl -fsSL "${ACTIONLINT_URL}/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz" | tar -xz
          sudo mv actionlint /usr/local/bin/

          # Install trivy (v0.55.0)
          TRIVY_URL="https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib"
          curl -sfL "${TRIVY_URL}/install.sh" | sh -s -- -b /usr/local/bin v0.55.0

          # Install gitleaks (v8.24.2)
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download"
          curl -fsSL "${GITLEAKS_URL}/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/

          # Install dotenv-linter (v3.3.0)
          DOTENV_URL="https://github.com/dotenv-linter/dotenv-linter/releases/download"
          curl -sSfL "${DOTENV_URL}/v3.3.0/dotenv-linter-linux-x86_64.tar.gz" | tar -xz
          sudo mv dotenv-linter /usr/local/bin/

      - name: Run lint suite
        if: steps.changed-files.outputs.any_changed == 'true'
        run: uv run lint --files ${{ steps.changed-files.outputs.all_changed_files }}
