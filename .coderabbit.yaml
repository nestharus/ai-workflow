# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Assertive profile aligns with R4 Quality Reviewer duties described in AGENTS.md.
language: en-US
early_access: true
enable_free_tier: true
reviews:
  profile: assertive
  high_level_summary: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  commit_status: true
  # Include only reviewable paths (patterns without '!' are inclusions).
  # Partial exclusions for subdirectories within included folders use '!'.
  path_filters:
    # Root files
    - "*"
    # Included folders
    - ".ai/**"
    - ".claude/**"
    - ".crush/**"
    - ".github/**"
    - ".huggingface/**"
    - ".opencode/**"
    - ".tasks/**"
    - "agents/**"
    - "app/**"
    - "docs/**"
    - "scripts/**"
    - "tests/**"
    # Excluded subdirectories within included folders
    - "!.tasks/store/**"
    - "!docs/plans/**"
    - "!docs/references/**"
  tools:
    # Python linters disabled - run in local CI via scripts/dev/lint.py (runs ruff, mypy)
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false

    # Infrastructure linters disabled - run in local CI via scripts/dev/lint.py
    # (runs hadolint, pymarkdown, yamllint, checkov)
    yamllint:
      enabled: false
    markdownlint:
      enabled: false
    hadolint:
      enabled: false
    checkov:
      enabled: false

    # GitHub Actions linter disabled - will be handled locally
    actionlint:
      enabled: false

    # Security scanners disabled - will be integrated into local CI workflow
    gitleaks:
      enabled: false
    osvScanner:
      enabled: false
    semgrep:
      enabled: false
    dotenvLint:
      enabled: false

    # Language-specific tools disabled - Python-only codebase. List reflects
    # CodeRabbit schema as of 2025-12-07. New tools may be added later.
    eslint:
      enabled: false
    biome:
      enabled: false
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    golangci-lint:
      enabled: false
    detekt:
      enabled: false
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    pmd:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    circleci:
      enabled: false
    clippy:
      enabled: false
    sqlfluff:
      enabled: false
    prismaLint:
      enabled: false
    oxc:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    brakeman:
      enabled: false
    htmlhint:
      enabled: false
    checkmake:
      enabled: false

    # Tools kept enabled for code review quality
    shellcheck:
      enabled: true
    languagetool:
      enabled: true
    ast-grep:
      essential_rules: true

    # GitHub checks with 5-minute timeout to wait for local CI completion
    github-checks:
      enabled: true
      timeout_ms: 300000
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"  # Docstring coverage handled by local tooling
    title:
      mode: "warning"
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
