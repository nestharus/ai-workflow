doc_id: original-architecture-repository-structure
title: Repository Structure
description: This document provides a comprehensive directory and file reference for the codebase.
domain: []
scope: project
sections:
- id: application-code
  index: 1
  title: Application Code
  category: standard
  summary: ''
  items:
  - id: application-code-1
    type: text
    text: |
      * `app/routes/`: API endpoint routers, including `orchestrator_router.py` * `app/services/`: Business
      logic layer, including `orchestrator_service.py` and `agent_invoker.py` * `app/contracts/`: Pydantic models,
      including `orchestrator_contracts.py` * `app/core/`: Core application setup including `factory.py` for app
      construction
- id: agent-definitions
  index: 2
  title: Agent Definitions
  category: standard
  summary: ''
  items:
  - id: agent-definitions-factorydroids-agent
    type: text
    text: '`.factory/droids/`: Agent definitions (POML) organized by domain'
- id: documentation
  index: 3
  title: Documentation
  category: standard
  summary: ''
  items:
  - id: documentation-1
    type: step
    text: |
      * `docs/`: The Coarse Knowledge Graph (source of truth) with subdirectories for each domain: * `docs/usage/`:
      Documentation for using the application * `docs/development/`: Writing application code, docstrings, code style *
      `docs/testing/`: Writing and running test code * `docs/architecture/`: Folder structure, services, endpoints,
      integrations * `docs/processes/`: Development processes like git releases, code reviews
