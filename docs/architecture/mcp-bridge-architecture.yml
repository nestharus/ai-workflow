doc_id: architecture-mcp-bridge
title: MCP Bridge Architecture
description: REST-to-MCP bridge server providing HTTP/Unix socket access to MCP STDIO providers.
  The bridge is transport-only; tool-specific normalization happens in client layers.
domain: []
scope: project
sections:
  - id: overview
    index: 1
    title: Overview
    category: standard
    items:
      - id: overview-1
        text: The MCP bridge is a FastAPI service that translates HTTP requests to MCP JSON-RPC
          calls over STDIO. It runs in a Docker container alongside persistent MCP provider
          subprocesses.
      - id: overview-2
        text: Primary use case is exposing mcp-background-job as an HTTP service so jobs persist
          independently of WSL shell lifetime and timeouts.
  - id: layering
    index: 2
    title: Architectural Layering
    category: standard
    items:
      - id: layering-1
        text: "Bridge layer (scripts/mcp/): Transport-only. Translates HTTP to MCP JSON-RPC,
          returns provider-native payloads unchanged (wrapped in result envelope), provides
          stable error envelopes and HTTP status mapping, enforces timeouts and serialized
          STDIO access."
      - id: layering-2
        text: "Client layer (scripts/dev/mcp_agent_client.py): Tool-specific normalization.
          Handles background-job normalization (ensuring job_id, status/exit_code, default
          stdout/stderr). Provides separation of transport concerns from business logic."
      - id: layering-3
        text: "HTTP-only consumers: Should use FastMCP tool names (execute_command, get_job_status,
          etc.), expect provider-native payloads (e.g., id instead of job_id), and implement
          their own normalization if needed."
  - id: request-flow
    index: 3
    title: Request Flow
    category: standard
    items:
      - id: request-flow-1
        text: "WSL/scripts send HTTP POST to bridge. Bridge acquires provider lock, sends
          JSON-RPC request over STDIO, reads response, releases lock, returns HTTP response
          with result envelope."
      - id: request-flow-2
        text: Provider process is persistent, allowing execute then status/output across
          multiple HTTP calls without subprocess lifecycle issues.
  - id: error-handling
    index: 4
    title: Error Handling
    category: standard
    items:
      - id: error-handling-1
        text: "Bridge provides stable error envelope: {error: {type, message, details}}. Error
          types include BAD_REQUEST, JSONRPC_ERROR, TIMEOUT, PROVIDER_CRASHED, BUSY, INTERNAL."
      - id: error-handling-2
        text: HTTP status mapping is consistent. 400 for bad requests, 502 for JSON-RPC errors,
          503 for busy/crashed, 504 for timeouts, 500 for internal errors.
  - id: files
    index: 5
    title: Key Files
    category: standard
    items:
      - id: files-1
        text: "scripts/mcp/app/api/routes.py: HTTP endpoints (POST /mcp/{server}/call, GET
          /mcp/servers, GET /health)."
      - id: files-2
        text: "scripts/mcp/app/services/manager.py: MCPStdioManager handles provider lifecycle,
          STDIO communication, JSON-RPC framing."
      - id: files-3
        text: "scripts/mcp/client/http_client.py: HttpMCPClient for Python consumers of the
          bridge."
      - id: files-4
        text: "scripts/dev/mcp_agent_client.py: Higher-level client with background-job
          normalization and timeout enforcement."
      - id: files-5
        text: "scripts/mcp/benchmark_bridge_transport.py: Benchmark script for measuring
          transport latency and throughput. Supports Unix socket vs HTTP comparison."
  - id: deployment
    index: 6
    title: Deployment Modes
    category: standard
    items:
      - id: deployment-1
        text: "Primary local dev path: Unix socket mode via the dev-tools Docker Compose stack.
          Start with uv run dev.ensure-env (preferred) or docker compose -p ai-workflow-devtools
          -f docker-compose.dev.yml up -d mcp-bridge. The bridge listens on /tmp/mcp-bridge.sock
          inside the container (mounted from host /tmp/mcp-sockets via bind mount). This
          provides ~50% lower latency and ~30-50% less CPU usage compared to HTTP/TCP."
      - id: deployment-2
        text: "Host HTTP mode (non-Docker): For running uvicorn directly on the host
          without Docker, use --host 127.0.0.1 --port 8080. HttpMCPClient defaults to
          http://localhost:8080 when MCP_BRIDGE_SOCKET is not set."
      - id: deployment-3
        text: "Transport precedence in HttpMCPClient: socket_path argument > MCP_BRIDGE_SOCKET
          env > base_url argument > MCP_BRIDGE_URL env > default http://localhost:8080."
      - id: deployment-4
        text: "Socket path semantics: The socket path inside the container is /tmp/mcp-bridge.sock
          (set via MCP_BRIDGE_SOCKET env var). When using docker compose or docker run, mount
          /tmp/mcp-sockets from the host to /tmp in the container to access the socket from
          the host."
      - id: deployment-5
        text: "HTTP fallback: Host-based HTTP mode remains officially supported for non-Docker
          development workflows. Both Unix-socket and HTTP modes are validated in automated tests."
  - id: performance
    index: 7
    title: Performance and Benchmarking
    category: standard
    items:
      - id: performance-1
        text: "Benchmark script: scripts/mcp/benchmark_bridge_transport.py provides repeatable
          latency and throughput measurements. Run with --compare to see Unix socket vs HTTP
          side-by-side. Use this to validate performance claims after changes."
      - id: performance-2
        text: "Expected improvements (Unix socket vs HTTP/TCP): ~30-50% lower median latency,
          reduced CPU overhead from avoiding TCP stack processing. Actual results vary by
          workload and system configuration."
      - id: performance-3
        text: "To run benchmarks: Ensure mcp-bridge is running via the dev-tools stack (preferred:
          uv run dev.ensure-env, or manually: docker compose -p ai-workflow-devtools -f
          docker-compose.dev.yml up -d mcp-bridge), then run: python scripts/mcp/benchmark_bridge_transport.py
          --compare --iterations 100"
      - id: performance-4
        text: "Metrics collected: min/median/mean/p90/p99/max latency in milliseconds,
          throughput in requests per second, success rate percentage."
      - id: performance-5
        text: "Threshold assertions: Use --min-latency-improvement and
          --min-throughput-improvement flags with --compare to enforce minimum
          performance improvements. The script exits non-zero if thresholds are
          not met. Example: --compare --min-latency-improvement 30 requires at
          least 30% latency reduction for socket vs HTTP."
      - id: performance-6
        text: "Diagnostic use: This benchmark script is intended for manual validation
          of performance claims and is NOT enforced in CI. Developers should run
          it after making transport-related changes to verify targets are
          maintained. Results vary by system configuration and workload."
