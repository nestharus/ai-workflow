doc_id: mcp-background-job-setup
title: MCP Background Job Server Setup
description: Configuration and validation for the mcp-background-job MCP server used for long-running
  agent processes via the MCP bridge architecture.
domain: []
scope: general
sections:
  - id: overview
    index: 1
    title: Overview
    category: standard
    items:
  - id: overview-purpose
    text: The mcp-background-job server is now managed via the MCP bridge service, which exposes the
      background-job MCP server behind a Unix socket interface. The bridge provides transport
      persistence that survives Bash tool timeouts, enabling reliable long-running process management.
  - id: overview-use-case
    text: Callers should NOT attempt to start their own mcp-background-job subprocess when using this
      workflow. Instead, the bridge container manages the subprocess lifecycle. This ensures consistent
      connection handling and avoids timeout issues with direct stdio connections.
  - id: overview-architecture
    text: |
      The system uses a layered architecture:
      - Bridge layer (scripts/servers/mcp/): Transport-only socket-to-MCP translation.
        Native Unix socket server using newline-delimited JSON (JSONL) protocol.
        Converts socket requests to MCP protocol calls. No HTTP endpoints.
      - Client layer (scripts/dev/mcp_agent_client.py): Tool-specific normalization
        for background-job operations. Uses socket client for communication.
  - id: prerequisites
    index: 2
    title: Prerequisites
    category: standard
    items:
  - id: prereq-docker
    text: Docker must be installed and running for the container-based workflow. The MCP bridge runs
      as a Docker container managed by docker-compose.
  - id: prereq-uv
    text: uv must be installed for running dev.ensure-env which starts the development environment
      including the MCP bridge container.
  - id: prereq-curl
    text: "curl is no longer required for bridge communication. The client uses native Python
      sockets. curl may still be useful for manual testing via socat or similar tools."
  - id: configuration
    index: 3
    title: Configuration
    category: standard
    items:
  - id: config-bridge-source
    text: |
      The MCP bridge loads server configurations from .mcp.yml or .mcp.json at project root. Example .mcp.yml:
      ```yaml
      mcpServers:
        background-job:
          type: stdio
          command: uvx
          args:
            - mcp-background-job
      ```
  - id: config-docker-compose
    text: |
      docker-compose.dev.yml configures the mcp-bridge container with:
      - MCP_BRIDGE_SOCKET=/tmp/mcp-bridge.sock - Unix socket path inside container
      - MCP_COMMAND=uvx mcp-background-job - Default MCP server command
      - Volume mount: /tmp/mcp-sockets:/tmp - Makes socket accessible to host at /tmp/mcp-sockets/mcp-bridge.sock
  - id: config-env-vars
    text: |
      Environment variables for client configuration:
      - MCP_BRIDGE_SOCKET: Unix socket path (primary configuration method)
      Note: MCP_BRIDGE_URL is deprecated and no longer supported by the bridge server.
      If HTTP access is needed, implement a separate HTTP-to-socket proxy.
  - id: config-cli-client
    text: |
      The agent.mcp CLI interacts with the bridge. Default socket location is /tmp/mcp-sockets/mcp-bridge.sock
      (host-side path; inside the container the socket is at /tmp/mcp-bridge.sock).
      Supports --socket-path CLI flag for explicit configuration.
      Precedence (highest to lowest): CLI flags > Environment variables > Defaults.
      Full resolution order: --socket-path, MCP_BRIDGE_SOCKET, default socket path.
  - id: available-tools
    index: 4
    title: Available Tools
    category: standard
    items:
  - id: tools-list
    text: 'The background-job MCP server exposes the following tools via the bridge:'
  - id: tool-execute
    text: 'execute_command: Start a new background job with a shell command. Returns a job_id for tracking.'
  - id: tool-status
    text: 'get_job_status: Get the current status of a job (running, completed, failed, killed).'
  - id: tool-output
    text: 'get_job_output: Retrieve stdout and stderr from a completed job.'
  - id: tool-list
    text: 'list_jobs: List all tracked jobs and their statuses.'
  - id: tool-kill
    text: 'kill_job: Terminate a running job by job_id.'
  - id: tool-tail
    text: 'tail: Stream output from a running job (out of scope for agent.mcp client).'
  - id: tool-interact
    text: 'interact: Send input to a running job stdin (out of scope for agent.mcp client).'
  - id: validation
    index: 5
    title: Validation
    category: standard
    items:
  - id: validation-intro
    text: Validation is performed via the socket health request to confirm the MCP server is accessible
      and operational.
  - id: validation-step-1
    text: |
      1. Start environment with preferred method:
      ```
      uv run dev.ensure-env
      ```
      Or manually:
      ```
      docker compose -p ai-workflow-devtools -f docker-compose.dev.yml up -d mcp-bridge
      ```
  - id: validation-step-2
    text: |
      2. Verify bridge health via socket health request:
      ```
      python << 'EOF'
      import socket, json
      with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
          s.connect('/tmp/mcp-sockets/mcp-bridge.sock')
          s.sendall(b'{"method":"health","id":"test"}\n')
          print(s.recv(4096).decode())
      EOF
      ```
      Expected response: {"id": "test", "status": "success", "result": {"status": "ok", "provider": "running"}}
  - id: validation-step-3
    text: |
      3. Test tool call via bridge:
      ```
      uv run agent.mcp list
      ```
      Should return JSON with job list.
  - id: troubleshooting
    index: 6
    title: Troubleshooting
    category: standard
    items:
  - id: trouble-bridge-not-running
    text: 'Error: Cannot connect to mcp-bridge at /tmp/mcp-sockets/mcp-bridge.sock. Socket not available.
      Solution: Start the dev environment with uv run dev.ensure-env'
  - id: trouble-health-degraded
    text: 'Error: Bridge returns {"status": "degraded", "provider": "down"}. Solution: Check container
      logs with docker logs ai-workflow-mcp-bridge-dev'
  - id: trouble-socket-permission
    text: 'Error: Permission denied accessing socket. Solution: Ensure /tmp/mcp-sockets directory exists
      and is writable. Container runs as appuser (UID 10000).'
  - id: trouble-http-fallback
    text: "HTTP mode is no longer provided by the bridge server. For non-Docker workflows,
      run the bridge natively on the host using: python -m scripts.servers.mcp.server
      with MCP_BRIDGE_SOCKET set to a local socket path. If HTTP access is needed,
      implement a separate HTTP-to-socket proxy."
