sections:
- id: 20-install-tools
  index: 1
  title: 2.0. Install Tools
  category: standard
  summary: ''
  items:
  - id: 20-install-tools-1
    type: rule
    text: Deep research capabilities are required by the **R1 Research Agent**. This tool is always invoked
      **indirectly via the Orchestrator**, not by regular agents directly. R1 Strategy Planners request
      research by submitting messages to `/api/v1/orchestrator/submit` with `role` set to `R1 Research
      Agent`. The orchestrator is responsible for invoking the deep research tool within that specialized
      agent (see `docs/plans/phase3.md` for POML definition).
  - id: 20-install-tools-code-2
    type: code
    text: '# Clone a pinned release of the deep research tool (update tag/SHA when upgrading)

      git -c advice.detachedHead=false clone --depth 1 --branch v0.1.0 https://github.com/nickscamara/open-deep-research.git
      tools/deep-research

      # If the project publishes signed tags or checksums, verify the ref before use (e.g., git verify-tag
      v0.1.0;

      # otherwise compare git rev-parse HEAD to a published commit SHA or tarball checksum)

      cd tools/deep-research && git rev-parse HEAD'
  - id: 20-install-tools-3
    type: step
    text: Document the tool's license and any known risks in the project notes, and add `tools/deep-research/`
      to `.gitignore` if it remains a runtime-only dependency.
