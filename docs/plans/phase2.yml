- id: 24-implement-webhook-receiver-service
  index: 5
  title: 2.4. Implement Webhook Receiver Service
  category: standard
  summary: ''
  items:
  - id: 24-implement-webhook-receiver-service-code-1
    type: code
    text: '# Create webhook_receiver/main.py

      # - FastAPI application with single POST /webhook/github endpoint

      # - Signature verification using HMAC SHA256

      # - Event parsing for PR comments and new issues

      # - HTTP client to forward events to orchestrator

      # - Error handling and retry logic


      # Create webhook_receiver/contracts.py

      # - GitHubWebhookPayload: Schema for GitHub webhook events

      # - OrchestratorEventForward: Schema for forwarding to orchestrator


      # Create webhook_receiver/Dockerfile

      # - Python 3.12+ base image

      # - Install dependencies (FastAPI, uvicorn, httpx)

      # - Expose port 5000

      # - Health check endpoint


      # Update docker-compose.yml

      # - Add webhook_receiver service

      # - Configure environment variables (WEBHOOK_SECRET, ORCHESTRATOR_URL)

      # - Network configuration to allow receiver → orchestrator communication'
  - id: 24-implement-webhook-receiver-service-webhook-hardening-add-to-th
    type: text
    text: '**Webhook hardening (add to the design/implementation above):**'
  - id: 24-implement-webhook-receiver-service-3
    type: example
    text: '* Validate `X-Hub-Signature-256` as the HMAC of the payload and source timestamps from payload
      timestamp fields, the `Date` header, or server-side delivery tracking (e.g., combine `X-GitHub-Delivery`
      with stored timestamps). Reject requests older than a configurable window (e.g., 5 minutes) and
      enforce a maximum payload size on both the FastAPI endpoint and the forwarding HTTP client (set
      explicit ASGI body limits and httpx request limits). Apply rate limiting per IP and per repository
      with configurable ceilings; use exponential backoff on retries when forwarding to the orchestrator.
      Optionally enforce IP allowlisting using GitHub’s published webhook CIDR ranges and refresh the
      allowlist on a schedule.'
- id: 25-configure-orchestrator-settings
  index: 6
  title: 2.5. Configure Orchestrator Settings
  category: standard
  summary: ''
  items:
  - id: 25-configure-orchestrator-settings-code-1
    type: code
    text: '# Update app/core/settings.py

      # Add orchestrator-specific settings:

      # - DROID_EXEC_PATH: Path to droid executable

      # - DROID_MODEL: Model to use (gemini-3-pro-preview or custom:gemini-3-pro-preview-low)

      # - AGENT_TIMEOUT_SECONDS: Maximum agent execution time

      # - WORKTREE_BASE_PATH: Base directory for git worktrees

      # - ORCHESTRATOR_DB_TABLE: Database table for workflow state

      # - GITHUB_WEBHOOK_SECRET: Secret for webhook signature verification'
  - id: 25-configure-orchestrator-settings-2
    type: rule
    text: '**Secret management requirements:** * Never commit `GITHUB_WEBHOOK_SECRET` or database credentials;
      store them in environment variables or a secrets manager (Vault, AWS Secrets Manager, GCP Secret
      Manager, or CI secrets store). Git-ignore local `.env` files used for development and reference
      env vars in `app/core/settings.py` via `os.environ`. Enforce least-privilege access, encryption
      at rest, and regular rotation for all secrets. Configure CI/CD and deployment environments to source
      secrets from their managed stores rather than repository files.'
- id: 26-document-agent-to-orchestrator-communication-protocol
  index: 7
  title: 2.6. Document Agent-to-Orchestrator Communication Protocol
  category: standard
  summary: ''
  items:
  - id: 26-document-agent-to-orchestrator-communication-protocol-note-see-docsarchitectu
    type: note
    text: '**Note:** See `docs/architecture/orchestrator_api.md` for full API details.'
  - id: 26-document-agent-to-orchestrator-communication-protocol-code-2
    type: code
    text: "cat << EOF > docs/architecture/agent_communication.md\n# Agent-to-Orchestrator Communication\
      \ Protocol\n\n## Message Submission\n\nAgents submit messages to the orchestrator via HTTP POST\
      \ to /api/v1/orchestrator/submit.\n\n## Message Schema\n\n**Refer to \\`docs/architecture/orchestrator_api.md\\\
      ` for the formal \\`OrchestratorMessage\\` schema.**\n\n## Response Handling\n\n* Orchestrator returns\
      \ workflow_id for tracking\n* Agent can poll /api/v1/orchestrator/workflow/{id}/status for results\n\
      * Or orchestrator can invoke callback agent with results\n\n## Long-Running Operations\n\nAgents\
      \ must NOT make long-running tool calls directly (they will timeout).\nInstead, submit a message\
      \ to the orchestrator requesting the operation.\nThe orchestrator will invoke a specialized agent\
      \ to handle it.\n\n## Example: Agent Requesting Deep Research\n\nInstead of calling the research\
      \ tool directly, agent submits:\n\\`\\`\\`json\n{\n  \"role\": \"R1 Research Agent\",\n  \"task\"\
      : \"perform deep research on topic X\",\n  \"context\": {\"topic\": \"X\", \"sources\": [...]},\n\
      \  \"requesting_agent\": \"R1 Tech Strategist\"\n}\n\\`\\`\\`\nEOF"
