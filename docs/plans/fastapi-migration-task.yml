  - id: multi-domain-tagging
    heading: Multi-Domain Tagging Rules
    content: |
      Tag ALL applicable domains; no precedence between domains.

      Pure FastAPI framework patterns (APIRouter, Depends, lifespan):
      ```yaml
      domain:
        - fastapi
      ```

      FastAPI + REST protocol (status codes, response_model with HTTP semantics):
      ```yaml
      domain:
        - rest
        - fastapi
      ```

      FastAPI + Python patterns (Pydantic models, async/await, type hints):
      ```yaml
      domain:
        - python
        - fastapi
      ```

      FastAPI + REST + Python (Pydantic response models with HTTP status):
      ```yaml
      domain:
        - rest
        - fastapi
        - python
      ```

      Examples:

      | Content | Domains |
      |---------|---------|
      | "Use APIRouter for route organization" | `['fastapi']` |
      | "Return 201 status for POST success" | `['rest', 'fastapi']` |
      | "Use Pydantic BaseModel for request validation" | `['python', 'fastapi']` |
      | "Configure response_model with status_code=201" | `['rest', 'fastapi', 'python']` |
      | "Use async def for endpoint handlers" | `['python', 'fastapi']` |
      | "Mount versioned router at /api/v1" | `['rest', 'fastapi']` |

  - id: classification-criteria
    heading: GENERAL vs PROJECT Classification
    content: |
      GENERAL facts: FastAPI framework rules that apply to any FastAPI project.

      Examples:
      - "Use APIRouter for organizing related endpoints"
      - "Depends() enables dependency injection in FastAPI"
      - "Use lifespan context manager for startup/shutdown"
      - "Configure response_model for automatic serialization"
      - "Use BackgroundTasks for async background operations"

      PROJECT facts: FastAPI-specific wiring in this codebase.

      Examples:
      - "Mount v1 router in app/api/v1/router.py"
      - "Use get_settings() from app/core/dependencies.py"
      - "AppError is defined in app/core/errors.py"
      - "create_app function in app/core/factory.py constructs the application"
      - "ORJSONResponse is configured as default_response_class"

      Test question: "Could this rule apply to a different FastAPI project?"
      - Yes → GENERAL
      - No (references `app/*` or project-specific components) → PROJECT

      Classification indicators:

      | Indicator | Scope |
      |-----------|-------|
      | References `app/*` paths | PROJECT |
      | Mentions `AppError`, `create_app`, `RepositoryBase` | PROJECT |
      | Generic FastAPI/Pydantic patterns | GENERAL |
      | Framework documentation style | GENERAL |
      | Implementation wiring ("in our app...") | PROJECT |

  - id: pattern-specific-guidance
    heading: Pattern-Specific Guidance
    content: |
      Brief notes for each of the 10 FastAPI patterns:

      api-patterns:
      API design rules for FastAPI endpoints. Focus on URL structure, request/response
      modeling, OpenAPI documentation, and query/path parameter conventions. Excludes
      implementation wiring (→ factory-patterns) and error response design
      (→ exception-patterns).

      architectural-patterns:
      System structure documentation. Layer integration (how services, repositories,
      and routers interact), component inventory, dependency flow, and system
      boundaries. Describes what exists, not how to build it.

      connection-pooling-patterns:
      Database connection management. Connection pool configuration, client management,
      connection cleanup, and pool sizing. Specific to database client setup, not
      repository patterns.

      exception-patterns:
      Error handling strategies. HTTPException usage, validation error handling,
      AppError patterns, exception handler registration, and error response formatting.
      Excludes HTTP status code conventions (→ rest module).

      factory-patterns:
      Application construction. create_app function, middleware registration, router
      mounting, default_response_class configuration, lifespan management, and
      startup/shutdown hooks. Central wiring of all components.

      middleware-patterns:
      Middleware configuration. Middleware stack configuration, ordering, options,
      and request/response middleware. Excludes factory registration
      (→ factory-patterns).

      repository-patterns:
      Data access layer implementation. Repository construction, data access patterns,
      query patterns, CRUD operations, and query builders. Excludes service layer
      (→ service-patterns) and database pooling (→ connection-pooling-patterns).

      router-patterns:
      Router organization. APIRouter usage, route decorators (@router.get, etc.),
      endpoint wiring, router registration patterns, and route grouping. Excludes
      API design rules (→ api-patterns) and factory mounting (→ factory-patterns).

      service-patterns:
      Service layer implementation. Business logic delegation, service construction,
      service dependencies, and transaction boundaries. Excludes API layer
      (→ router-patterns) and data access (→ repository-patterns).

      settings-patterns:
      Configuration management. Settings model design using Pydantic BaseSettings,
      environment variable binding, configuration validation, and settings access
      patterns. Excludes factory loading (→ factory-patterns).

  - id: validation-criteria
    heading: Validation Criteria
    content: |
      All validations must pass for task completion:

      - All facts from `extractions.csv` are stored in YAML files
      - All facts have corresponding movement records in `iterative_movements.csv`
      - All movements satisfy semantic similarity >= 0.95 (no information loss)
      - Task `fact_count` matches actual extracted fact count
      - GENERAL facts remain in `general.fastapi.*` files (no `app/*` references)
      - PROJECT facts moved to `project.fastapi.*` files (have project indicators)

      Per-pattern validation:
      Each of the 10 patterns should have:
      - At least one fact extracted (may be empty if no relevant content exists)
      - Correct domain tagging (fastapi as primary, with rest/python as applicable)
      - Appropriate scope classification (GENERAL vs PROJECT)

