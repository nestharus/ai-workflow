doc_id: task-6-fastapi-migration
title: "Task 6: Phase 5 - Migrate FastAPI (Fact-Based)"
version_hint: 2024-2025
kind: migration_task
domain:
  - fastapi
scope: project

sections:
  - id: overview
    heading: Overview
    content: |
      This task migrates FastAPI content across 10 pattern files using the fact-based
      migration workflow. Currently, these files are empty and will be populated with
      facts extracted from existing documentation and codebase analysis. Facts about
      FastAPI framework patterns (APIRouter, Depends, lifespan, etc.) will be extracted
      iteratively, classified as GENERAL vs PROJECT, and stored in appropriate files
      with semantic validation.

      The fact-based workflow operates at element/sentence granularity rather than
      file-level, enabling fine-grained multi-domain classification and ensuring no
      information loss through semantic similarity validation (>= 0.95).

      Target pattern files (10 total):
      - api-patterns
      - architectural-patterns
      - connection-pooling-patterns
      - exception-patterns
      - factory-patterns
      - middleware-patterns
      - repository-patterns
      - router-patterns
      - service-patterns
      - settings-patterns

  - id: source-target-files
    heading: Source and Target Files
    content: |
      Source files: Existing YAML documentation files and codebase analysis

      Facts will be extracted from:
      - `docs/development/general/general.rest.api-patterns.yml` (FastAPI-related content)
      - `docs/development/general/general.python.*.yml` (FastAPI/Pydantic content)
      - Codebase analysis of `app/` directory for implementation patterns

      Target files (PROJECT scope):
      Located in `docs/development/project/fastapi/`

      | Pattern File | Purpose |
      |--------------|---------|
      | `project.fastapi.api-patterns.yml` | API design rules specific to this project |
      | `project.fastapi.architectural-patterns.yml` | System structure documentation |
      | `project.fastapi.connection-pooling-patterns.yml` | Database connection management |
      | `project.fastapi.exception-patterns.yml` | Error handling strategies |
      | `project.fastapi.factory-patterns.yml` | Application construction |
      | `project.fastapi.middleware-patterns.yml` | Middleware configuration |
      | `project.fastapi.repository-patterns.yml` | Data access layer implementation |
      | `project.fastapi.router-patterns.yml` | Router organization |
      | `project.fastapi.service-patterns.yml` | Service layer implementation |
      | `project.fastapi.settings-patterns.yml` | Configuration management |

      Target files (GENERAL scope):
      Located in `docs/development/general/`

      | Pattern File | Purpose |
      |--------------|---------|
      | `general.fastapi.api-patterns.yml` | FastAPI API design best practices |
      | `general.fastapi.architectural-patterns.yml` | FastAPI architecture patterns |
      | `general.fastapi.connection-pooling-patterns.yml` | Connection pooling best practices |
      | `general.fastapi.exception-patterns.yml` | Exception handling best practices |
      | `general.fastapi.factory-patterns.yml` | Application factory patterns |
      | `general.fastapi.middleware-patterns.yml` | Middleware best practices |
      | `general.fastapi.repository-patterns.yml` | Repository and data access patterns |
      | `general.fastapi.router-patterns.yml` | APIRouter patterns |
      | `general.fastapi.service-patterns.yml` | Service layer best practices |
      | `general.fastapi.settings-patterns.yml` | Pydantic settings patterns |

  - id: workflow-steps
    heading: Workflow Steps
    subsections:
      - id: step-1-start
        heading: "Step 1: Start Fact Migration"
        content: |
          Run fact extraction on source files containing FastAPI-related content.
          Process each pattern file systematically to extract facts about FastAPI
          entities.

          Commands for each pattern file:

          1. api-patterns (Primary source: GENERAL - REST/FastAPI API conventions):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/general/general.rest.api-patterns.yml \
            --element-id <id>
          ```

          2. architectural-patterns (Primary source: PROJECT - system structure):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/project/fastapi/project.fastapi.architectural-patterns.yml \
            --element-id <id>
          ```

          3. connection-pooling-patterns (Primary source: PROJECT - database setup):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/project/fastapi/project.fastapi.connection-pooling-patterns.yml \
            --element-id <id>
          ```

          4. exception-patterns (Primary source: GENERAL/PROJECT - error handling):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/general/general.fastapi.exception-patterns.yml \
            --element-id <id>
          ```

          5. factory-patterns (Primary source: PROJECT - application wiring):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/project/fastapi/project.fastapi.factory-patterns.yml \
            --element-id <id>
          ```

          6. middleware-patterns (Primary source: GENERAL/PROJECT - middleware config):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/general/general.fastapi.middleware-patterns.yml \
            --element-id <id>
          ```

          7. repository-patterns (Primary source: PROJECT - data access layer):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/project/fastapi/project.fastapi.repository-patterns.yml \
            --element-id <id>
          ```

          8. router-patterns (Primary source: GENERAL - APIRouter patterns):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/general/general.fastapi.router-patterns.yml \
            --element-id <id>
          ```

          9. service-patterns (Primary source: PROJECT - service layer):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/project/fastapi/project.fastapi.service-patterns.yml \
            --element-id <id>
          ```

          10. settings-patterns (Primary source: GENERAL/PROJECT - configuration):
          ```bash
          uv run knowledge.start-fact-migration \
            --yaml-file docs/development/general/general.fastapi.settings-patterns.yml \
            --element-id <id>
          ```

          Note: If a source file is empty, inspect codebase (`app/` directory) or related
          documentation files to identify elements containing relevant FastAPI patterns.
          Some patterns may require extraction from multiple source files.

          Entity extraction targets by pattern:

          | Pattern | Primary Entities |
          |---------|------------------|
          | api-patterns | response_model, status, Query, Path, Body |
          | architectural-patterns | FastAPI, layer, component, boundary |
          | connection-pooling-patterns | AsyncClient, pool, connection |
          | exception-patterns | HTTPException, RequestValidationError, AppError |
          | factory-patterns | create_app, lifespan, include_router |
          | middleware-patterns | middleware, CORSMiddleware, RequestLoggingMiddleware |
          | repository-patterns | RepositoryBase, find_by_id, find_all, query |
          | router-patterns | APIRouter, prefix, tags, router |
          | service-patterns | service, business_logic, transaction |
          | settings-patterns | Settings, BaseSettings, env_prefix |

          Output:
          - Facts stored in `.knowledge/facts/extractions.csv`
          - Task created in `.knowledge/migrations/fact_tasks.csv`
          - Returns task ID and fact count per pattern

      - id: step-2-classify
        heading: "Step 2: Classify Facts"
        content: |
          Print instructions for invoking the knowledge-analyzer sub-agent to classify
          each extracted fact.

          Command:
          ```bash
          uv run knowledge.classify-facts --task-id <uuid>
          ```

          Sub-agent invocation:
          ```python
          Task(subagent_type="knowledge-analyzer", prompt="")
          ```

          The sub-agent classifies each fact across three dimensions:
          - Domain: fastapi, rest, python (multi-domain tagging allowed)
          - Scope: GENERAL vs PROJECT
          - Pattern: One of the 10 FastAPI patterns

          Classification output schema:
          ```json
          {
            "classifications": [
              {
                "fact_id": "<uuid>",
                "domains": ["fastapi"],
                "scope": "GENERAL",
                "pattern": "router-patterns",
                "target_file": "docs/development/general/general.fastapi.router-patterns.yml"
              },
              {
                "fact_id": "<uuid>",
                "domains": ["fastapi", "python"],
                "scope": "PROJECT",
                "pattern": "repository-patterns",
                "target_file": "docs/development/project/fastapi/project.fastapi.repository-patterns.yml"
              }
            ]
          }
          ```

          The `domains` field is an array to support multi-domain tagging. Use the
          appropriate array based on the fact's content:
          - `["fastapi"]`: Pure FastAPI framework patterns
          - `["fastapi", "rest"]`: FastAPI + REST protocol rules
          - `["fastapi", "python"]`: FastAPI + Python patterns (Pydantic, async)
          - `["fastapi", "rest", "python"]`: All three domains

          Save classification output to a JSON file for the next step.

      - id: step-3-move
        heading: "Step 3: Move Facts"
        content: |
          Move classified facts to their target domain/pattern YAML files with
          semantic similarity tracking.

          Command:
          ```bash
          uv run knowledge.move-facts \
            --task-id <uuid> \
            --classification-file classification.json
          ```

          Actions performed:
          - Parse classification JSON
          - Store GENERAL facts in `.knowledge/facts/fastapi.<pattern>.facts.yml`
          - Store PROJECT facts in `.knowledge/facts/fastapi.<pattern>.facts.yml`
          - Record movements in `.knowledge/movements/iterative_movements.csv`
          - Calculate and store semantic similarity scores

          GENERAL facts go to `general.fastapi.*` files; PROJECT facts go to
          `project.fastapi.*` files based on classification.

      - id: step-4-validate
        heading: "Step 4: Validate Migration"
        content: |
          Validate that all facts are stored, movements tracked, and semantic
          preservation is maintained.

          Command:
          ```bash
          uv run knowledge.validate-fact-migration --task-id <uuid>
          ```

          Validation checks:
          - All facts from `extractions.csv` are stored in YAML files
          - All facts have corresponding movement records
          - All movements satisfy invariant: `original = isolated_fact + residual_sentence`
          - Semantic similarity >= 0.95 for all movements
          - Task `fact_count` matches actual extracted count

          Output: Updates task status to 'completed' or 'failed'

  - id: entity-extraction-targets
    heading: Entity Extraction Targets
    content: |
