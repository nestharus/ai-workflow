  - id: notes
    heading: Important Notes
    content: |
      - This task uses the NEW fact-based migration workflow, not the old file-level
        workflow
      - Fact extraction is iterative: one fact per iteration until entity is completely
        removed from the sentence
      - Semantic validation ensures no information loss (similarity >= 0.95)
      - Multi-domain tagging is required: do not drop applicable domains
      - Classification is manual via knowledge-analyzer sub-agent (not automated)
      - Always pass empty string for sub-agent prompt:
        `Task(subagent_type="knowledge-analyzer", prompt="")`
      - The 10 pattern files are currently empty; facts will be populated through this
        migration process
      - GENERAL FastAPI facts establish reusable framework knowledge
      - PROJECT FastAPI facts document this specific application's wiring
