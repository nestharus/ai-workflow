- id: 17-document-orchestrator-api-endpoints
  index: 9
  title: 1.7. Document Orchestrator API Endpoints
  category: reference
  summary: ''
  items:
  - id: 17-document-orchestrator-api-endpoints-1
    type: note
    text: |
      Note: The file `docs/architecture/orchestrator_api.md` is the single canonical source of truth for all
      orchestrator endpoints and payload schemas (including `submit`, `claim-ticket`, `route-comment`, and
      `workflow/{id}/status`). Refer to it for the most up-to-date details.
  - id: 17-document-orchestrator-api-endpoints-code-2
    type: code
    text: |
      cat << 'EOF' > docs/architecture/orchestrator_api.md
      # Orchestrator API Documentation

      ## Overview
      This document is the single canonical source of truth for all orchestrator API
      request and response schemas.

      ## Endpoints

      ### POST /api/v1/orchestrator/submit
      Agent message submission.
      * Request Schema: `OrchestratorMessage`
      * Response Schema: `WorkflowStatus`

      ### POST /api/v1/orchestrator/claim-ticket
      Ticket claiming mechanism.
      * Request Schema: `TicketClaimRequest`
      * Response Schema: `TicketClaimResponse`

      ### POST /api/v1/orchestrator/route-comment
      PR comment routing.
      * Request Schema: `PRCommentEvent`
      * Response Schema: `RoutingStatus`

      ### GET /api/v1/orchestrator/workflow/{id}/status
      Get workflow status.
      * Response Schema: `WorkflowStatus`

      ## Data Schemas

      ### OrchestratorMessage
      * role: Agent role (e.g., "R2 Tech Planner")
      * task: Task description
      * context: Contextual data (files, URLs, etc.)
      * requesting_agent: Originating agent identifier

      ### TicketClaimRequest
      ```json
      {
        "ticket_url": "https://github.com/owner/repo/issues/123",
        "agent_id": "R2 Tech Planner",
        "domain": "technical"
      }
      ```

      ### TicketClaimResponse
      ```json
      {
        "claimed": true,
        "claim_id": "claim-uuid-123",
        "subscription_id": "sub-uuid-456"
      }
      ```
      EOF
- id: 18-document-github-integration-flow
  index: 10
  title: 1.8. Document GitHub Integration Flow
  category: workflow
  summary: ''
  items:
  - id: 18-document-github-integration-flow-code-1
    type: code
    text: |
      cat << EOF > docs/architecture/github_integration.md # GitHub Integration Architecture ## Webhook Flow 1. GitHub
      sends webhook to receiver service 2. Receiver verifies signature 3. Receiver parses event (PR comment, new issue)
      4. Receiver forwards to orchestrator 5. Orchestrator routes to appropriate workflow 6. Orchestrator invokes agent
      via droid exec 7. Agent uses GitHub MCP to fetch details 8. Agent submits result back to orchestrator ## Ticket
      Claiming * First-come-first-served mechanism * Agents subscribe to ticket updates * Orchestrator manages claim
      state in database ## PR Comment Routing * Orchestrator analyzes comment context * Routes to appropriate agent
      based on file/domain * Agent responds via GitHub MCP EOF
