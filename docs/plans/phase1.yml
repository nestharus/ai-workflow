- id: 11-create-root-directory-and-basic-structure
  index: 3
  title: 1.1. Create Root Directory and Basic Structure
  category: standard
  summary: ''
  items:
  - id: 11-create-root-directory-and-basic-structure-code-1
    type: code
    text: |
      # Initialize the root directory and core folders mkdir -p dev-with-ai-v2-core cd dev-with-ai-v2-core git init #
      Create the documentation-first knowledge graph structure mkdir -p docs/product docs/ux docs/ui docs/tech docs/qa
      docs/architecture docs/guides # Create directories for agent definitions (Custom Droids), tools, and scripts mkdir
      -p .factory/droids/product .factory/droids/ux .factory/droids/ui .factory/droids/tech mkdir -p
      .factory/droids/shared mkdir -p tools mkdir -p scripts # Create application structure mkdir -p app/contracts
      app/services app/routes app/core mkdir -p webhook_receiver
- id: 12-initialize-agentsmd-the-entry-point
  index: 4
  title: 1.2. Initialize `AGENTS.md` (The Entry Point)
  category: standard
  summary: ''
  items:
  - id: 12-initialize-agentsmd-the-entry-point-code-1
    type: code
    text: |
      cat << 'EOF' > AGENTS.md
      # AI Agent Entry Point

      Welcome to the **Developing With AI 2.0** system. This repository follows an
      **automated, orchestrator-based architecture** where a central orchestrator
      service manages workflows and agent invocations.

      ## Repository Structure
      * **`.factory/droids/`**: Agent definitions (POML) organized by domain.
      * **`docs/`**: The Coarse Knowledge Graph (source of truth).
      * **`app/`**: The FastAPI Orchestrator Service.
      * **`webhook_receiver/`**: Standalone GitHub webhook handler.

      ## Operational Protocols
      1. **Orchestrator Submission**: Agents submit messages to the orchestrator
         via POST to `/api/v1/orchestrator/submit` instead of calling other agents
         directly.
      2. **No Long-Running Operations**: Agents must not make long-running tool
         calls directly; instead, submit messages to the orchestrator to request
         long-running tasks.
      3. **Git Worktree Usage**: Agents may work in parallel using git worktrees
         managed by the orchestrator.
      EOF
- id: 13-initialize-docsreadmemd-the-index
  index: 5
  title: 1.3. Initialize `docs/README.md` (The Index)
  category: standard
  summary: ''
  items:
  - id: 13-initialize-docsreadmemd-the-index-code-1
    type: code
    text: |
      cat << EOF > docs/README.md # Documentation Index (Coarse Knowledge Graph) ## Domains * \`docs/product/\`:
      Strategy and requirements. * \`docs/ux/\`: User flows and experience guidelines. * \`docs/ui/\`: Component specs
      and visual guidelines. * \`docs/tech/\`: Architecture and implementation details. * \`docs/qa/\`: Quality
      assurance processes, SLOs, and metrics thresholds. ## Core Guides * \`docs/architecture/overview.md\`: High-level
      architectural vision. * \`docs/guides/workflow.md\`: Detailed description of the automated orchestrator workflow.
      EOF
- id: 14-initialize-orchestrator-workflow-guidelines
  index: 6
  title: 1.4. Initialize Orchestrator Workflow Guidelines
  category: guide
  summary: ''
  items:
  - id: 14-initialize-orchestrator-workflow-guidelines-1
    type: text
    text: This document defines the automated process, replacing the human-in-the-loop process.
  - id: 14-initialize-orchestrator-workflow-guidelines-code-2
    type: code
    text: |
      cat << EOF > docs/guides/workflow.md # Automated Orchestrator Workflow Guidelines ## Architecture 1.
      **Orchestrator Service**: Central FastAPI service that routes messages and manages state. 2. **Webhook Receiver**:
      Standalone service that receives GitHub events and forwards them to the orchestrator. 3. **Agent Execution**:
      Agents are invoked by the orchestrator via \`droid exec\` in subprocesses. 4. **Message Bus**: Agents communicate
      by submitting messages to the orchestrator. ## Automated Workflow Execution * **Submission**: Agents POST messages
      to \`/api/v1/orchestrator/submit\`. * **Routing**: Orchestrator determines the next step/agent based on the
      message and workflow state. * **Invocation**: Orchestrator spawns a new agent process with the required context. *
      **Parallelism**: Multiple agents can run simultaneously using git worktrees. ## Git Worktree Management for
      Parallel Work * The orchestrator creates a temporary worktree for each agent execution. * Agents perform file
      operations within their assigned worktree. * The orchestrator handles merging changes back to the main branch or
      PR branch. EOF
