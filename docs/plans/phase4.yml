doc_id: original-plans-phase4
title: 'Phase 4: Integrate Automated Feedback Routing and QA Monitoring'
description: This implements the Quality Reviewer (R4) and QA & Maintenance (R5) roles, utilizing the
  orchestrator service to automatically route feedback and alerts to the appropriate agents.
domain: []
scope: project
sections:
- id: 41-configure-quality-reviewer-r4-coderabbitmacroscope
  index: 1
  title: 4.1. Configure Quality Reviewer (R4 - CodeRabbit/Macroscope)
  category: standard
  summary: ''
  items:
  - id: 41-configure-quality-reviewer-r4-coderabbitmacroscope-1
    type: text
    text: We configure CodeRabbit (R4) to apply labels that the **Orchestrator Service** uses for automatic
      routing.
  - id: 41-configure-quality-reviewer-r4-coderabbitmacroscope-code-2
    type: code
    text: "cat << EOF > .coderabbit.yaml\nreviews:\n  profile: \"assertive\"\n  request_changes_workflow:\
      \ true\n  auto_review:\n    enabled: true\n  # Intelligent Routing Labels for Automated Orchestrator\n\
      \  # The orchestrator parses these labels from GitHub webhook events and routes feedback to the\
      \ appropriate agent automatically.\n  labeling_instructions:\n    - label: \"feedback:r1_strategy\"\
      \n      instructions: \"Apply if comments question fundamental strategy, architecture, or high-level\
      \ phasing. (Route to Strategy Planner).\"\n    - label: \"feedback:r2_planning\"\n      instructions:\
      \ \"Apply if the implementation does not match the defined tasks or the plan was incomplete. (Route\
      \ to Planner).\"\n    - label: \"feedback:r3_implementation\"\n      instructions: \"Apply for code\
      \ style, bugs, performance issues, or security vulnerabilities. (Route to Editor).\"\nEOF"
- id: 42-implement-automated-feedback-routing
  index: 2
  title: 4.2. Implement Automated Feedback Routing
  category: standard
  summary: ''
  items:
  - id: 42-implement-automated-feedback-routing-1
    type: text
    text: We replace the manual feedback notifier with an automated routing architecture integrated into
      the orchestrator.
  - id: 42-implement-automated-feedback-routing-code-2
    type: code
    text: "cat << EOF > docs/architecture/feedback_routing.md\n# Automated Feedback Routing Architecture\n\
      \n## R4 Feedback Flow (CodeRabbit)\n1. CodeRabbit posts PR review comments with labels\n2. GitHub\
      \ sends webhook to webhook receiver service\n3. Webhook receiver verifies signature and parses event\n\
      4. Webhook receiver forwards event to orchestrator\n5. Orchestrator extracts labels (feedback:r1_strategy,\
      \ etc.)\n6. Orchestrator routes to appropriate agent based on label:\n   - feedback:r1_strategy\
      \ → R1 Strategy Planner\n   - feedback:r2_planning → R2 Planner\n   - feedback:r3_implementation\
      \ → R3 Editor\n7. Orchestrator invokes agent via droid exec with feedback context\n8. Agent uses\
      \ GitHub MCP to fetch full PR details\n9. Agent addresses feedback and submits result to orchestrator\n\
      10. Orchestrator invokes GitHub Agent to post response comment\n\n## Orchestrator Routing Logic\n\
      The OrchestratorService.route_feedback() method:\n- Parses GitHub webhook payload\n- Extracts PR\
      \ URL and labels\n- Determines target agent role from label\n- Determines domain from file paths\
      \ in PR\n- Constructs agent invocation message\n- Invokes agent via AgentInvokerService\n\n## Agent\
      \ Feedback Handling\nAgents receive feedback context:\n- pr_url: GitHub PR URL\n- comment_id: Specific\
      \ comment to address\n- file_path: File mentioned in feedback\n- line_number: Line number if applicable\n\
      - feedback_text: The actual feedback comment\n\nAgents use GitHub MCP to:\n- Fetch full PR diff\n\
      - Read comment thread\n- Post response comments\n- Update PR status\nEOF"
- id: 43-qa-maintenance-monitoring-integration-r5
  index: 3
  title: 4.3. QA & Maintenance Monitoring Integration (R5)
  category: standard
  summary: ''
  items:
  - id: 43-qa-maintenance-monitoring-integration-r5-1
    type: text
    text: The QA role (R5) lives in the cloud and observes metrics, feeding alerts back into the workflow
      via webhooks.
  - id: 43-qa-maintenance-monitoring-integration-r5-code-2
    type: code
    text: 'cat << EOF > docs/qa/r5_monitoring_integration.md

      # QA & Maintenance Monitoring Integration (Role 5)


      ## Monitoring Platform Webhook Configuration

      Configure monitoring platform (Datadog, Sentry, Prometheus Alertmanager) to send alerts to webhook
      receiver:

      - Webhook URL: https://your-domain.com/webhook/monitoring

      - Payload format: JSON with event_type, severity, metric_name, threshold

      - Signature: HMAC SHA256 using MONITORING_WEBHOOK_SECRET


      ## Webhook Receiver Monitoring Event Handling

      The webhook receiver parses monitoring alerts:

      - SLO violations

      - Error rate spikes

      - Performance degradation

      - Security incidents


      Forwards to orchestrator with event type "monitoring_alert"


      ## Orchestrator R5 Routing

      When orchestrator receives monitoring alert:

      1. Determine severity (critical, warning, info)

      2. For critical alerts, invoke R1 Strategy Planner to initiate new workflow cycle

      3. For warnings, invoke R3 Editor to apply hotfix

      4. For info, log to database for trend analysis


      ## R5 Feedback Loop

      R5 monitoring creates tickets in GitHub:

      - Orchestrator invokes GitHub Agent to create issue

      - Issue includes alert details, metrics, logs

      - Issue is labeled with "monitoring:r5" and severity

      - Orchestrator routes issue to appropriate R1 agent

      - R1 agent analyzes and initiates fix workflow


      ## Automated Incident Response

      For critical production issues:

      1. Monitoring alert triggers webhook

      2. Orchestrator invokes R1 Strategy Planner (emergency mode)

      3. R1 creates incident response plan

      4. Orchestrator invokes R3 Editor to apply hotfix

      5. R3 submits PR with fix

      6. Orchestrator invokes GitHub Agent to request review

      7. After approval, orchestrator triggers deployment

      EOF'
