  - project/project.python.repository-patterns.yml
  - project/project.python.exception-patterns.yml
sections:
  - id: di-fundamentals
    index: 1
    title: Dependency Injection Fundamentals
    category: standard
    summary: Core DI concepts with FastAPI examples showing how dependency trees are built and resolved per request.
    rules:
      - id: fundamentals.depends-usage
        rule: >
          Declare dependencies in path operation signatures using fastapi.Depends() so FastAPI can resolve and inject
          them automatically for each request.
      - id: fundamentals.composition
        note: >
          Treat dependencies as composable building blocks; dependency functions and classes may themselves declare
          dependencies,
          forming a DAG.
      - id: fundamentals.async-support
        note: Dependencies can be async def or plain def and FastAPI handles both styles transparently.
      - id: fundamentals.request-cache
        rule: >
          Rely on FastAPI’s per-request dependency cache, which ensures each dependency is resolved at most once per
          request
          unless use_cache=False is specified.
      - id: fundamentals.common-parameters-example
        pattern: >
          Use small helper dependencies such as common_parameters to share query parameter handling across endpoints.
      - id: fundamentals.http-surface
        note: >
          Design dependencies around HTTP concerns at the router boundary (for example pagination, authentication,
          headers)
          and separate them from pure domain services.
  - id: constructor-injection
    index: 2
    title: Constructor-Based Dependency Injection
    category: standard
    summary: Patterns for receiving dependencies via __init__ parameters.
    sample_code:
      description: Service class with constructor-based dependency injection.
      language: python
      code: |
        class UserService:
            """Service for user-related business logic."""
            def __init__(self, user_repo: UserRepository, settings: Settings) -> None:
                """Create a service with its collaborators."""
                self._user_repo = user_repo
                self._settings = settings
            async def get_user(self, user_id: str) -> User:
                """Retrieve a user by ID."""
                user = await self._user_repo.get_by_id(user_id)
                if user is None:
                    raise UserNotFoundError(user_id)
                return user
    items:
      - id: constructor.parameters
        rule: Accept all dependencies explicitly via __init__ constructor parameters with proper type hints.
      - id: constructor.private-storage
        pattern: >
          Store injected dependencies as private instance attributes (prefixed with underscore) to indicate they are
          internal
          implementation details.
      - id: constructor.multiple-deps
        note: >
          When a class needs multiple collaborators (repositories, clients, configuration), add them as separate typed
          constructor parameters rather than bundling into a context object.
      - id: constructor.no-defaults
        rule: >
          Avoid default values for dependencies in constructors; callers should always provide explicit instances to
          prevent
          hidden coupling.
      - id: constructor.type-hints
        rule: Type hints are mandatory for all constructor parameters to enable IDE support and static analysis.
  - id: factory-functions
    index: 3
    title: Factory Functions for Dependency Composition
    category: standard
    summary: Using factory functions to wire dependencies together.
    sample_code:
      description: Factory function that composes a service from its dependencies.
      language: python
      code: |
        def build_user_service(user_repo: UserRepository, settings: Settings) -> UserService:
            """Create a UserService with its dependencies."""
            return UserService(user_repo=user_repo, settings=settings)
        def build_order_service(
            order_repo: OrderRepository, user_service: UserService, payment_gateway: PaymentGateway
        ) -> OrderService:
            """Create an OrderService with its dependencies."""
            return OrderService(order_repo=order_repo, user_service=user_service, payment_gateway=payment_gateway)
    items:
      - id: factory.purpose
        note: >
          Factory functions encapsulate the construction logic for complex objects, isolating wiring code from business
          logic.
      - id: factory.explicit-params
        rule: >
          Factory functions accept explicit parameters for all dependencies they need to wire, making the dependency
          graph
          visible.
      - id: factory.composition-root
        pattern: >
          Centralize factory functions at the composition root (application startup or test setup) rather than
          scattering
          construction logic throughout the codebase.
      - id: factory.testability
        note: >
          Factory functions make testing easier by providing clear injection points; tests can call factories with test
          doubles.
      - id: factory.no-hidden-deps
        rule: >
          Factory functions should not import or create dependencies internally; all dependencies must be passed as
          parameters.
  - id: service-layer-pattern
    index: 4
    title: Service Layer Pattern
    category: standard
    summary: Service layer architecture with constructor injection and domain errors.
    rules:
      - id: service.layer-definition
        rule: >
          Adopt the Service Layer pattern where services encapsulate domain workflows and business logic, receiving
          dependencies
          via constructor injection.
      - id: service.domain-errors-generic
        rule: >
          Services raise domain-specific exceptions (subclasses of DomainError) rather than framework-specific or HTTP
          exceptions to remain transport-agnostic.
      - id: service.stateless-methods
        pattern: >
          Service methods should be stateless with respect to the request; state lives in repositories, databases, or
          passed-in parameters.
      - id: service.orchestration
        note: >
          Services orchestrate calls to multiple repositories or external clients, applying business rules and
          coordinating
          transactions.
      - id: service.testability-generic
        note: >
          With constructor injection, service unit tests can mock repositories and clients without touching databases
          or networks.
  - id: request-vs-singleton-dependencies
    index: 5
    title: Request-Scoped vs Singleton Dependencies
    category: standard
    summary: Understanding dependency lifecycles and how they map to resources.
    rules:
      - id: lifecycle.singleton
        rule: >
          Treat Settings, connection pools (SurrealDBPool, ElasticsearchWrapper), and shared HTTP clients as singleton
          dependencies created once per application lifecycle.
      - id: lifecycle.request-scoped
        rule: >
          Treat DB sessions, current user context, and service instances that wrap request data as request-scoped
          dependencies
          created for each request.
      - id: lifecycle.management
        note: >
          Manage singleton resources via the lifespan startup/shutdown mechanism and request-scoped resources via
          yield-based
          dependencies that handle cleanup.
      - id: lifecycle.awareness
        note: >
          Be explicit about the lifecycle of each dependency to avoid accidentally sharing mutable state across
          requests.
  - id: dependency-chains
    index: 6
    title: Dependency Chains
    category: standard
    summary: Structuring multi-layer dependency graphs without creating cycles.
    rules:
      - id: chains.structure
        note: >
          Compose dependency chains where routers depend on services, services depend on repositories, repositories
          depend
          on DB sessions, and DB sessions depend on connection pools.
      - id: chains.avoid-cycles
        rule: >
          Avoid circular dependencies between modules or providers; refactor shared logic into lower-level utilities or
          separate modules when cycles appear.
      - id: chains.depth-limit
        rule: >
          Keep dependency chain depth modest (ideally no more than two or three layers visible from a route) to aid
          readability
          and debugging.
      - id: chains.let-fastapi-resolve
        note: >
          Let FastAPI construct and cache dependency graphs; avoid manually instantiating deep chains inside route
          handlers.
      - id: chains.acyclic-graph
        note: >
          The dependency graph should be a directed acyclic graph (DAG); cycles indicate architectural issues that
          should
          be resolved by extracting shared components.
      - id: chains.visualization
        note: Consider documenting complex dependency graphs to help new team members understand the wiring.
  - id: dependency-anti-patterns
    index: 7
    title: Anti-Patterns to Avoid
    category: warning
    summary: Dependency injection mistakes that hurt testability and maintainability.
    anti_patterns:
      - id: anti.create-deps-in-handlers
        anti_pattern: >
          Instantiating services, database clients, or HTTP clients directly inside route handlers instead of using
          dependencies.
      - id: anti.global-variables
        anti_pattern: >
          Using module-level global variables for stateful components rather than injecting them through FastAPI’s
          dependency
          system.
      - id: anti.missing-yield-cleanup
        anti_pattern: >
          Failing to use yield-based dependencies for resources that need cleanup, which leads to leaked connections or
          resources.
      - id: anti.circular-deps
        anti_pattern: |
          Introducing circular dependencies between providers or modules, indicating poor separation of concerns.
      - id: anti.circular-deps-classes
        anti_pattern: |
          Introducing circular dependencies between classes or modules, indicating poor separation of concerns.
      - id: anti.over-nesting
        anti_pattern: >
          Creating extremely deep or tangled dependency chains that are hard to reason about; prefer clearer
          compositions
          with fewer layers.
