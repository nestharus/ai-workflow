doc_id: project-python-dependency-patterns
title: Python Dependency Injection Patterns
version_hint: 2024-2025
kind: dependency_injection_standards
description: >
  Python dependency injection patterns using constructor injection, factory functions, and explicit dependency
  composition for testability and modularity, with illustrative examples of FastAPI's Depends() integration.
scope: >
  Covers core DI fundamentals applicable to any Python application (constructor injection, factory functions, service
  layer patterns, lifecycle concepts, dependency chains, anti-patterns) alongside illustrative FastAPI examples showing
  how these patterns integrate with fastapi.Depends() and per-request dependency caching. For advanced FastAPI-specific
  dependency patterns (Annotated type aliases, yield-based cleanup, dependency_overrides), see
  project/project.fastapi.dependency-patterns.yml.
domain:
  - python
  - fastapi
primary_runtime_references:
  - path: app/services/
    id: item.1cf293ed
    role: Service implementations demonstrating constructor injection.
  - path: app/repositories/
    id: item.990ac76d
    role: Repository implementations demonstrating constructor injection.
related_pattern_docs:
