doc_id: project-surrealdb-connection-pooling-patterns
title: SurrealDB Connection Pooling Patterns
version_hint: 2024-2025
kind: surrealdb_pooling_standards
description: >
  SurrealDB-specific patterns for connection pool implementation, configuration, lifecycle management, and schema
  initialization using SurrealDBPool.
scope: >
  Covers SurrealDB pool design, asyncio.Queue-based pooling, pool configuration (size, timeouts), connection lifecycle
  (startup, auth, schema init, shutdown), schema initialization patterns, and SurrealDB-specific testing. Generic pooling
  concepts are in python/connection-pooling-patterns.toon.
out_of_scope:
  - Generic pooling fundamentals (see python/connection-pooling-patterns.toon).
  - FastAPI lifespan integration (see fastapi/connection-pooling-patterns.toon).
  - Repository query patterns (see surrealdb/repository-patterns.toon).
primary_runtime_references:
  - path: app/infrastructure/surrealdb/pool.py
    role: SurrealDBPool implementation with asyncio.Queue-based pooling.
  - path: app/core/settings.py
    role: Pool configuration fields (surrealdb_pool_size, acquire_timeout).
related_pattern_docs:
  - python/connection-pooling-patterns.toon
  - fastapi/connection-pooling-patterns.toon
  - surrealdb/repository-patterns.toon
  - python/factory-patterns.toon
  - python/settings-patterns.toon
sections:
  - id: surrealdb-connection-pool
    index: 1
    title: SurrealDB connection pool
    category: standard
    summary: Design and usage patterns for SurrealDBPool.
    sample_code:
      description: Typical SurrealDBPool usage pattern for executing a query.
      imports:
        - app.infrastructure.surrealdb.pool.SurrealDBPool
        - typing.Any
      code: "from typing import Any\nfrom app.infrastructure.surrealdb.pool import SurrealDBPool\nasync def run_query(pool:\
        \ SurrealDBPool, sql: str, params: dict[str, Any] | None = None) -> Any:\n    async with pool.acquire() as conn:\n\
        \        result = await conn.query(sql, params or {})\n        return result"
    items:
      - id: surreal.pool-async-queue
        type: rule
        text: >
          SurrealDBPool maintains multiple WebSocket connections to SurrealDB in an asyncio.Queue, creating them up
          front
          during initialization.
      - id: surreal.pool-config-size
        type: rule
        text: >
          Control pool size via Settings.surrealdb_pool_size so concurrency can be tuned per environment without code
          changes.
      - id: surreal.pre-authenticated
        type: note
        text: >
          During initialization, each SurrealDB connection is authenticated and pointed at the configured namespace and
          database so queries do not repeat this work.
      - id: surreal.acquire-context-manager
        type: pattern
        text: >
          Use SurrealDBPool.acquire() as an async context manager that enforces an acquire timeout and automatically
          returns
          connections to the pool when the context exits.
      - id: surreal.exception-safety
        type: note
        text: >
          The async with pool.acquire() pattern ensures connections are returned even if downstream queries raise
          exceptions.
  - id: surrealdb-pool-configuration
    index: 2
    title: SurrealDB pool configuration
    category: standard
    summary: Recommended configuration options for SurrealDBPool.
    items:
      - id: surreal.config.pool-size
        type: rule
        text: >
          Start with a conservative surrealdb_pool_size (for example 5) and increase only when metrics show SurrealDB
          is the bottleneck and the server can handle more concurrent connections.
      - id: surreal.config.acquire-timeout
        type: rule
        text: >
          Configure an acquire_timeout of several seconds on SurrealDBPool and enforce it via asyncio.wait_for() so
          callers
          fail fast rather than hanging indefinitely.
      - id: surreal.config.env-specific
        type: note
        text: >
          Treat pool size and acquire timeout as environment-specific knobs, using smaller values for local development
          and tuned values for staging and production.
      - id: surreal.config-focus
        type: note
        text: >
          Keep pool-related settings focused on connection counts and wait times rather than unrelated SurrealDB
          configuration.
  - id: surrealdb-connection-lifecycle
    index: 3
    title: SurrealDB connection lifecycle
    category: standard
    summary: Startup, schema initialization, and shutdown behavior for the SurrealDB pool.
    sample_code:
      description: Factory function that creates and initializes a SurrealDB pool.
      imports:
        - app.core.settings.Settings
        - app.infrastructure.surrealdb.pool.SurrealDBPool
      code: "from app.core.settings import Settings\nfrom app.infrastructure.surrealdb.pool import SurrealDBPool\nasync def\
        \ create_surrealdb_pool(settings: Settings) -> SurrealDBPool:\n    \"\"\"Factory that builds and initializes a SurrealDB\
        \ pool from settings.\"\"\"\n    pool = SurrealDBPool(\n        dsn=settings.surrealdb_url,\n        namespace=settings.surrealdb_namespace,\n\
        \        database=settings.surrealdb_database,\n        user=settings.surrealdb_user,\n        password=settings.surrealdb_pass,\n\
        \        size=settings.surrealdb_pool_size,\n        embedding_dimension=settings.embedding_dimension,\n    )\n  \
        \  await pool.init()\n    try:\n        await pool.initialize_schema()\n    except Exception:\n        await pool.close()\n\
        \        raise\n    return pool"
    items:
      - id: surreal.lifecycle.startup
        type: pattern
        text: >
          In lifespan startup, call create_surrealdb_pool(settings) to build a SurrealDBPool, initialize connections,
          and attach it to app.state.surrealdb_pool.
      - id: surreal.lifecycle.auth
        type: note
        text: >
          During initialization, the pool authenticates each connection and selects the configured namespace and
          database
          so subsequent queries can assume a ready session.
      - id: surreal.lifecycle.schema-init
        type: rule
        text: >
          After creating the pool, call pool.initialize_schema() to set up tables, relationships, and vector indexes
          required
          by the application.
      - id: surreal.lifecycle.fail-fast
        type: rule
        text: >
          If schema initialization fails, close the pool and propagate the error so the application fails fast instead
          of running with partial schema state.
      - id: surreal.lifecycle.shutdown
        type: rule
        text: During shutdown, call surrealdb_pool.close() and log any failures without preventing process termination.
  - id: schema-initialization
    index: 4
    title: Schema initialization
    category: standard
    summary: How schema setup ties into connection pooling.
    items:
      - id: schema.initialize-in-pool
        type: rule
        text: >
          Run SurrealDB schema initialization inside SurrealDBPool.initialize_schema() so it executes immediately after
          pool creation.
      - id: schema.versioning
        type: note
        text: Track schema versions using a schema_versions table or similar mechanism to manage migrations safely.
      - id: schema.factory-calls-init
        type: pattern
        text: Ensure create_surrealdb_pool() calls initialize_schema() and closes the pool if initialization fails.
      - id: schema.failure-fatal
        type: rule
        text: >
          Treat schema initialization failures as fatal; the app must not start with an inconsistent or
          partially-applied
          schema.
  - id: surrealdb-testing
    index: 5
    title: Testing SurrealDB pools
    category: testing
    summary: Strategies for testing code that uses SurrealDB pools.
    sample_code:
      description: Monkeypatching create_surrealdb_pool for tests.
      language: python
      code: "import pytest\nfrom unittest.mock import AsyncMock, MagicMock\n@pytest.fixture\ndef mock_surrealdb_pool():\n\
        \    \"\"\"Create a mock SurrealDBPool for unit tests.\"\"\"\n    pool = MagicMock()\n    pool.acquire = AsyncMock()\n\
        \    pool.close = AsyncMock()\n    pool.initialize_schema = AsyncMock()\n    return pool\n@pytest.fixture\ndef patch_create_surrealdb_pool(monkeypatch,\
        \ mock_surrealdb_pool):\n    \"\"\"Patch create_surrealdb_pool to return a mock pool.\"\"\"\n    async def mock_factory(settings):\n\
        \        return mock_surrealdb_pool\n    monkeypatch.setattr(\n        \"app.infrastructure.surrealdb.pool.create_surrealdb_pool\"\
        ,\n        mock_factory,\n    )\n    return mock_surrealdb_pool"
    items:
      - id: surrealdb.test.monkeypatch-factory
        type: pattern
        text: >
          Monkeypatch create_surrealdb_pool() to return mock pools in tests that only care about validation or error
          behavior.
      - id: test.mock-acquire
        type: rule
        text: >
          Configure mock pools with mock.acquire() returning a mock connection that captures query arguments for
          assertion.
      - id: test.integration-namespace
        type: pattern
        text: >
          For integration tests, use a separate SurrealDB namespace/database (for example test_namespace) to isolate
          test
          data from development data.
      - id: surrealdb.test.cleanup
        type: rule
        text: >
          Clean up test data between test runs by deleting records or resetting the test database; avoid side effects
          between tests.
      - id: surrealdb.test.docker-compose
        type: note
        text: >
          Integration tests can use docker-compose to spin up a SurrealDB instance for the test suite; see
          tests/conftest.py
          for fixture examples.
