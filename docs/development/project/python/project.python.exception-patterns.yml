doc_id: project-python-exception-patterns
title: Python Exception Patterns
version_hint: 2024-2025
kind: python_exception_standards
description: Framework-agnostic Python exception patterns covering exception hierarchy design, domain error modeling, error
  handling patterns, and testing strategies independent of HTTP concerns.
scope: Covers exception hierarchy design, domain exception patterns, exception context and messages, error handling patterns,
  exception testing, and anti-patterns. FastAPI-specific HTTP error handling is in docs/development/fastapi/exception-patterns.toon.
primary_runtime_references:
- path: app/core/errors.py
  role: Domain error definitions and exception hierarchy.
related_pattern_docs:
- fastapi/exception-patterns.toon
- python/dependency-patterns.toon
sections:
- id: exception-hierarchy
  index: 1
  title: Exception Hierarchy
  category: standard
  summary: Domain-level exception hierarchy that is independent of HTTP concerns.
  sample_code:
    description: Domain exception hierarchy with base class and specific subclasses.
    language: python
    code: "class DomainError(Exception):\n    \"\"\"Base class for all domain-specific exceptions.\"\"\"\n    def __init__(self,\
      \ message: str) -> None:\n        self.message = message\n        super().__init__(message)\nclass ResourceNotFoundError(DomainError):\n\
      \    \"\"\"Raised when a requested resource does not exist.\"\"\"\n    def __init__(self, resource_type: str, resource_id:\
      \ str) -> None:\n        self.resource_type = resource_type\n        self.resource_id = resource_id\n        super().__init__(f\"\
      {resource_type} with ID {resource_id} was not found\")\nclass DomainValidationError(DomainError):\n    \"\"\"Raised\
      \ when a domain invariant is violated.\"\"\"\n    def __init__(self, message: str, field: str | None = None) -> None:\n\
      \        self.field = field\n        super().__init__(message)\nclass UnauthorizedError(DomainError):\n    \"\"\"Raised\
      \ when an operation is not permitted for the current context.\"\"\"\n    pass"
  items:
  - id: hierarchy.domain-error-base
    type: rule
    text: Model business and domain failures using a small DomainError-based hierarchy (DomainError as the root in app/core/errors.py).
  - id: hierarchy.common-subclasses
    type: note
    text: Use specific DomainError subclasses such as ResourceNotFoundError, DomainValidationError, and UnauthorizedError
      to express missing entities, violated invariants, and permission failures.
  - id: hierarchy.services-raise-exceptions
    type: rule
    text: Have services and domain components raise DomainError subclasses instead of returning sentinel values like None,
      False, or magic strings.
  - id: hierarchy.http-agnostic
    type: rule
    text: Keep domain exceptions HTTP-agnostic; they must not embed HTTP status codes, headers, or transport-specific terminology.
  - id: hierarchy.extensibility
    type: note
    text: Define additional DomainError subclasses (such as UserNotFoundError or InvalidOrderStateError) to express more precise
      error conditions without leaking transport concerns.
- id: domain-exception-pattern
  index: 2
  title: Domain Exception Pattern
  category: standard
  summary: How services and routers cooperate using DomainError and global handlers.
  sample_code:
    description: Service raising domain exceptions instead of returning None.
    language: python
    code: "class UserService:\n    \"\"\"Service for user-related business logic.\"\"\"\n    def __init__(self, user_repo:\
      \ UserRepository) -> None:\n        self._user_repo = user_repo\n    async def get_user(self, user_id: str) -> User:\n\
      \        \"\"\"Retrieve a user by ID.\n        Raises:\n            UserNotFoundError: If the user does not exist.\n\
      \        \"\"\"\n        user = await self._user_repo.get_by_id(user_id)\n        if user is None:\n            raise\
      \ UserNotFoundError(user_id)\n        return user"
  items:
  - id: domain.services-raise
    type: rule
    text: In services, raise ResourceNotFoundError, DomainValidationError, or UnauthorizedError as appropriate instead of
      returning sentinel values such as None.
  - id: domain.explicit-raises
    type: rule
    text: Document all domain exceptions a method may raise in a Raises section of the docstring so callers know which failures
      to handle.
  - id: domain.no-http-coupling
    type: rule
    text: Domain exceptions must not depend on any HTTP framework; they should be pure Python exceptions that can be used
      in CLI tools, background jobs, or tests.
  - id: domain.exception-propagation
    type: pattern
    text: Allow domain exceptions to propagate up through the call stack to the transport layer, which is responsible for
      translating them to appropriate responses.
  - id: domain.specific-over-generic
    type: rule
    text: Prefer specific exception types over generic ones; raise UserNotFoundError rather than ResourceNotFoundError when
      the context is clear and the distinction matters.
- id: exception-context-messages
  index: 3
  title: Exception Context and Messages
  category: standard
  summary: Guidelines for exception message formatting and including context in exceptions.
  items:
  - id: context.informative-messages
    type: rule
    text: Exception messages should be informative for debugging, including relevant identifiers, operation names, and state
      that led to the error.
  - id: context.constructor-params
    type: pattern
    text: Accept context as constructor parameters (resource_id, field_name, expected_value) and build the message from them
      rather than requiring callers to format messages.
  - id: context.attribute-access
    type: pattern
    text: Store context as exception attributes so handlers can access structured data (exc.resource_id, exc.field) in addition
      to the formatted message.
  - id: context.no-sensitive-data
    type: rule
    text: Never include passwords, tokens, or other secrets in exception messages; these may be logged or exposed in error
      responses.
  - id: context.localization-ready
    type: note
    text: Keep exception messages technical and developer-facing; user-facing error messages should be generated by the transport
      layer using exception attributes.
- id: error-handling-patterns
  index: 4
  title: Error Handling Patterns
  category: standard
  summary: Patterns for catching, wrapping, and re-raising exceptions in Python code.
  sample_code:
    description: Wrapping low-level exceptions in domain exceptions.
    language: python
    code: "class OrderRepository:\n    \"\"\"Repository for order persistence.\"\"\"\n    async def create(self, order: Order)\
      \ -> Order:\n        \"\"\"Create an order in the database.\n        Raises:\n            DuplicateOrderError: If an\
      \ order with the same ID already exists.\n            DatabaseError: If the database operation fails.\n        \"\"\"\
      \n        try:\n            await self._db.insert(\"orders\", order.to_dict())\n            return order\n        except\
      \ IntegrityError as e:\n            if \"duplicate key\" in str(e):\n                raise DuplicateOrderError(order.id)\
      \ from e\n            raise DatabaseError(\"Failed to create order\") from e\n        except ConnectionError as e:\n\
      \            raise DatabaseError(\"Database connection failed\") from e"
  items:
  - id: handling.wrap-low-level
    type: rule
    text: Catch low-level exceptions (database errors, network errors, I/O errors) and wrap them in domain-appropriate exceptions
      to hide implementation details.
  - id: handling.exception-chaining
    type: pattern
    text: Use raise DomainException() from original_exception to preserve the exception chain for debugging while presenting
      a domain-appropriate exception to callers.
  - id: handling.specific-catches
    type: rule
    text: Catch specific exception types rather than broad except Exception blocks; only catch exceptions you can handle meaningfully.
  - id: handling.try-finally-cleanup
    type: pattern
    text: Use try/finally blocks to ensure cleanup of resources (file handles, connections) regardless of whether exceptions
      occur.
  - id: handling.reraise-unknown
    type: rule
    text: If you catch an exception and cannot handle it appropriately, re-raise it rather than swallowing it or returning
      a generic error.
- id: exception-testing-patterns
  index: 5
  title: Exception Testing Patterns
  category: testing
  summary: Testing strategies for exceptions using pytest.raises and assertion patterns.
  sample_code:
    description: Testing exception types and attributes with pytest.raises.
    language: python
    code: "import pytest\nfrom app.core.errors import UserNotFoundError\nfrom app.services.user_service import UserService\n\
      async def test_get_user_raises_not_found(user_service: UserService):\n    \"\"\"Test that get_user raises UserNotFoundError\
      \ for missing users.\"\"\"\n    with pytest.raises(UserNotFoundError) as exc_info:\n        await user_service.get_user(\"\
      nonexistent-id\")\n    assert exc_info.value.resource_id == \"nonexistent-id\"\n    assert \"nonexistent-id\" in str(exc_info.value)\n\
      async def test_exception_propagation(user_service: UserService):\n    \"\"\"Test that domain exceptions propagate through\
      \ service methods.\"\"\"\n    with pytest.raises(UserNotFoundError):\n        await user_service.update_user(\"nonexistent-id\"\
      , {\"name\": \"New Name\"})"
  items:
  - id: testing.pytest-raises
    type: pattern
    text: Use pytest.raises(ExceptionType) as a context manager to assert that code raises expected exceptions.
  - id: testing.exception-attributes
    type: rule
    text: Assert on exception attributes (exc_info.value.resource_id, exc_info.value.field) to verify exceptions carry correct
      context.
  - id: testing.message-content
    type: note
    text: Assert that exception messages contain expected content using in operator or string matching when message format
      is part of the contract.
  - id: testing.propagation
    type: rule
    text: Write tests that verify exceptions propagate correctly through the call stack without being inadvertently caught
      or transformed.
  - id: testing.edge-cases
    type: note
    text: Include tests for edge cases such as empty inputs, boundary values, and concurrent operations that may raise exceptions.
- id: python-exception-anti-patterns
  index: 6
  title: Anti-Patterns to Avoid
  category: warning
  summary: Exception handling practices that harm debugging, security, or code quality.
  items:
  - id: python.anti.broad-except
    type: anti_pattern
    text: Using broad except Exception blocks without re-raising or logging appropriately, which hides failures and makes
      debugging difficult.
  - id: python.anti.swallowed-exceptions
    type: anti_pattern
    text: Swallowing exceptions by catching them and doing nothing, which masks errors and leads to silent failures.
  - id: anti.sentinel-values
    type: anti_pattern
    text: Returning sentinel values (None, -1, empty string) instead of raising exceptions to indicate error conditions.
  - id: anti.string-exceptions
    type: anti_pattern
    text: Using strings or generic Exception with string messages instead of typed exception classes, losing type safety and
      structured error handling.
  - id: anti.exposed-internals
    type: anti_pattern
    text: Including stack traces, SQL statements, internal paths, or other implementation details in exception messages that
      may be exposed to users.
  - id: anti.exception-control-flow
    type: anti_pattern
    text: Using exceptions for normal control flow rather than exceptional conditions, which harms performance and code readability.
