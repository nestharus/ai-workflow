doc_id: project-python-connection-pooling-patterns
title: Python Connection Pooling Patterns
version_hint: 2024-2025
kind: python_pooling_standards
description: Framework-agnostic Python patterns for connection pooling, resource lifecycle, and pool configuration applicable
  to any database or client library.
scope: Covers generic pooling fundamentals, pool size tuning, timeout handling, connection recycling, error handling patterns,
  testing strategies, anti-patterns, and monitoring. Technology-specific implementations are in surrealdb/, elasticsearch/,
  and fastapi/ modules.
out_of_scope:
  - SurrealDB-specific pool implementation (see surrealdb/connection-pooling-patterns.toon).
  - Elasticsearch wrapper specifics (see elasticsearch/connection-pooling-patterns.toon).
  - FastAPI lifespan integration (see fastapi/connection-pooling-patterns.toon).
  - Repository APIs built on top of pools (see python/repository-patterns.toon).
primary_runtime_references:
  - path: app/infrastructure/surrealdb/pool.py
    role: Example SurrealDB pool implementation demonstrating pooling patterns.
  - path: app/infrastructure/elasticsearch/client.py
    role: Example Elasticsearch wrapper demonstrating client lifecycle patterns.
related_pattern_docs:
  - fastapi/connection-pooling-patterns.toon
  - surrealdb/connection-pooling-patterns.toon
  - elasticsearch/connection-pooling-patterns.toon
  - python/factory-patterns.toon
  - python/repository-patterns.toon
  - python/settings-patterns.toon
  - python/exception-patterns.toon
sections:
  - id: connection-pooling-fundamentals
    index: 1
    title: Connection pooling fundamentals
    category: standard
    summary: Core principles for creating and managing pooled connections in a FastAPI application.
    sample_code:
      description: Generic pool initialization pattern with singleton-like access.
      language: python
      code: "from typing import Protocol\nclass ConnectionPool(Protocol):\n    \"\"\"Protocol defining the interface for connection\
        \ pools.\"\"\"\n    async def init(self) -> None:\n        \"\"\"Initialize pool connections.\"\"\"\n        ...\n\
        \    async def close(self) -> None:\n        \"\"\"Close all connections in the pool.\"\"\"\n        ...\n    async\
        \ def acquire(self):\n        \"\"\"Acquire a connection from the pool.\"\"\"\n        ...\nasync def create_pool(settings)\
        \ -> ConnectionPool:\n    \"\"\"Factory function that creates and initializes a pool.\"\"\"\n    pool = SomePool(dsn=settings.url,\
        \ size=settings.pool_size)\n    await pool.init()\n    return pool"
    items:
      - id: fundamentals.startup-only
        type: rule
        text: Create connection pools and long-lived clients only once during application startup, before the app begins handling
          requests.
      - id: fundamentals.no-per-request
        type: rule
        text: Never create database engines, SurrealDB pools, Elasticsearch clients, or HTTP clients inside route handlers
          or other per-request code paths.
      - id: fundamentals.shared-state
        type: pattern
        text: Store shared resources on app.state (for example app.state.surrealdb_pool, app.state.elasticsearch_client, app.state.http_client)
          so they can be accessed via dependencies rather than globals.
      - id: fundamentals.lifespan-managed
        type: rule
        text: Use the lifespan context manager in app/core/factory.py to initialize pools during startup and close them during
          shutdown, guaranteeing cleanup even if initialization fails.
      - id: fundamentals.access-via-deps
        type: note
        text: Access pools and clients through dependency providers (for example get_surrealdb_pool, get_elasticsearch_client)
          so tests can override them easily.
      - id: fundamentals.factory-pattern
        type: pattern
        text: Use factory functions such as create_pool(settings) to encapsulate pool construction, initialization, and configuration
          from a centralized Settings source.
      - id: fundamentals.singleton-management
        type: note
        text: Manage pool instances through composition roots or dependency injection rather than module-level globals; this
          enables testing and configuration flexibility.
      - id: fundamentals.access-via-injection
        type: note
        text: Access pools and clients through dependency injection so tests can provide mock implementations without modifying
          production code.
  - id: pool-size-tuning
    index: 2
    title: Pool size tuning
    category: standard
    summary: Guidelines for choosing and adjusting pool sizes.
    items:
      - id: tuning.conservative-defaults
        type: rule
        text: Start with small pool sizes (for example 5–10 connections per pool or per node) instead of guessing large values.
      - id: tuning.respect-backend-limits
        type: rule
        text: Ensure workers × surrealdb_pool_size and similar calculations stay well below backend connection limits.
      - id: tuning.observe-metrics
        type: note
        text: Monitor metrics such as acquire timeouts, queue wait times, request latencies, and error rates before changing
          pool sizes.
      - id: tuning.scale-incrementally
        type: pattern
        text: Increase pool sizes gradually and evaluate impact, preferring query optimization and caching where they provide
          better benefits than simply adding connections.
  - id: connection-timeout-handling
    index: 3
    title: Connection timeout handling
    category: standard
    summary: Patterns for using timeouts as signals of pool exhaustion or backend slowness.
    sample_code:
      description: Timeout handling with asyncio.wait_for.
      language: python
      code: "import asyncio\nimport logging\nlogger = logging.getLogger(__name__)\nasync def acquire_with_timeout(pool, timeout:\
        \ float):\n    \"\"\"Acquire a connection with explicit timeout handling.\"\"\"\n    try:\n        conn = await asyncio.wait_for(pool.get(),\
        \ timeout=timeout)\n        return conn\n    except TimeoutError:\n        logger.warning(\"Timed out waiting for\
        \ connection from pool\")\n        raise"
    items:
      - id: timeouts.acquire
        type: rule
        text: Use SurrealDBPool.acquire() with asyncio.wait_for to enforce acquire timeouts and log when callers cannot obtain
          connections within the configured window.
      - id: timeouts.request
        type: rule
        text: Bound Elasticsearch operations with elasticsearch_request_timeout and similarly configured HTTP client timeouts.
      - id: timeouts.logging-alerts
        type: note
        text: Treat repeated timeouts as indicators of pool exhaustion or backend slowness and investigate query patterns,
          indexing, and infrastructure before simply raising pool sizes.
      - id: timeouts.fail-fast
        type: rule
        text: Translate timeout failures into well-typed exceptions that global handlers can convert into HTTP errors rather
          than allowing requests to hang.
  - id: connection-recycling
    index: 4
    title: Connection recycling
    category: standard
    summary: Handling stale connections and long-lived pools for SurrealDB and HTTP backends.
    items:
      - id: recycling.surreal-lifetime
        type: note
        text: Allow SurrealDBPool connections to live for the process lifetime but be prepared to recreate them if servers
          restart or networks drop idle connections.
      - id: recycling.future-enhancements
        type: note
        text: Consider adding explicit health checks or recycling policies to SurrealDBPool to rebuild connections proactively
          when failures are detected.
      - id: recycling.elasticsearch
        type: note
        text: Rely on Elasticsearch client features such as dead node detection and connection refreshing rather than manually
          closing and reopening HTTP connections.
      - id: recycling.http-backends
        type: pattern
        text: For HTTP-based backends, consider periodically recycling clients or clearing connection pools (for example every
          30 minutes) to handle proxies and load balancers that silently drop idle connections.
  - id: pooling-error-handling
    index: 5
    title: Error handling
    category: standard
    summary: Handling startup, runtime, and shutdown errors for pooled resources.
    sample_code:
      description: Error handling pattern for pool initialization.
      language: python
      code: "import logging\nlogger = logging.getLogger(__name__)\nasync def create_pool_with_setup(settings):\n    \"\"\"\
        Create pool with initialization and cleanup on failure.\"\"\"\n    pool = Pool(dsn=settings.url, size=settings.pool_size)\n\
        \    await pool.init()\n    try:\n        await pool.initialize_schema()\n    except Exception:\n        logger.exception(\"\
        Schema initialization failed\")\n        await pool.close()\n        raise\n    return pool"
    items:
      - id: errors.startup-fail-fast
        type: rule
        text: If create_surrealdb_pool() or create_elasticsearch_wrapper() fails during startup, log the error and re-raise
          it so the application does not start in a broken state.
      - id: errors.cleanup-on-failure
        type: pattern
        text: Ensure factories clean up partially initialized resources (for example closing opened connections) before propagating
          startup errors.
      - id: errors.runtime-metadata
        type: rule
        text: Log runtime pool errors and timeouts with enough metadata—operation type, pool name, and key identifiers—to
          support troubleshooting.
      - id: errors.typed-exceptions
        type: pattern
        text: Have infrastructure layers raise well-typed domain exceptions so services and global exception handlers can
          translate them into HTTP error responses.
      - id: errors.shutdown-logging
        type: note
        text: During shutdown, log failures to close pools or clients but do not prevent process termination; best-effort
          cleanup is sufficient once traffic stops.
  - id: testing-connection-pools
    index: 6
    title: Testing with connection pools
    category: testing
    summary: Unit, integration, and end-to-end testing strategies for pooled resources.
    sample_code:
      description: Pytest fixtures for pool testing without real backends.
      language: python
      code: "import pytest\nfrom unittest.mock import AsyncMock, MagicMock\n@pytest.fixture\ndef mock_pool():\n    \"\"\"\
        Create a mock pool for unit tests.\"\"\"\n    pool = MagicMock()\n    pool.acquire = AsyncMock(return_value=MagicMock())\n\
        \    pool.close = AsyncMock()\n    return pool\n@pytest.fixture\ndef fake_connection():\n    \"\"\"Create a fake connection\
        \ that captures queries.\"\"\"\n    conn = MagicMock()\n    conn.query = AsyncMock(return_value=[])\n    return conn"
    items:
      - id: test.unit-doubles
        type: rule
        text: Use fakes or test doubles for SurrealDBPool and ElasticsearchWrapper in unit tests so they do not require real
          backends.
      - id: test.monkeypatch-factories
        type: pattern
        text: Monkeypatch create_surrealdb_pool() and create_elasticsearch_wrapper() to return dummy resources in tests that
          only care about validation or error behavior (see tests/unit/test_validation_errors.py for examples).
      - id: test.integration-fixtures
        type: pattern
        text: Use in-process integration fixtures (for example test_app and async_client from tests/conftest.py) plus dependency
          overrides to exercise pools initialized by create_app.
      - id: test.e2e-live
        type: note
        text: Use live_server and api_client fixtures (defined in tests/conftest.py) for end-to-end tests that hit a dockerized
          stack with real SurrealDB and Elasticsearch services.
      - id: test.avoid-real-in-unit
        type: rule
        text: Avoid contacting real databases or search clusters from unit tests; restrict such connectivity to integration
          and E2E suites.
  - id: pooling-anti-patterns
    index: 7
    title: Anti-patterns to avoid
    category: warning
    summary: Common mistakes when working with pools and long-lived clients.
    items:
      - id: anti.per-request-pools
        type: anti_pattern
        text: Creating connection pools or HTTP clients inside route handlers or per-request code paths.
      - id: anti.bypassing-pool
        type: anti_pattern
        text: Opening new database or HTTP connections for every operation instead of reusing pool-managed connections.
      - id: anti.oversized-pools
        type: anti_pattern
        text: Configuring excessively large pool sizes without regard for backend limits, which can starve other services
          and hide performance problems.
      - id: anti.no-timeouts
        type: anti_pattern
        text: Failing to configure acquire or request timeouts, causing requests to hang when backends are slow or unreachable.
      - id: anti.no-cleanup
        type: anti_pattern
        text: Neglecting to close pools and clients during shutdown, leading to leaked sockets, file descriptors, or threads.
  - id: monitoring-and-security
    index: 8
    title: Monitoring and security considerations
    category: standard
    summary: Observability and security practices for pooled resources.
    items:
      - id: monitoring.logs-metrics
        type: rule
        text: Emit structured logs for pool initialization, timeouts, acquire failures, and backend errors, and record metrics
          for pool utilization, queue wait times, and backend latency where available.
      - id: monitoring.tuning-feed
        type: note
        text: Use monitoring signals such as timeouts, queue lengths, and error rates as primary input when tuning pool sizes,
          timeouts, and retry policies.
      - id: security.no-credential-logging
        type: rule
        text: Avoid logging raw connection strings, credentials, or hostnames; follow Settings conventions that mark sensitive
          fields as non-repr.
      - id: security.config-through-settings
        type: rule
        text: Store credentials and hosts exclusively in configuration surfaced via Settings and never hard-code them in code
          or tests.
