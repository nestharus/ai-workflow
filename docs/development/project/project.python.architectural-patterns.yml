doc_id: project-python-architectural-patterns
title: Python Layered Architecture Patterns
version_hint: 2024-2025
kind: layered_architecture_guide
description: >
  Layered architecture patterns for separation of concerns, testability, and maintainability across handlers, services,
  repositories, and contracts/DTOs, with a typical FastAPI request lifecycle walkthrough as illustrative context.
scope: >
  Establishes high-level architectural layers, their responsibilities, allowed call directions, and dependency flow
  principles applicable to any Python web application. Includes a FastAPI request lifecycle walkthrough and router layer
  guidance as concrete examples of these patterns in practice. For deeper FastAPI-specific wiring (APIRouter
  configuration,
  Depends() patterns, middleware registration), see project/project.fastapi.architectural-patterns.yml.
domain:
  - python
  - fastapi
primary_runtime_references:
  - path: app/services/example_service.py
    role: Service layer implementation example.
  - path: app/repositories/example_repository.py
    role: Repository layer implementation example.
  - path: app/contracts/example_contract.py
    role: Contract/DTO layer implementation example.
  - path: app/core/errors.py
    role: Domain error definitions.
related_pattern_docs:
  - project/project.fastapi.architectural-patterns.yml
  - project/project.python.service-patterns.yml
  - project/project.python.repository-patterns.yml
  - project/project.python.exception-patterns.yml
sections:
  - id: layer-overview
    index: 1
    title: Layer overview and call directions
    category: architecture
    summary: >
      The architecture enforces strict unidirectional dependencies to ensure testability and separation of concerns.
    rules:
      - id: overview.layers
        rule: >
          'The application is organized into four primary layers: Routers (HTTP), Services (business logic),
          Repositories
          (data access), and Contracts/DTOs (data structures).'
      - id: overview.call-direction
        rule: >
          'Allowed call direction is strictly downward: Routers -> Services -> Repositories. Upper layers may depend on
          lower layers, but never the reverse.'
      - id: overview.contracts-shared
        rule: >
          Contracts/DTOs are shared across all layers for type safety; they define the data shapes passed between
          layers.
      - id: overview.no-skip-layers
        rule: >
          Routers must not call repositories directly; all data access must go through services to maintain business
          logic
          centralization.
      - id: overview.transport-boundary
        rule: >
          Only handlers handle transport concerns (HTTP status codes, headers, request/response objects, message queue
          acknowledgments); services and repositories are transport-agnostic.
      - id: overview.di-flow
        rule: >
          Dependencies flow via constructor injection; infrastructure resources (pools, clients) are created at
          application
          startup and injected into repositories and services.
      - id: overview.http-boundary
        rule: >
          Only routers handle HTTP concerns (status codes, headers, request/response objects); services and repositories
          are HTTP-agnostic.
      - id: overview.di-wiring
        rule: >
          Dependencies flow via constructor injection; the application factory in app/core/factory.py wires
          infrastructure
          (pools, wrappers) into repositories and services.
      - id: overview.testability
        rule: >
          Each layer can be tested in isolation by mocking the layer below; this is the primary benefit of strict layer
          separation.
  - id: layer-responsibilities
    index: 2
    title: Layer responsibilities
    category: architecture
    summary: Each layer has distinct responsibilities that must not leak into other layers.
    rules:
      - id: responsibilities.handlers
        rule: >
          'Handlers/Presentation Layer: Handle request/response lifecycle, validate input using framework mechanisms,
          delegate all processing to services, return response models.'
      - id: responsibilities.handlers-no-logic
        rule: >
          Handlers contain no business logic; they are thin wrappers that translate transport input to service calls and
          service output to transport responses.
      - id: responsibilities.services
        rule: >
          'Services Layer: Encapsulate business logic, orchestrate repository calls, define transaction boundaries,
          raise
          domain-specific exceptions, remain transport-agnostic.'
      - id: responsibilities.services-coordination
        rule: >
          Services may call multiple repositories and external clients; they own units of work and coordinate complex
          operations across data stores.
      - id: responsibilities.repositories
        rule: >
          'Repositories Layer: Encapsulate data access, hide storage implementation details, return domain models, never
          commit or roll back transactions.'
      - id: responsibilities.repositories-abstraction
        rule: Repository protocols (typing.Protocol) enable substitution with fakes or mocks for service unit testing.
      - id: responsibilities.contracts
        rule: |
          'Contracts/DTOs Layer: Define data structures and validation rules shared across layers using Pydantic
          models.'
      - id: responsibilities.contracts-validation
        rule: >
          Use strict Pydantic configuration (ConfigDict with extra="forbid") to reject unknown fields and enforce data
          integrity.
  - id: request-lifecycle
    index: 3
    title: Typical request lifecycle
    category: architecture
    summary: Describes the flow of a typical HTTP request through all architectural layers.
    items:
      - id: lifecycle.step1
        note: 1. Request arrives at FastAPI; middleware (logging, security headers, error handling) processes it first.
      - id: lifecycle.step2
        note: 2. FastAPI matches the route and invokes the router handler with validated path/query/body parameters.
      - id: lifecycle.step3
        note: 3. Router handler uses Depends() to obtain service instances (constructed with injected repositories).
      - id: lifecycle.step4
        note: 4. Router calls service method(s), passing validated contract DTOs.
      - id: lifecycle.step5
        note: 5. Service orchestrates business logic, calling one or more repositories for data access.
      - id: lifecycle.step6
        note: >
          6. Repositories execute queries against SurrealDB, Elasticsearch, or other stores and return domain models.
      - id: lifecycle.step7
        note: 7. Service returns result to router; router returns Pydantic response model to FastAPI.
      - id: lifecycle.step8
        note: 8. FastAPI serializes response; middleware processes outgoing response (compression, headers).
  - id: dependency-flow
    index: 4
    title: Dependency flow and injection principles
    category: architecture
    summary: Dependencies flow downward via constructor injection, enabling testability and explicit composition.
    rules:
      - id: di.constructor-injection
        rule: >
          Dependencies flow via constructor injection; services receive repositories via constructors, handlers receive
          services via framework DI mechanisms.
      - id: di.infrastructure
        rule: >
          Infrastructure resources (connection pools, HTTP clients) are created at application startup and injected into
          repositories or services as constructor arguments.
      - id: di.factory-functions
        rule: >
          Factory functions compose dependencies, constructing services with their required repositories and
          configuration.
      - id: di.no-globals
        rule: >
          Avoid module-level global state; all dependencies should be explicitly passed through constructors or factory
          functions.
      - id: di.testability
        rule: >
          Each layer can be tested in isolation by mocking the layer below; services mock repositories, handlers mock
          services.
      - id: di.lifecycle
        rule: >
          Resource lifecycle (initialization, cleanup) is managed by the application factory or lifespan manager, not
          by individual services or repositories.
  - id: anti-patterns
    index: 5
    title: Anti-patterns
    category: anti_patterns
    summary: Common pitfalls that undermine layered architecture design.
    anti_patterns:
      - id: anti.layer-skipping
        anti_pattern: >
          Layer skipping (handlers calling repositories directly) bypasses business logic centralization and makes
          testing
          harder.
      - id: anti.logic-in-handlers
        anti_pattern: |
          Business logic in handlers violates separation of concerns and makes logic harder to reuse and test.
      - id: anti.transport-in-services
        anti_pattern: >
          HTTP or transport concerns in services or repositories couples them to specific frameworks and prevents reuse.
      - id: anti.global-state
        anti_pattern: Global state instead of dependency injection hides dependencies and makes testing unreliable.
      - id: anti.mixed-responsibilities
        anti_pattern: >
          Mixed responsibilities within a single layer (e.g., services handling HTTP exceptions) violates single
          responsibility
          principle.
      - id: anti.upward-dependencies
        anti_pattern: >
          Upward dependencies (repositories importing services, services importing handlers) create circular
          dependencies
          and coupling.
  - id: routers-layer
    index: 3
    title: Routers layer
    category: layer_definition
    summary: >
      Handle HTTP request/response lifecycle using APIRouter instances registered in app/core/factory.py. See
      app/routes/example_router.py
      for a reference implementation.
    rules:
      - id: routers.role
        rule: Handle HTTP request/response lifecycle exclusively; routers are the entry point for HTTP concerns.
      - id: routers.pattern
        rule: Use APIRouter instances registered in app/core/factory.py; never attach routes directly to the app object.
      - id: routers.no-business-logic
        rule: No business logic in routers; delegate all processing to the service layer.
      - id: routers.response-model
        rule: >
          Use Pydantic models for response_model and include summary, description, and responses for OpenAPI
          documentation.
      - id: routers.error-handling
        rule: >
          Let services raise domain exceptions; global exception handlers (registered in factory) translate them to HTTP
          responses.
      - id: routers.dependencies
        rule: >
          Use FastAPI Depends() with Annotated type aliases to inject services; routers should not construct services
          directly.
  - id: services-layer
    index: 4
    title: Services layer
    category: layer_definition
    summary: >
      Encapsulate business logic with class-based services and dependency injection. See app/services/example_service.py
      for a reference implementation.
    rules:
      - id: services.role
        rule: Encapsulate all business logic; services are the heart of the application.
      - id: services.pattern
        rule: Implement services as classes with constructor-based dependency injection.
      - id: services.lifecycle.init
        rule: Use __init__ to initialize dependencies explicitly via constructor parameters.
      - id: services.lifecycle.process
        rule: >
          Implement core logic in named methods representing business actions (verbs like create, process, calculate).
      - id: services.lifecycle.shutdown
        rule: Provide an optional shutdown() method for cleanup of resources when needed.
      - id: services.orchestration
        rule: >
          Services may call multiple repositories and external clients; they own transaction boundaries and coordinate
          units of work.
      - id: services.domain-errors
        rule: >
          Raise domain-specific exceptions (from app/core/errors.py) rather than HTTP exceptions; see
          exception-patterns.md
          for the error hierarchy.
  - id: repositories-layer
    index: 5
    title: Repositories layer
    category: layer_definition
    summary: >
      Provide storage-agnostic data access abstraction over SurrealDB, Elasticsearch, and future stores. See
      app/repositories/example_repository.py
      for a reference implementation.
    rules:
      - id: repositories.role
        rule: >
          Encapsulate all direct database and search index interactions; hide storage details behind stable Python
          interfaces.
      - id: repositories.pattern
        rule: >
          Define repository protocols (typing.Protocol) and implement concrete classes that accept connection pools via
          constructor.
      - id: repositories.domain-mapping
        rule: >
          Return domain models or DTOs (Pydantic models from app/contracts/), not raw database rows or driver-specific
          structures.
      - id: repositories.no-transactions
        rule: Repositories must not commit or roll back transactions; transaction boundaries are owned by services.
      - id: repositories.http-agnostic
        rule: Repositories never import FastAPI or raise HTTP exceptions; they are unaware of the transport layer.
      - id: repositories.testability
        rule: Repository protocols enable easy substitution with fakes or mocks for service unit testing.
  - id: contracts-layer
    index: 6
    title: Contracts and DTOs layer
    category: layer_definition
    summary: >
      Define data structures and validation rules using Pydantic models with strict configuration. See
      app/contracts/example_contract.py
      for a reference implementation.
    rules:
      - id: contracts.role
        rule: Define data structures and validation rules for request/response payloads and internal data transfer.
      - id: contracts.pattern
        rule: Use Pydantic models with strict configuration (ConfigDict) for all contracts.
      - id: contracts.extra-forbid
        rule: Always set ConfigDict(extra="forbid") to reject unknown fields in JSON payloads.
      - id: contracts.validation
        rule: >
          Use Annotated and Field for validation constraints; define custom validators (@model_validator) for complex
          logic.
      - id: contracts.shared
        rule: >
          Contracts are shared across layers; routers use them for request/response, services for internal transfer,
          repositories
          for domain models.
  - id: cross-cutting-concerns
    index: 7
    title: Cross-cutting concerns
    category: architecture
    summary: Middleware and exception handling span all layers and are configured in the application factory.
    rules:
      - id: crosscutting.middleware
        rule: >
          Middleware (logging, security headers, compression) is registered in app/core/factory.py and processes
          requests
          before routers and responses after serialization. See middleware-patterns.md.
      - id: crosscutting.exception-handlers
        rule: >
          Global exception handlers translate domain errors to HTTP responses; they are registered in the application
          factory and documented in exception-patterns.md.
      - id: crosscutting.lifespan
        rule: >
          Application lifespan events (startup/shutdown) initialize and clean up infrastructure resources (connection
          pools, search clients) in app/core/factory.py.
      - id: crosscutting.settings
        rule: >
          Configuration flows from a single Settings instance created at startup; it is injected into services and
          infrastructure
          via dependency injection.
      - id: crosscutting.health-checks
        rule: >
          Health endpoints (/health for liveness, /api/v1/health for readiness) are registered separately from domain
          routers and documented in project/project.fastapi.api-patterns.yml.
