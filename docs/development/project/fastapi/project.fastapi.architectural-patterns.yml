doc_id: project-fastapi-architectural-patterns
title: FastAPI Layered Architecture Integration (Project Wiring)
version_hint: 2024-2025
kind: fastapi_architecture_integration
description: Project-specific FastAPI wiring for layered architecture with APIRouter, Depends(), middleware, lifespan management,
  and application factory.
