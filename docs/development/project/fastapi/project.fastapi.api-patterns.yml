doc_id: project-fastapi-api-patterns
title: FastAPI API Patterns (Project Wiring)
version_hint: 2024-2025
kind: fastapi_api_standards
description: Project-specific FastAPI wiring for API construction, validation handling, and router registration.
scope: Project-specific implementation wiring. For general FastAPI patterns, see general.fastapi.api-patterns.yml.
primary_runtime_references:
  - path: app/core/factory.py
    role: FastAPI application construction, default response class, and custom OpenAPI schema.
  - path: app/core/exceptions.py
    role: Global request validation handler.
  - path: app/api/v1/router.py
    role: Versioned API router registration.
  - path: app/contracts/errors.py
    role: HTTP validation error contracts and VALIDATION_ERROR_RESPONSE.
related_pattern_docs:
  - general/fastapi/general.fastapi.api-patterns.yml
  - project/fastapi/project.fastapi.router-patterns.yml
  - project/fastapi/project.fastapi.factory-patterns.yml
  - project/fastapi/project.fastapi.exception-patterns.yml
sections:
  - id: fastapi-application-construction
    index: 1
    title: FastAPI application construction
    category: standard
    summary: Project-specific wiring for create_app.
    items:
      - id: construction.response-class-wiring
        type: rule
        text: See project.fastapi.factory-patterns.yml for create_app configuration of ORJSONResponse as default_response_class.
      - id: construction.version-prefix-wiring
        type: rule
        text: See project.fastapi.factory-patterns.yml for /api/{version} mounting in create_app.
  - id: validation-error-handling
    index: 2
    title: Validation error handling
    category: standard
    summary: Project-specific validation handler wiring.
    items:
      - id: validation.handler-wiring
        type: rule
        text: See project.fastapi.exception-patterns.yml for validation_exception_handler registration and AppError envelope
          configuration in app/core/exceptions.py.
  - id: response-model-configuration
    index: 3
    title: Response model configuration
    category: standard
    summary: Project-specific validation response constant.
    items:
      - id: response.validation-response-wiring
        type: rule
        text: See project.fastapi.exception-patterns.yml for VALIDATION_ERROR_RESPONSE usage from app/contracts/errors.py.
  - id: openapi-documentation
    index: 4
    title: OpenAPI documentation standards
    category: standard
    summary: Project-specific error schema registration.
    items:
      - id: openapi.errors.schema-registration-wiring
        type: rule
        text: See project.fastapi.factory-patterns.yml for AppError and HTTPValidationError schema registration in create_app.
  - id: router-registration
    index: 5
    title: Router registration
    category: standard
    summary: Project-specific router wiring.
    items:
      - id: registration.versioned-mount-wiring
        type: rule
        text: See project.fastapi.factory-patterns.yml for app.include_router(api_router, prefix=settings.api_prefix) in create_app.
      - id: registration.router-inclusion-wiring
        type: rule
        text: See project.fastapi.router-patterns.yml for domain router inclusion in app/api/v1/router.py.
  - id: response-serialization
    index: 6
    title: Response serialization
    category: standard
    summary: Project-specific serialization wiring.
    items:
      - id: serialization.orjson-wiring
        type: rule
        text: See project.fastapi.factory-patterns.yml for ORJSONResponse configuration in create_app.
      - id: serialization.compression-wiring
        type: rule
        text: See project.fastapi.middleware-patterns.yml for gzip middleware configuration in create_app.
  - id: deprecation-metadata
    index: 7
    title: Deprecation metadata
    category: standard
    summary: Project-specific deprecation header implementation.
    items:
      - id: deprecation.headers-wiring
        type: rule
        text: See project.python.api-patterns.yml for Deprecation and Sunset header implementation.
