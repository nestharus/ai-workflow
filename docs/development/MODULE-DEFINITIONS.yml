- id: section-5-cross-reference-quality-rules
  index: 21
  title: 'Section 5: Cross-Reference Quality Rules'
  category: reference
  summary: ''
  items:
  - id: section-5-cross-reference-quality-rules-1
    type: text
    text: 'PROJECT files often reference other files or modules. Follow these rules for quality cross-references:'
- id: rule-1-explain-the-implementation
  index: 22
  title: 'Rule 1: Explain the Implementation'
  category: standard
  summary: ''
  items:
  - id: rule-1-explain-the-implementation-1
    type: rule
    text: Don't just point to a file; explain what it does.
  - id: rule-1-explain-the-implementation-bad
    title: Bad
    items:
    - id: rule-1-explain-the-implementation-code-3
      type: code
      text: |
        - id: response-serialization
          content: "See project.fastapi.factory-patterns.yml for ORJSONResponse configuration."
  - id: rule-1-explain-the-implementation-good
    title: Good
    items:
    - id: rule-1-explain-the-implementation-code-5
      type: code
      text: |
        - id: response-serialization
          content: |
            ORJSONResponse is configured as default_response_class in the create_app
            function (app/core/factory.py) via FastAPI(default_response_class=ORJSONResponse).
            This enables automatic orjson serialization for all endpoints without per-route configuration.
- id: rule-2-include-the-file-path
  index: 23
  title: 'Rule 2: Include the File Path'
  category: standard
  summary: ''
  items:
  - id: rule-2-include-the-file-path-1
    type: rule
    text: Always include the concrete file path.
  - id: rule-2-include-the-file-path-bad
    title: Bad
    items:
    - id: rule-2-include-the-file-path-code-3
      type: code
      text: |
        - id: error-handling
          content: "Errors are handled centrally."
  - id: rule-2-include-the-file-path-good
    title: Good
    items:
    - id: rule-2-include-the-file-path-code-5
      type: code
      text: |
        - id: error-handling
          content: "Errors are handled centrally in app/core/errors.py."
- id: rule-3-include-function-class-or-field-name
  index: 24
  title: 'Rule 3: Include Function, Class, or Field Name'
  category: standard
  summary: ''
  items:
  - id: rule-3-include-function-class-or-field-name-1
    type: text
    text: Help readers find the exact location.
  - id: rule-3-include-function-class-or-field-name-bad
    title: Bad
    items:
    - id: rule-3-include-function-class-or-field-name-code-3
      type: code
      text: |
        - id: app-factory
          content: "See app/core/factory.py for application setup."
  - id: rule-3-include-function-class-or-field-name-good
    title: Good
    items:
    - id: rule-3-include-function-class-or-field-name-code-5
      type: code
      text: |
        - id: app-factory
          content: "The create_app function in app/core/factory.py sets up the application."
- id: rule-4-describe-what-it-does
  index: 25
  title: 'Rule 4: Describe What It Does'
  category: standard
  summary: ''
  items:
  - id: rule-4-describe-what-it-does-1
    type: text
    text: Explain the purpose, not just the location.
  - id: rule-4-describe-what-it-does-bad
    title: Bad
    items:
    - id: rule-4-describe-what-it-does-code-3
      type: code
      text: |
        - id: middleware-setup
          content: "Middleware is configured in app/core/factory.py."
  - id: rule-4-describe-what-it-does-good
    title: Good
    items:
    - id: rule-4-describe-what-it-does-code-5
      type: code
      text: |
        - id: middleware-setup
          content: |
            Middleware is registered in the create_app function (app/core/factory.py):
            - CORSMiddleware for cross-origin requests
            - RequestLoggingMiddleware for request/response logging
            - ErrorHandlingMiddleware for exception translation
- id: rule-5-explain-why-its-relevant
  index: 26
  title: 'Rule 5: Explain Why It''s Relevant'
  category: standard
  summary: ''
  items:
  - id: rule-5-explain-why-its-relevant-1
    type: text
    text: Connect the reference to the current pattern.
  - id: rule-5-explain-why-its-relevant-bad
    title: Bad
    items:
    - id: rule-5-explain-why-its-relevant-code-3
      type: code
      text: |
        - id: router-mounting
          content: "Routers are mounted in create_app."
  - id: rule-5-explain-why-its-relevant-good
    title: Good
    items:
    - id: rule-5-explain-why-its-relevant-code-5
      type: code
      text: |
        - id: router-mounting
          content: |
            Routers are mounted in the create_app function (app/core/factory.py) using
            app.include_router(). This centralizes route registration and ensures
            consistent prefix application (/api/v1).
  - id: rule-5-explain-why-its-relevant-6
    type: text
    text: '---'
