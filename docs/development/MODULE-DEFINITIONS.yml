doc_id: original-development-module-definitions
title: Module Definitions
description: This document serves as the authoritative reference for domain definitions, scope definitions, and pattern
  definitions. It is the foundation for semantic classification by the knowledge-analyzer agent and validation tooling.
domain: []
scope: project
sections:
  - id: section-1-domain-descriptions
    index: 1
    title: 'Section 1: Domain Descriptions'
    category: standard
    content:
      - id: section-1-domain-descriptions-1
        text: Domains are independent tags for classification and searching. Content can have multiple domains.
  - id: domain-registry
    index: 2
    title: Domain Registry
    category: standard
    content:
      - id: domain-registry-1
        text: |
          Domain registry:
          - rest: HTTP/REST protocol rules, URL structure, status codes, HTTP methods
          - fastapi: FastAPI framework patterns, decorators, dependencies
          - python: Python language conventions, async/await, type hints
          - surrealdb: SurrealDB database patterns, SurrealQL, client usage
          - elasticsearch: Elasticsearch patterns, queries, client usage
      - id: domain-registry-2
        text: |
          Canonical Reference: See `docs/development/domain-definitions.yml` for the
          authoritative domain registry with full descriptions.
  - id: section-2-multi-domain-tagging
    index: 3
    title: 'Section 2: Multi-Domain Tagging'
    category: standard
    content:
      - id: section-2-multi-domain-tagging-1
        example: |
          Domains are independent tags. Content mentioning multiple domains (REST URL + FastAPI mounting) gets all
          relevant
          tags (`['rest', 'fastapi']`). No precedence or single-domain rule. Classifier outputs represent applied domain
          tags as a `domains` field containing a list (e.g., `"domains": ["rest", "fastapi"]`).
  - id: section-3-scope-definitions
    index: 4
    title: 'Section 3: Scope Definitions'
    category: standard
    content:
      - id: section-3-scope-definitions-1
        text: Every file is either GENERAL (reusable knowledge) or PROJECT (project-specific knowledge).
  - id: general-scope
    index: 5
    title: GENERAL Scope
    category: standard
    content:
      - id: general-scope-definition-knowledge-that
        definition: 'Definition: Knowledge that applies to any project using the same technology stack.'
      - id: general-scope-includes
        title: Includes
        includes:
          - id: general-scope-resthttp-protocol-rules
            text: REST/HTTP protocol rules
          - id: general-scope-fastapi-framework-best-practic
            text: FastAPI framework best practices
          - id: general-scope-python-language-conventions
            text: Python language conventions
          - id: general-scope-database-patterns-surrealdb
            text: Database patterns (SurrealDB, Elasticsearch)
          - id: general-scope-content-that-does-not-referenc
            text: Content that does not reference `app/*` paths (necessary but not sufficient—see note below)
      - id: general-scope-excludes
        title: Excludes
        excludes:
          - id: general-scope-references-to-app-paths
            text: References to `app/*` paths
          - id: general-scope-project-specific-components
            text: Project-specific components (`AppError`, `create_app`, `RepositoryBase`)
          - id: general-scope-implementation-wiring-specific
            text: Implementation wiring specific to this project
          - id: general-scope-project-specific-naming-conven
            text: Project-specific naming conventions
      - id: general-scope-13
        rule: |
          Note: The absence of these exclusions (e.g., no `app/*` references) is necessary for GENERAL scope but not
          sufficient. Content must also pass the test question: "Could this rule apply to a different project using the
          same
          stack?"
      - id: general-scope-test-question-could-this
        text: 'Test Question: "Could this rule apply to a different project using the same stack?"'
      - id: general-scope-examples
        title: Examples - GENERAL
        examples:
          - id: general-scope-example-url-versioning
            file: general.rest.api-patterns.yml
            code: |
              - id: url-versioning
                content: "Use /api/{version} prefix for API versioning"
                # Applies to any REST API project
          - id: general-scope-example-router-prefix
            file: general.fastapi.router-patterns.yml
            code: |
              - id: router-prefix
                content: "Use prefix parameter in APIRouter for route grouping"
                # Applies to any FastAPI project
          - id: general-scope-example-google-style
            file: general.python.docstrings-guide.yml
            code: |
              - id: google-style
                content: "Use Google-style docstrings for functions"
                # Applies to any Python project
  - id: project-scope
    index: 6
    title: PROJECT Scope
    category: standard
    content:
      - id: project-scope-definition-knowledge-spec
        definition: |
          Definition: Knowledge specific to this project's implementation.
      - id: project-scope-includes
        title: Includes
        includes:
          - id: project-scope-concrete-app-paths-eg
            example: Concrete `app/*` paths (e.g., `app/core/factory.py`)
          - id: project-scope-project-specific-components
            text: Project-specific components (`AppError`, `create_app`, `RepositoryBase`)
          - id: project-scope-implementation-wiring-how-com
            text: Implementation wiring (how components are connected)
          - id: project-scope-project-specific-conventions-a
            text: Project-specific conventions and decisions
      - id: project-scope-excludes
        title: Excludes
        excludes:
          - id: project-scope-restating-general-principles
            text: Restating GENERAL principles
          - id: project-scope-generic-framework-documentatio
            text: Generic framework documentation
          - id: project-scope-language-tutorials
            text: Language tutorials
      - id: project-scope-11
        rule: |
          Note: PROJECT content should reference GENERAL principles where applicable rather than restating them. PROJECT
          explains where and how general rules are implemented in this codebase.
      - id: project-scope-test-question-is-this-kn
        text: |
          Test Question: "Is this knowledge specific to this project's implementation (files, components, decisions, or
          conventions)?"
      - id: project-scope-examples
        title: Examples - PROJECT
        examples:
          - id: project-scope-example-create-app
            file: project.fastapi.factory-patterns.yml
            code: |
              - id: create-app-function
                content: "The create_app function in app/core/factory.py constructs the FastAPI application"
                # References specific file path
          - id: project-scope-example-app-error
            file: project.python.exception-patterns.yml
            code: |
              - id: app-error-usage
                content: "Use AppError from app/core/errors.py for all application errors"
                # References project-specific component
          - id: project-scope-example-repository-base
            file: project.surrealdb.repository-patterns.yml
            code: |
              - id: repository-base
                content: "All repositories inherit from RepositoryBase in app/repositories/base.py"
                # References project-specific base class
      - id: project-scope-15
        rule: |
          Important: While `app/*` references are a strong indicator of PROJECT scope, they are not the only way content
          can be project-specific. Project-specific decisions, conventions, or rules that don't happen to mention file
          paths
          are still PROJECT scope if they cannot reasonably apply to another project using the same stack. The flowchart
          below captures this logic: `app/*` references immediately classify content as PROJECT, but absence of such
          references triggers further questions to determine if the content is project-specific in other ways.
  - id: scope-decision-flowchart
    index: 7
    title: Scope Decision Flowchart
    category: workflow
    content:
      - id: scope-decision-flowchart-code-1
        code: |
          Is there a reference to app/* paths?
          ├── Yes → PROJECT
          └── No
              └── Does it reference a project-specific component?
                  ├── Yes → PROJECT
                  └── No
                      └── Could this apply to another project?
                          ├── Yes → GENERAL
                          └── No → PROJECT
