  - id: rule-1-explain-the-implementation
    index: 22
    title: 'Rule 1: Explain the Implementation'
    category: standard
    content:
      - id: rule-1-explain-the-implementation-1
        rule: Don't just point to a file; explain what it does.
      - id: rule-1-explain-the-implementation-bad
        title: Bad
        examples:
          - id: rule-1-explain-the-implementation-code-3
            text: |
              - id: response-serialization
                content: "See project.fastapi.factory-patterns.yml for ORJSONResponse configuration."
      - id: rule-1-explain-the-implementation-good
        title: Good
        examples:
          - id: rule-1-explain-the-implementation-code-5
            text: |
              - id: response-serialization
                content: |
                  ORJSONResponse is configured as default_response_class in the create_app
                  function (app/core/factory.py) via FastAPI(default_response_class=ORJSONResponse).
                  This enables automatic orjson serialization for all endpoints without per-route configuration.
  - id: rule-2-include-the-file-path
    index: 23
    title: 'Rule 2: Include the File Path'
    category: standard
    content:
      - id: rule-2-include-the-file-path-1
        rule: Always include the concrete file path.
      - id: rule-2-include-the-file-path-bad
        title: Bad
        examples:
          - id: rule-2-include-the-file-path-code-3
            text: |
              - id: error-handling
                content: "Errors are handled centrally."
      - id: rule-2-include-the-file-path-good
        title: Good
        examples:
          - id: rule-2-include-the-file-path-code-5
            text: |
              - id: error-handling
                content: "Errors are handled centrally in app/core/errors.py."
  - id: rule-3-include-function-class-or-field-name
    index: 24
    title: 'Rule 3: Include Function, Class, or Field Name'
    category: standard
    content:
      - id: rule-3-include-function-class-or-field-name-1
        text: Help readers find the exact location.
      - id: rule-3-include-function-class-or-field-name-bad
        title: Bad
        examples:
          - id: rule-3-include-function-class-or-field-name-code-3
            text: |
              - id: app-factory
                content: "See app/core/factory.py for application setup."
      - id: rule-3-include-function-class-or-field-name-good
        title: Good
        examples:
          - id: rule-3-include-function-class-or-field-name-code-5
            text: |
              - id: app-factory
                content: "The create_app function in app/core/factory.py sets up the application."
  - id: rule-4-describe-what-it-does
    index: 25
    title: 'Rule 4: Describe What It Does'
    category: standard
    content:
      - id: rule-4-describe-what-it-does-1
        text: Explain the purpose, not just the location.
      - id: rule-4-describe-what-it-does-bad
        title: Bad
        examples:
          - id: rule-4-describe-what-it-does-code-3
            text: |
              - id: middleware-setup
                content: "Middleware is configured in app/core/factory.py."
      - id: rule-4-describe-what-it-does-good
        title: Good
        examples:
          - id: rule-4-describe-what-it-does-code-5
            text: |
              - id: middleware-setup
                content: |
                  Middleware is registered in the create_app function (app/core/factory.py):
                  - CORSMiddleware for cross-origin requests
                  - RequestLoggingMiddleware for request/response logging
                  - ErrorHandlingMiddleware for exception translation
  - id: rule-5-explain-why-its-relevant
    index: 26
    title: 'Rule 5: Explain Why It''s Relevant'
    category: standard
    content:
      - id: rule-5-explain-why-its-relevant-1
        text: Connect the reference to the current pattern.
      - id: rule-5-explain-why-its-relevant-bad
        title: Bad
        examples:
          - id: rule-5-explain-why-its-relevant-code-3
            text: |
              - id: router-mounting
                content: "Routers are mounted in create_app."
      - id: rule-5-explain-why-its-relevant-good
        title: Good
        examples:
          - id: rule-5-explain-why-its-relevant-code-5
            text: |
              - id: router-mounting
                content: |
                  Routers are mounted in the create_app function (app/core/factory.py) using
                  app.include_router(). This centralizes route registration and ensures
                  consistent prefix application (/api/v1).
  - id: section-6-usage-guidelines
    index: 27
    title: 'Section 6: Usage Guidelines'
    category: guide
    content:
      - id: section-6-usage-guidelines-1
        text: Use this document for classification decisions.
  - id: classification-workflow
    index: 28
    title: Classification Workflow
    category: workflow
    content:
      - id: classification-workflow-identify-all-relevant-domains
        text: Identify All Relevant Domains
      - id: classification-workflow-2
        text: |
          Determine which domain(s) the content relates to: `rest`, `fastapi`, `python`, `surrealdb`, `elasticsearch`.
          Content can have multiple domains.
      - id: classification-workflow-apply-all-applicable-domain-ta
        text: Apply All Applicable Domain Tags
      - id: classification-workflow-if-content-relates-to-multiple
        text: If content relates to multiple domains, tag it with ALL of them
      - id: classification-workflow-do-not-reduce-to-a-single-doma
        rule: Do not reduce to a single domain—use multi-domain tagging (see Section 2)
      - id: classification-workflow-example-fastapi-route-with-ur
        example: |
          Example: FastAPI route with URL versioning → `['rest', 'fastapi']`
      - id: classification-workflow-determine-scope
        text: Determine Scope
      - id: classification-workflow-8
        text: 'Use Section 3 tests:'
      - id: classification-workflow-general-could-this-apply-to
        text: 'GENERAL: "Could this apply to a different project?"'
      - id: classification-workflow-project-does-this-reference
        text: 'PROJECT: "Does this reference a specific file or component?"'
      - id: classification-workflow-determine-pattern
        text: Determine Pattern
      - id: classification-workflow-use-section-4-test-questions
        text: Use Section 4 test questions
      - id: classification-workflow-match-content-to-the-pattern-w
        text: Match content to the pattern whose test question gets a "yes"
      - id: classification-workflow-consider-splitting
        text: Consider Splitting
      - id: classification-workflow-if-content-spans-multiple-scop
        text: If content spans multiple scopes or patterns, split into separate items
      - id: classification-workflow-each-item-should-have-a-single
        rule: Each item should have a single scope and pattern
      - id: classification-workflow-multi-domain-items-do-not-need
        rule: Multi-domain items do NOT need splitting—domains are independent tags
  - id: example-classification
    index: 29
    title: Example Classification
    category: example
    content:
      - id: example-classification-1
        text: |
          Content: "The `/api/v1` prefix is used for all API routes. Routers are mounted in `create_app` using
          `app.include_router(router, prefix='/api/v1')`."
      - id: example-classification-analysis
        title: Analysis
        analysis:
          - id: example-classification-domains-rest-fastapi
            text: |
              Domains: `['rest', 'fastapi']` — URL structure relates to REST, router mounting relates to FastAPI
          - id: example-classification-scope-references-create_app
            text: 'Scope: References `create_app` → PROJECT for the mounting part; URL convention → GENERAL'
          - id: example-classification-pattern-url-structure-api
            text: 'Pattern: URL structure → `api-patterns`; mounting → `factory-patterns`'
          - id: example-classification-decision-split-by-scope
            text: 'Decision: Split by scope (not by domain):'
          - id: example-classification-generalrestapi-patternsyml
            text: |
              `general.rest.api-patterns.yml`: URL versioning convention (domains: `['rest']`)
          - id: example-classification-projectfastapifactory-patte
            text: |
              `project.fastapi.factory-patterns.yml`: Router mounting implementation (domains: `['fastapi']`)
      - id: example-classification-9
        note: |
          Note: The split is based on scope (GENERAL vs PROJECT), not domain. If both parts were GENERAL, they could
          remain
          together with domains: `['rest', 'fastapi']`.
  - id: primary-consumer
    index: 30
    title: Primary Consumer
    category: standard
    content:
      - id: primary-consumer-1
        rule: |
          The knowledge-analyzer agent (`.claude/agents/knowledge-analyzer.md`) is the primary consumer of this
          document.
          The agent should:
      - id: primary-consumer-use-these-definitions-for-sema
        text: Use these definitions for semantic classification instead of keyword matching
      - id: primary-consumer-apply-all-relevant-domain-tags
        text: Apply all relevant domain tags to content (no single-domain resolution)
      - id: primary-consumer-use-test-questions-to-validate
        text: Use test questions to validate scope and pattern classifications
      - id: primary-consumer-reference-this-document-when-e
        text: Reference this document when explaining classification decisions
