doc_id: general-security-detect-secrets-guide
title: Detect-Secrets Guide
version_hint: 2024-2025
kind: security_guide
description: >
  Guide for using detect-secrets to prevent secrets from being committed to the repository,
  including inline allowlisting, baseline management, and CI integration.
scope: All developers working with this codebase must follow these practices to prevent credential leaks.
domain:
  - security
  - git
  - ci-cd
external_references:
  - url: https://github.com/Yelp/detect-secrets
    title: Detect-Secrets Official Repository
  - url: https://detect-secrets.readthedocs.io/
    title: Detect-Secrets Documentation

sections:
  - id: overview
    index: 1
    title: Overview
    category: standard
    summary: What detect-secrets is and why we use it.
    items:
      - id: what-is-detect-secrets
        title: What is detect-secrets?
        text: |
          Detect-secrets is an enterprise-friendly tool for preventing secrets from being
          committed to version control. It uses pattern matching and heuristics to identify
          potential secrets like API keys, passwords, tokens, and other credentials.

      - id: why-use-detect-secrets
        title: Why we use detect-secrets
        text: |
          Committing secrets to git repositories is a critical security risk. Even if a
          secret is later removed, it remains in the git history. Detect-secrets helps us:
        reasons:
          - Catch secrets before they are committed (pre-commit hook)
          - Prevent secrets in pull requests (CI checks)
          - Audit existing codebase for potential secrets (baseline scanning)
          - Maintain a secure development workflow with minimal friction

      - id: how-it-works
        title: How it works
        text: |
          Detect-secrets scans files for patterns that match known secret formats. When a
          potential secret is detected, it can be handled in three ways:
        methods:
          - Block the commit and require the secret to be removed
          - Allow the secret via inline comment (for false positives)
          - Add to the baseline file after manual audit (for known false positives)

      - id: companion-tool-gitleaks
        title: Companion tool - Gitleaks
        text: |
          This project uses both detect-secrets and gitleaks for defense-in-depth secret scanning.
          While detect-secrets uses baseline methodology and heuristics, gitleaks uses regex-based
          pattern matching. Both tools run in the lint pipeline and pre-commit hooks.
        cross_reference:
          text: For gitleaks usage, see the companion guide.
          link: general.security.gitleaks-guide.yml

  - id: inline-allowlisting
    index: 2
    title: Inline Allowlisting
    category: standard
    summary: How to use inline comments to mark false positives.
    items:
      - id: pragma-comment-syntax
        title: Pragma Comment Syntax
        text: |
          When detect-secrets flags a false positive (e.g., example code, test fixtures,
          or non-sensitive strings that match patterns), you can allowlist it with a
          pragma comment on the same line or the line immediately before.
        sample_code:
          description: Example of inline allowlisting with pragma comment.
          language: python
          code: |
            # This is a fake API key for documentation purposes
            EXAMPLE_API_KEY = "sk-1234567890abcdef"  # pragma: allowlist secret

            # Or on the line before:
            # pragma: allowlist secret
            TEST_TOKEN = "ghp_exampletoken123456789"

      - id: when-to-allowlist
        title: When to use inline allowlisting
        rules:
          - id: allowlist.examples
            rule: Example code or documentation that shows API key formats but contains fake values
          - id: allowlist.test-fixtures
            rule: Test fixtures with dummy credentials clearly marked as non-production
          - id: allowlist.placeholders
            rule: Placeholder strings that happen to match secret patterns (e.g., "YOUR_API_KEY_HERE")
          - id: allowlist.false-positives
            rule: High-entropy strings that are not actually secrets (e.g., base64-encoded test data)

      - id: when-not-to-allowlist
        title: When NOT to use inline allowlisting
        warnings:
          - id: no-real-secrets
            warning: NEVER allowlist actual secrets. Remove them and rotate the credentials.
          - id: no-convenience
            warning: Do not allowlist for convenience. If something looks like a secret, investigate it.
          - id: no-commit-real
            warning: |
              If you accidentally committed a real secret, do not allowlist it.
              See "Handling Real Secrets" section.

  - id: baseline-management
    index: 3
    title: Baseline Management
    category: standard
    summary: How to audit and update the .secrets.baseline file.
    items:
      - id: what-is-baseline
        title: What is the baseline file?
        text: |
          The `.secrets.baseline` file contains a list of all potential secrets that have
          been audited and deemed safe (false positives). This allows detect-secrets to
          skip these findings in future scans, reducing noise while maintaining security.

      - id: generating-baseline
        title: Generating the baseline
        text: |
          To create or update the baseline file, run the detect-secrets scan command:
        sample_code:
          description: Generate baseline file for the repository.
          language: bash
          code: |
            # Generate baseline (first time or full refresh)
            detect-secrets scan > .secrets.baseline

            # Update baseline with new findings
            detect-secrets scan --baseline .secrets.baseline

      - id: auditing-baseline
        title: Auditing the baseline
        text: |
          Before adding findings to the baseline, you MUST audit them to confirm they are
          not real secrets. Use the interactive audit command:
        sample_code:
          description: Audit baseline interactively to verify findings.
          language: bash
          code: |
            # Interactive audit - review each finding
            detect-secrets audit .secrets.baseline

            # This will prompt you to mark each finding as:
            # - True positive (real secret - DO NOT add to baseline)
            # - False positive (safe to allowlist)

      - id: baseline-workflow
        title: Baseline workflow
        steps:
          - id: step-1-scan
            step: Run detect-secrets scan to find new potential secrets
          - id: step-2-audit
            step: Use audit command to review each finding interactively
          - id: step-3-verify
            step: Verify that flagged items are NOT real secrets before marking as false positives
          - id: step-4-commit
            step: Commit the updated .secrets.baseline file with your changes
          - id: step-5-document
            step: Consider adding inline pragma comments for clarity on why something was allowlisted

      - id: baseline-best-practices
        title: Baseline best practices
        rules:
          - id: baseline.audit-always
            rule: Always audit findings before adding to baseline. Never blindly add items.
          - id: baseline.document
            rule: Add comments in code explaining why false positives were allowlisted.
          - id: baseline.review
            rule: Periodically review the baseline file to ensure it's still accurate.
          - id: baseline.minimize
            rule: Prefer inline pragma comments for one-off exceptions rather than baseline entries.

  - id: handling-real-secrets
    index: 4
    title: Handling Real Secrets
    category: standard
    summary: What to do when a real secret is detected.
    items:
      - id: real-secret-detected
        title: If detect-secrets flags a real secret
        text: |
          If detect-secrets identifies an actual secret in your code, follow these steps
          immediately. Do NOT attempt to allowlist or bypass the check.
        steps:
          - id: real-secret-step-1
            priority: CRITICAL
            step: Do NOT commit the secret. Remove it from your code immediately.

          - id: real-secret-step-2
            priority: CRITICAL
            step: |
              Rotate the secret. Assume it is compromised and generate a new credential.
              This applies even if the secret was never pushed to the remote repository.

          - id: real-secret-step-3
            priority: HIGH
            step: |
              Move the secret to a secure location: environment variables, secret management
              system (e.g., AWS Secrets Manager, HashiCorp Vault), or encrypted configuration.

          - id: real-secret-step-4
            priority: HIGH
            step: |
              Update your code to read the secret from the secure location at runtime rather
              than hardcoding it.

          - id: real-secret-step-5
            priority: MEDIUM
            step: |
              Check git history to ensure the secret was never committed. If it was, contact
              your security team immediately for incident response procedures.

      - id: secret-already-committed
        title: If a secret was already committed
        text: |
          If a real secret made it into git history (including remote branches):
        emergency_steps:
          - id: emergency-step-1
            urgency: IMMEDIATE
            action: Notify your security team or incident response contact immediately.

          - id: emergency-step-2
            urgency: IMMEDIATE
            action: Rotate the compromised credential. Assume it has been exposed.

          - id: emergency-step-3
            urgency: HIGH
            action: |
              Do NOT simply remove the secret in a new commit. It will remain in git history.
              Coordinate with your team to rewrite history (git filter-branch, BFG Repo-Cleaner)
              or consider the repository compromised.

          - id: emergency-step-4
            urgency: HIGH
            action: Review access logs for the compromised credential to check for unauthorized usage.

          - id: emergency-step-5
            urgency: MEDIUM
            action: Document the incident for post-mortem and process improvement.

      - id: secure-alternatives
        title: Secure alternatives to hardcoded secrets
        options:
          - id: env-vars
            option: Environment variables (.env files, never committed to git)
          - id: secret-manager
            option: Secret management systems (AWS Secrets Manager, Azure Key Vault, HashiCorp Vault)
          - id: config-files
            option: Encrypted configuration files (git-crypt, SOPS)
          - id: ci-secrets
            option: CI/CD platform secrets (GitHub Actions secrets, GitLab CI variables)
          - id: runtime-injection
            option: Runtime secret injection (Kubernetes secrets, Docker secrets)

  - id: ci-integration
    index: 5
    title: CI Integration
    category: standard
    summary: How detect-secrets runs in pre-commit hooks, lint pipelines, and CI.
    items:
      - id: lint-command
        title: Running detect-secrets via lint command
        text: |
          The canonical way to run the project-wide detect-secrets check is through the lint command.
          This integrates with the project's unified linting infrastructure and handles all configuration.
        sample_code:
          description: Run detect-secrets through the project lint command.
          language: bash
          code: |
            # Run detect-secrets check via lint command (recommended)
            uv run lint detect-secrets

            # Run all linters including detect-secrets
            uv run lint

      - id: lint-command-modes
        title: Lint command scanning modes
        text: |
          The lint command uses two different detect-secrets modes depending on whether
          specific files are provided:
        modes:
          - id: full-repo-scan
            mode: Full repository scan (no files specified)
            command: detect-secrets scan --baseline .secrets.baseline
            description: |
              Scans all tracked files in the repository and compares against the baseline.
              This is used for comprehensive CI checks and periodic security audits.

          - id: file-filtered-scan
            mode: File-filtered scan (specific files provided)
            command: detect-secrets-hook --baseline .secrets.baseline [files...]
            description: |
              Scans only the specified files using detect-secrets-hook, which is optimized
              for checking a subset of files (e.g., staged files or changed files in a PR).
        sample_code:
          description: Examples of both scanning modes via lint command.
          language: bash
          code: |
            # Full repository scan
            uv run lint detect-secrets

            # Scan specific files only (uses detect-secrets-hook internally)
            uv run lint detect-secrets --files path/to/file1.py path/to/file2.py

      - id: pre-commit-hook
        title: Pre-commit hook
        text: |
          Detect-secrets runs automatically as a pre-commit hook, scanning staged files
          before each commit. This provides the earliest possible feedback to prevent
          secrets from entering the repository.
        sample_code:
          description: Pre-commit hook configuration for detect-secrets.
          language: yaml
          code: |
            # .pre-commit-config.yaml
            repos:
              - repo: https://github.com/Yelp/detect-secrets
                rev: v1.5.0
                hooks:
                  - id: detect-secrets
                    args: ['--baseline', '.secrets.baseline']

      - id: pre-commit-workflow
        title: Pre-commit workflow
        text: |
          When you attempt to commit files, detect-secrets will:
        workflow:
          - id: pre-commit-scan
            action: Scan all staged files for potential secrets
          - id: pre-commit-check-baseline
            action: Compare findings against .secrets.baseline
          - id: pre-commit-check-pragma
            action: Skip findings with pragma allowlist comments
          - id: pre-commit-block
            action: Block the commit if new secrets are detected
          - id: pre-commit-fix
            action: Require you to either remove the secret or add an appropriate allowlist

      - id: bypassing-pre-commit
        title: Bypassing pre-commit (NOT recommended)
        text: |
          You can bypass pre-commit hooks with `git commit --no-verify`, but this is
          strongly discouraged for detect-secrets.
        warnings:
          - id: no-verify-danger
            warning: |
              Using --no-verify bypasses ALL pre-commit hooks, including detect-secrets.
              This can lead to secrets being committed. Only use in emergencies with
              explicit approval.

      - id: ci-pipeline-check
        title: CI pipeline checks
        text: |
          In addition to pre-commit hooks, detect-secrets runs in the CI pipeline to
          catch any secrets that may have bypassed local checks (e.g., via --no-verify
          or outdated hooks). The CI pipeline uses the project's lint command for
          consistent behavior with local development.
        sample_code:
          description: CI workflow step for detect-secrets using project lint command.
          language: yaml
          code: |
            # .github/workflows/lint.yml (recommended - uses project lint infrastructure)
            - name: Detect secrets
              run: uv run lint detect-secrets

            # Alternative: direct detect-secrets invocation
            # - name: Detect secrets
            #   run: detect-secrets scan --baseline .secrets.baseline

      - id: ci-failure-handling
        title: Handling CI failures
        text: |
          If the detect-secrets CI check fails:
        steps:
          - id: ci-failure-review
            step: Review the CI logs to identify which file(s) triggered the detection
          - id: ci-failure-verify
            step: Verify whether the flagged item is a real secret or false positive
          - id: ci-failure-action
            step: |
              If real secret: Follow "Handling Real Secrets" procedure. Do NOT merge the PR.
          - id: ci-failure-allowlist
            step: |
              If false positive: Add pragma comment or update baseline, commit the fix,
              and push to re-trigger CI.

      - id: keeping-hooks-updated
        title: Keeping hooks updated
        text: |
          Pre-commit hooks need to be installed locally and updated periodically.
        commands:
          - id: install-hooks
            description: Install pre-commit hooks
            command: pre-commit install
          - id: update-hooks
            description: Update hook versions
            command: pre-commit autoupdate
          - id: run-all
            description: Run all hooks on all files
            command: pre-commit run --all-files

  - id: troubleshooting
    index: 6
    title: Troubleshooting
    category: guidance
    summary: Common issues and solutions.
    items:
      - id: false-positive-handling
        title: Too many false positives
        text: |
          If detect-secrets is flagging too many false positives in your workflow:
        solutions:
          - Use inline pragma comments for specific instances
          - Update the baseline file after careful audit
          - Adjust detection plugins in configuration if a specific pattern is problematic
          - Use --exclude-files regex patterns to skip certain file types (e.g., --exclude-files '.*\.lock$')

      - id: hook-not-running
        title: Pre-commit hook not running
        text: |
          If the detect-secrets hook isn't running on commits:
        checks:
          - Verify hooks are installed with `pre-commit install`
          - Check .pre-commit-config.yaml exists and is properly configured
          - Ensure you're not using `--no-verify` flag
          - Update hooks with `pre-commit autoupdate`

      - id: baseline-conflicts
        title: Baseline file conflicts
        text: |
          If you encounter git conflicts in .secrets.baseline:
        resolution:
          - Accept both versions of the conflict
          - Run `detect-secrets scan --baseline .secrets.baseline` to regenerate
          - Audit any new findings
          - Commit the resolved baseline file

      - id: performance-issues
        title: Slow scanning on large repos
        text: |
          If scans are taking too long:
        optimizations:
          - Use --exclude-files to skip large binary files or dependencies (e.g., --exclude-files 'node_modules/.*')
          - Configure detect-secrets to skip certain directories via --exclude-files regex patterns
          - Run scans only on changed files in CI rather than entire repository
          - Consider using --baseline flag to skip known findings
