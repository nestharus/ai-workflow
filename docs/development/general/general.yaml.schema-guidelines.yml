doc_id: general-yaml-schema-guidelines
title: YAML Schema Guidelines
version_hint: 2024-2025
kind: schema_standard
description: |
  Guidelines for structuring YAML documentation files. The schema is intentionally
  flexible to allow natural YAML structures while requiring unique identifiers
  for change tracking and comparison.
scope: |
  All YAML documentation files in docs/, scripts/docs/, and tests/docs/. Applies
  to knowledge graph documents, pattern definitions, and any structured documentation.
  Excludes to_adapt/ directories.
domain:
  - yaml
  - documentation

sections:
  - id: core-principle
    index: 1
    title: Core Principle
    category: standard
    summary: Every object must have an id field.
    items:
      - id: core-principle-rule
        type: rule
        text: |
          Every dict/object in the YAML structure must have an `id` field populated.
          This is the only required field. All other structure is flexible.

  - id: why-ids-matter
    index: 2
    title: Why IDs Matter
    category: standard
    summary: IDs enable change tracking and comparison.
    items:
      - id: why-ids-change-tracking
        text: Enable tracking changes between document versions
      - id: why-ids-dict-comparison
        text: Allow dict-to-dict comparison (dict == dict) for detecting differences
      - id: why-ids-reference-stable
        text: Provide stable references for linking between documents
      - id: why-ids-granular-updates
        text: Support granular updates without affecting unrelated content

  - id: flexible-structure
    index: 3
    title: Flexible Structure
    category: standard
    summary: Structure adapts to content type.
    items:
      - id: flexible-structure-no-forced-wrapper
        text: |
          Do NOT force all content into {id, type, text} wrappers. Use natural YAML
          structures that match the data being represented.

  - id: examples
    index: 4
    title: Examples
    category: example
    summary: Correct and incorrect patterns.
    examples:
      - id: example-simple-text
        title: Simple text item
        correct:
          - id: my-rule
            text: This is a simple rule or statement.
        incorrect:
          - text: This rule has no id and cannot be tracked.

      - id: example-structured-data
        title: Structured data (tables, configs)
        correct:
          - id: http-method-get
            method: GET
            usage: Retrieve a resource
            success_status: 200
            error_statuses:
              - 404
        incorrect:
          - method: GET
            usage: Retrieve a resource
            success_status: 200

      - id: example-nested-items
        title: Nested items with titles
        correct:
          - id: section-includes
            title: Includes
            items:
              - id: includes-rest
                text: REST/HTTP protocol rules
              - id: includes-fastapi
                text: FastAPI framework practices
        incorrect:
          - id: section-includes
            type: text
            text: 'Includes:'
          - id: item-rest
            type: text
            text: REST/HTTP protocol rules

      - id: example-code-blocks
        title: Code blocks
        correct:
          - id: example-code-pagination
            type: code
            language: python
            text: |
              offset = (page - 1) * page_size
              results = query.offset(offset).limit(page_size)

  - id: id-naming-conventions
    index: 5
    title: ID Naming Conventions
    category: standard
    summary: How to generate meaningful IDs.
    items:
      - id: id-naming-kebab-case
        text: Use kebab-case (lowercase with hyphens)
      - id: id-naming-hierarchical
        text: Use hierarchical prefixes for context (section-subsection-item)
      - id: id-naming-descriptive
        text: Make IDs descriptive enough to understand without context
      - id: id-naming-stable
        text: Keep IDs stable across edits (don't renumber)
    examples:
      - id: id-naming-good-examples
        title: Good ID examples
        good:
          - http-method-get
          - url-versioning-rule
          - section-includes-rest-protocols
          - factory-patterns-purpose
        bad:
          - item-1
          - section-3-2
          - 42
          - ''

  - id: migration-from-strict-schema
    index: 6
    title: Migration from Strict Schema
    category: workflow
    summary: Converting {id, type, text} wrappers to natural structure.
    items:
      - id: migration-when-to-convert
        title: When to convert
        text: |
          Convert when the strict {id, type, text} structure obscures the natural
          data representation. Tables, configs, and structured data benefit most.

      - id: migration-preserve-ids
        title: Preserve existing IDs
        text: Keep existing id values when converting to maintain tracking continuity.

      - id: migration-add-missing-ids
        title: Add missing IDs
        text: |
          When objects lack ids, generate them using the naming conventions above.
          Base the id on the content or context.
