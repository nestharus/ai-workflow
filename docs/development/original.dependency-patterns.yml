doc_id: dependency-patterns
title: Dependency Injection Patterns
project: ai-workflow
version_hint: 2024-2025
kind: dependency_injection_standards
description: Standard patterns for dependency injection within the FastAPI application, leveraging FastAPI's DI system for
  modularity, testability, and separation of concerns.
scope: Covers DI fundamentals, Annotated type aliases, centralized dependency providers, database session dependencies, settings
  injection, service dependencies, request-scoped vs singleton lifecycles, dependency chains, router-level dependencies, testing
  with overrides, and anti-patterns.
primary_runtime_references:
  - path: app/api/v1/dependencies.py
    role: Centralized dependency providers and type aliases for versioned APIs.
  - path: app/core/dependencies.py
    role: Framework-agnostic providers such as get_settings.
  - path: app/infrastructure/db_connections.py
    role: Connection factories and SurrealDB/Elasticsearch wrappers used by dependencies.
  - path: app/core/factory.py
    role: Application startup wiring that populates app.state for dependency providers.
related_pattern_docs:
  - api-patterns.toon
  - router-patterns.toon
  - service-patterns.toon
  - factory-patterns.toon
sections:
  - id: di-fundamentals
    index: 1
    title: Dependency Injection Fundamentals
    category: standard
    summary: Core FastAPI DI concepts and how dependency trees are built per request.
    sample_code:
      description: Basic dependency that normalizes common query parameters and injects them into a route.
      imports:
        - fastapi.FastAPI
        - fastapi.Depends
        - typing.Optional
      code: |-
        from typing import Optional
        from fastapi import Depends, FastAPI
        app = FastAPI()
        def common_parameters(q: Optional[str] = None, skip: int = 0, limit: int = 100) -> dict:
            return {"q": q, "skip": skip, "limit": limit}
        @app.get("/items/")
        async def read_items(commons: dict = Depends(common_parameters)):
            return commons
    items:
      - id: fundamentals.depends-usage
        type: rule
        text: Declare dependencies in path operation signatures using fastapi.Depends() so FastAPI can resolve and inject
          them automatically for each request.
      - id: fundamentals.composition
        type: note
        text: Treat dependencies as composable building blocks; dependency functions and classes may themselves declare dependencies,
          forming a DAG.
      - id: fundamentals.async-support
        type: note
        text: Dependencies can be async def or plain def and FastAPI handles both styles transparently.
      - id: fundamentals.request-cache
        type: rule
        text: Rely on FastAPI’s per-request dependency cache, which ensures each dependency is resolved at most once per request
          unless use_cache=False is specified.
      - id: fundamentals.common-parameters-example
        type: pattern
        text: Use small helper dependencies such as common_parameters to share query parameter handling across endpoints.
      - id: fundamentals.http-surface
        type: note
        text: Design dependencies around HTTP concerns at the router boundary (for example pagination, authentication, headers)
          and separate them from pure domain services.
  - id: annotated-type-aliases
    index: 2
    title: Annotated Type Aliases (2024 Best Practice)
    category: standard
    summary: Using Annotated and Depends to define reusable dependency aliases.
    sample_code:
      description: Using Annotated type aliases for shared query and pagination dependencies.
      imports:
        - typing.Annotated
        - fastapi.Depends
        - fastapi.FastAPI
        - app.contracts.pagination.Pagination
        - typing.Optional
      code: |-
        from typing import Annotated, Optional
        from fastapi import Depends, FastAPI
        from app.contracts.pagination import Pagination
        app = FastAPI()
        def common_parameters(q: Optional[str] = None, skip: int = 0, limit: int = 100) -> dict:
            return {"q": q, "skip": skip, "limit": limit}
        def common_pagination_params(
            q: Optional[str] = None,
            page: int = 1,
            size: int = 50,
        ) -> Pagination:
            return Pagination(q=q, page=page, size=size)
        CommonsDep = Annotated[dict, Depends(common_parameters)]
        PageParams = Annotated[Pagination, Depends(common_pagination_params)]
        @app.get("/items/")
        async def read_items(commons: CommonsDep, page: PageParams):
            ...
    items:
      - id: annotated.pattern
        type: rule
        text: Use typing.Annotated with Depends to define reusable dependency type aliases such as CommonsDep and PageParams.
      - id: annotated.example-pagination
        type: note
        text: Wrap pagination logic in a dependency like common_pagination_params that returns a Pagination value object and
          expose it as a PageParams alias.
      - id: annotated.benefits-dry
        type: note
        text: Type aliases reduce repetition and keep route signatures concise while centralizing dependency wiring.
      - id: annotated.ide-support
        type: note
        text: Annotated aliases provide better IDE autocompletion and static checking because handlers see strongly typed
          parameters rather than raw Depends expressions.
      - id: annotated.storage-location
        type: rule
        text: Place shared dependency aliases next to their providers in app/api/v1/dependencies.py so routers import them
          from a single versioned module.
  - id: centralized-dependency-providers
    index: 3
    title: Centralized Dependency Providers
    category: standard
    summary: Organizing dependency providers and type aliases in app/api/v1/dependencies.py.
    sample_code:
      description: Centralized settings, pool, and service providers in app/api/v1/dependencies.py.
      imports:
        - typing.Annotated
        - fastapi.Depends
        - fastapi.Request
        - app.core.settings.Settings
        - app.core.dependencies.get_settings
        - app.infrastructure.db_connections.SurrealDBPool
        - app.infrastructure.db_connections.ElasticsearchWrapper
        - app.services.orchestrator_service.OrchestratorService
      code: |-
        from typing import Annotated
        from fastapi import Depends, Request
        from app.core.dependencies import get_settings
        from app.core.settings import Settings
        from app.infrastructure.db_connections import ElasticsearchWrapper, SurrealDBPool
        from app.services.orchestrator_service import OrchestratorService
        SettingsDep = Annotated[Settings, Depends(get_settings)]
        def get_surrealdb_pool(request: Request) -> SurrealDBPool:
            return request.app.state.surrealdb_pool
        def get_elasticsearch_client(request: Request) -> ElasticsearchWrapper:
            return request.app.state.elasticsearch_client
        def get_orchestrator_service(
            settings: SettingsDep,
            pool: Annotated[SurrealDBPool, Depends(get_surrealdb_pool)],
            search: Annotated[ElasticsearchWrapper, Depends(get_elasticsearch_client)],
        ) -> OrchestratorService:
            return OrchestratorService(settings=settings, db_pool=pool, search=search)
    items:
      - id: providers.central-file
        type: rule
        text: Centralize reusable dependency providers for a given API version in app/api/v1/dependencies.py rather than defining
          them inline in routers.
      - id: providers.layers
        type: note
        text: Organize providers into configuration (settings), infrastructure (database pools, search clients), and services
          (domain services built on repositories and infrastructure).
      - id: providers.lower-level
        type: note
        text: Expose framework-agnostic providers such as get_settings in app/core/dependencies.py and connection factories
          in app/infrastructure/db_connections.py, and build router-facing providers on top of them.
      - id: providers.router-import-surface
        type: rule
        text: Treat app/api/v1/dependencies.py as the DI surface imported by routers so they do not access app.state directly.
      - id: providers.app-state
        type: note
        text: Infrastructure providers typically read from request.app.state (for example surrealdb_pool and elasticsearch_client)
          to stay aligned with the application factory.
  - id: database-session-dependencies
    index: 4
    title: Database Session Dependencies
    category: standard
    summary: Yield-based dependencies for acquiring and releasing database connections.
    items:
      - id: db-session.yield-pattern
        type: rule
        text: Implement database session dependencies as async generators that yield a session (for example a Surreal connection)
          and ensure cleanup after the yield.
      - id: db-session.pool-acquire
        type: pattern
        text: Acquire connections from SurrealDBPool via async with pool.acquire() inside the dependency so sessions are request-scoped
          while the pool is shared.
      - id: db-session.exception-safety
        type: note
        text: The async context manager used in get_db_session ensures connections are returned to the pool even when downstream
          code raises exceptions.
      - id: db-session.thin-dependency
        type: rule
        text: Keep get_db_session thin; it should only acquire and release connections, leaving query logic and transactions
          to repositories and services.
  - id: settings-dependency
    index: 5
    title: Settings Dependency
    category: standard
    summary: Patterns for injecting and overriding the Settings model.
    items:
      - id: settings.lru-cache
        type: rule
        text: Implement get_settings in app/core/dependencies.py as an @lru_cache-decorated function that builds a single
          Settings instance from environment variables.
      - id: settings.route-usage
        type: pattern
        text: Inject Settings into routes using Annotated[Settings, Depends(get_settings)] so handlers do not construct Settings
          directly.
      - id: settings.test-overrides
        type: rule
        text: Override get_settings via app.dependency_overrides in tests to supply test-specific configuration and clear
          overrides after each test.
      - id: settings.no-globals
        type: rule
        text: Avoid importing or mutating a global Settings instance; rely on the cached dependency everywhere configuration
          is needed.
      - id: settings.debugging
        type: note
        text: Prefer toggling behavior through Settings fields such as include_error_body rather than patching module-level
          constants.
  - id: service-dependencies
    index: 6
    title: Service Dependencies
    category: standard
    summary: Service layer patterns and how services are injected into routers.
    items:
      - id: service.layer-pattern
        type: rule
        text: Adopt the Service Layer pattern where services encapsulate domain workflows and are injected into routers instead
          of being instantiated inside route handlers.
      - id: service.domain-errors
        type: rule
        text: Expect services to raise domain-specific exceptions (for example TicketNotFoundError or InvalidTransitionError)
          and avoid fastapi.HTTPException in service methods.
      - id: service.factory-functions
        type: pattern
        text: Define factory dependencies such as get_user_service that assemble service instances from lower-level dependencies
          like DB sessions and Settings.
      - id: service.router-usage
        type: note
        text: 'In routers, depend on services via Annotated types (service: Annotated[UserService, Depends(get_user_service)])
          and call service methods directly.'
      - id: service.testability
        type: note
        text: Override service factories with mocks or fakes in tests via app.dependency_overrides to test routers without
          modifying production code.
  - id: request-vs-singleton-dependencies
    index: 7
    title: Request-Scoped vs Singleton Dependencies
    category: standard
    summary: Understanding dependency lifecycles and how they map to resources.
    items:
      - id: lifecycle.singleton
        type: rule
        text: Treat Settings, connection pools (SurrealDBPool, ElasticsearchWrapper), and shared HTTP clients as singleton
          dependencies created once per application lifecycle.
      - id: lifecycle.request-scoped
        type: rule
        text: Treat DB sessions, current user context, and service instances that wrap request data as request-scoped dependencies
          created for each request.
      - id: lifecycle.management
        type: note
        text: Manage singleton resources via the lifespan startup/shutdown mechanism and request-scoped resources via yield-based
          dependencies that handle cleanup.
      - id: lifecycle.awareness
        type: note
        text: Be explicit about the lifecycle of each dependency to avoid accidentally sharing mutable state across requests.
  - id: dependency-chains
    index: 8
    title: Dependency Chains
    category: standard
    summary: Structuring multi-layer dependency graphs without creating cycles.
    items:
      - id: chains.structure
        type: note
        text: Compose dependency chains where routers depend on services, services depend on repositories, repositories depend
          on DB sessions, and DB sessions depend on connection pools.
      - id: chains.avoid-cycles
        type: rule
        text: Avoid circular dependencies between modules or providers; refactor shared logic into lower-level utilities or
          separate modules when cycles appear.
      - id: chains.depth-limit
        type: rule
        text: Keep dependency chain depth modest (ideally no more than two or three layers visible from a route) to aid readability
          and debugging.
      - id: chains.let-fastapi-resolve
        type: note
        text: Let FastAPI construct and cache dependency graphs; avoid manually instantiating deep chains inside route handlers.
  - id: router-level-dependencies
    index: 9
    title: Router-Level Dependencies
    category: standard
    summary: Applying cross-cutting concerns at the APIRouter level.
    items:
      - id: router-level.cross-cutting
        type: pattern
        text: Attach shared concerns such as authentication, rate limiting, or auditing at the APIRouter level via dependencies=[Depends(...)]
          instead of repeating them on each route.
      - id: router-level.execution-order
        type: note
        text: Router-level dependencies run before route-specific dependencies, ensuring that cross-cutting checks execute
          consistently for all endpoints in the router.
      - id: router-level.security
        type: rule
        text: Use Security() instead of Depends() for security schemes that carry scopes (for example OAuth2) while still
          attaching them at the router level.
      - id: router-level.api-keys
        type: note
        text: Wire API key–based dependencies (for example APIKeyHeader or APIKeyQuery) at the router level when they guard
          entire groups of endpoints.
  - id: testing-dependency-overrides
    index: 10
    title: Testing with Dependency Overrides
    category: testing
    summary: Testing strategies based on create_app and app.dependency_overrides.
    items:
      - id: testing.factory-app
        type: rule
        text: Construct FastAPI apps in tests using create_app with explicit Settings instances instead of importing an app
          from app.main.
      - id: testing.override-deps
        type: rule
        text: Use app.dependency_overrides to replace dependencies such as get_db_session, get_settings, or service factories
          with test doubles.
      - id: testing.override-example
        type: note
        text: Implement overrides as async dependencies that yield test resources (for example test_db_pool.acquire()) and
          clear app.dependency_overrides after each test.
      - id: testing.conftest-composition-root
        type: note
        text: Centralize common test wiring in tests/conftest.py, including fixtures like test_settings, test_app, async_client,
          live_server, and api_client.
      - id: testing.integration-vs-e2e
        type: note
        text: Use async_client plus dependency overrides for in-process integration tests and live_server plus api_client
          (with real backends) for end-to-end tests.
      - id: testing.no-global-state
        type: rule
        text: Avoid mutating global state in tests; rely on factory-created apps and dependency overrides instead.
  - id: dependency-anti-patterns
    index: 11
    title: Anti-Patterns to Avoid
    category: warning
    summary: Dependency injection mistakes that hurt testability and maintainability.
    items:
      - id: anti.create-deps-in-handlers
        type: anti_pattern
        text: Instantiating services, database clients, or HTTP clients directly inside route handlers instead of using dependencies.
      - id: anti.global-variables
        type: anti_pattern
        text: Using module-level global variables for stateful components rather than injecting them through FastAPI’s dependency
          system.
      - id: anti.missing-yield-cleanup
        type: anti_pattern
        text: Failing to use yield-based dependencies for resources that need cleanup, which leads to leaked connections or
          resources.
      - id: anti.circular-deps
        type: anti_pattern
        text: Introducing circular dependencies between providers or modules, indicating poor separation of concerns.
      - id: anti.over-nesting
        type: anti_pattern
        text: Creating extremely deep or tangled dependency chains that are hard to reason about; prefer clearer compositions
          with fewer layers.
