doc_id: fastapi-connection-pooling-patterns
title: FastAPI Connection Pooling Patterns
version_hint: 2024-2025
kind: fastapi_pooling_standards
description: FastAPI-specific patterns for integrating connection pools with lifespan management, app.state storage, dependency
  injection, and HTTP client pooling.
scope: Covers FastAPI lifespan context manager integration with pools, app.state attachment patterns, dependency providers
  for pool access, HTTP client pooling with httpx.AsyncClient, FastAPI-specific testing fixtures, and resource cleanup. Generic
  pooling concepts are in python/connection-pooling-patterns.toon.
out_of_scope:
- Generic pooling fundamentals (see python/connection-pooling-patterns.toon).
- SurrealDB pool implementation (see surrealdb/connection-pooling-patterns.toon).
- Elasticsearch wrapper implementation (see elasticsearch/connection-pooling-patterns.toon).
- Factory pattern details (see fastapi/factory-patterns.toon).
primary_runtime_references:
- path: app/core/factory.py
  role: FastAPI lifespan implementation with pool initialization and cleanup.
- path: app/api/v1/dependencies.py
  role: Dependency providers for pool access via request.app.state.
- path: tests/conftest.py
  role: Test fixtures for FastAPI applications with pools.
related_pattern_docs:
- python/connection-pooling-patterns.toon
- surrealdb/connection-pooling-patterns.toon
- elasticsearch/connection-pooling-patterns.toon
- fastapi/factory-patterns.toon
- fastapi/dependency-patterns.toon
- fastapi/settings-patterns.toon
sections:
- id: fastapi-lifespan-integration
  index: 1
  title: FastAPI lifespan integration
  category: standard
  summary: Managing pool lifecycle using FastAPI's lifespan context manager.
  sample_code:
    description: Lifespan function that initializes and cleans up pools.
    imports:
    - contextlib.asynccontextmanager
    - contextlib.AbstractAsyncContextManager
    - collections.abc.AsyncGenerator
    - collections.abc.Callable
    - fastapi.FastAPI
    - app.core.settings.Settings
    code: "from contextlib import asynccontextmanager, AbstractAsyncContextManager\nfrom collections.abc import AsyncGenerator,\
      \ Callable\nfrom fastapi import FastAPI\nfrom app.infrastructure.surrealdb.pool import SurrealDBPool, create_surrealdb_pool\n\
      from app.infrastructure.elasticsearch.client import (\n    ElasticsearchWrapper,\n    create_elasticsearch_wrapper,\n\
      )\ndef _lifespan(settings: Settings) -> Callable[[FastAPI], AbstractAsyncContextManager[None]]:\n    @asynccontextmanager\n\
      \    async def lifespan(app: FastAPI) -> AsyncGenerator[None]:\n        surreal_pool: SurrealDBPool | None = None\n\
      \        elasticsearch_client: ElasticsearchWrapper | None = None\n        try:\n            surreal_pool = await create_surrealdb_pool(settings)\n\
      \            app.state.surrealdb_pool = surreal_pool\n            logger.info(\"Initialized SurrealDB pool\")\n    \
      \        elasticsearch_client = await create_elasticsearch_wrapper(settings)\n            app.state.elasticsearch_client\
      \ = elasticsearch_client\n            logger.info(\"Initialized Elasticsearch client\")\n            yield\n       \
      \ except Exception:\n            logger.exception(\"Failed to initialize application resources\")\n            raise\n\
      \        finally:\n            if elasticsearch_client is not None:\n                try:\n                    await\
      \ elasticsearch_client.close()\n                except Exception:\n                    logger.exception(\"Failed to\
      \ close Elasticsearch client cleanly\")\n            if surreal_pool is not None:\n                try:\n          \
      \          await surreal_pool.close()\n                except Exception:\n                    logger.exception(\"Failed\
      \ to close SurrealDB pool cleanly\")\n    return lifespan"
  items:
  - id: lifespan.use-context-manager
    type: rule
    text: Use FastAPI's lifespan context manager instead of on_event startup/shutdown hooks to manage initialization and cleanup
      in a single async function.
  - id: lifespan.resource-safety
    type: note
    text: Structure lifespan so that cleanup runs even if exceptions occur during startup, ensuring resources are not leaked
      when initialization fails.
  - id: lifespan.startup-phase
    type: pattern
    text: In the startup block, create shared resources via create_surrealdb_pool(settings) and create_elasticsearch_wrapper(settings)
      and attach them to app.state.
  - id: lifespan.error-handling
    type: rule
    text: Wrap startup logic in try/except blocks that log exceptions and re-raise them so failed resource initialization
      prevents the app from serving requests.
  - id: lifespan.shutdown-phase
    type: rule
    text: In the finally block, close pools and clients if they were created, logging but swallowing close errors to allow
      a clean shutdown.
- id: app-state-attachment
  index: 2
  title: app.state attachment patterns
  category: standard
  summary: Storing and accessing pools via app.state.
  items:
  - id: state.naming-convention
    type: rule
    text: Store pools on app.state using descriptive names such as app.state.surrealdb_pool, app.state.elasticsearch_client,
      and app.state.http_client.
  - id: state.attach-after-init
    type: pattern
    text: Attach resources to app.state immediately after successful initialization so dependencies can access them.
  - id: state.type-safety
    type: note
    text: Access app.state attributes with awareness that they are dynamically attached; type checkers may not verify their
      existence at compile time.
  - id: state.settings-storage
    type: pattern
    text: Store the Settings instance on app.state.settings as well so configuration is accessible alongside resources.
  - id: state.no-globals
    type: rule
    text: Avoid storing pools in module-level globals; use app.state to enable test isolation and multiple app instances.
- id: dependency-providers
  index: 3
  title: Dependency providers for pools
  category: standard
  summary: Creating dependency functions that read pools from app.state.
  sample_code:
    description: Dependency provider that retrieves SurrealDBPool from app.state.
    imports:
    - fastapi.Request
    - typing.Annotated
    - fastapi.Depends
    code: "from fastapi import Request, Depends\nfrom typing import Annotated\nfrom app.infrastructure.surrealdb.pool import\
      \ SurrealDBPool\ndef get_surrealdb_pool(request: Request) -> SurrealDBPool:\n    \"\"\"Retrieve the SurrealDB pool from\
      \ app.state.\"\"\"\n    return request.app.state.surrealdb_pool\nSurrealDBPoolDep = Annotated[SurrealDBPool, Depends(get_surrealdb_pool)]\n\
      # Usage in a router:\n# async def get_user(pool: SurrealDBPoolDep, user_id: str) -> User:\n#     async with pool.acquire()\
      \ as conn:\n#         ..."
  items:
  - id: deps.request-access
    type: pattern
    text: Dependency providers accept Request and access request.app.state to retrieve pools; this allows tests to override
      app.state.
  - id: deps.annotated-aliases
    type: rule
    text: Create Annotated type aliases such as SurrealDBPoolDep = Annotated[SurrealDBPool, Depends(get_surrealdb_pool)] for
      clean injection syntax.
  - id: deps.router-injection
    type: pattern
    text: 'Routers declare dependencies using the Annotated alias (for example pool: SurrealDBPoolDep) to receive pools via
      FastAPI''s DI system.'
  - id: deps.testability
    type: note
    text: 'Dependency providers enable tests to override pools using app.dependency_overrides[get_surrealdb_pool] = lambda:
      mock_pool.'
- id: http-client-pooling
  index: 4
  title: HTTP client pooling
  category: standard
  summary: Patterns for pooling outbound HTTP connections using httpx.AsyncClient.
  sample_code:
    description: HTTP client initialization in lifespan.
    imports:
    - httpx
    - fastapi.FastAPI
    - app.core.settings.Settings
    code: "import httpx\nfrom fastapi import FastAPI\n@asynccontextmanager\nasync def lifespan(app: FastAPI) -> AsyncGenerator[None]:\n\
      \    http_client: httpx.AsyncClient | None = None\n    try:\n        http_client = httpx.AsyncClient(\n            limits=httpx.Limits(max_connections=100,\
      \ max_keepalive_connections=20),\n            timeout=httpx.Timeout(10.0, connect=5.0),\n        )\n        app.state.http_client\
      \ = http_client\n        yield\n    finally:\n        if http_client is not None:\n            await http_client.aclose()"
  items:
  - id: http.pooling-shared-client
    type: rule
    text: Create a single shared httpx.AsyncClient instance during lifespan startup and attach it to app.state.http_client.
  - id: http.limits-timeouts
    type: rule
    text: Configure HTTP client pooling via httpx.Limits for maximum connections and keepalive behavior, and httpx.Timeout
      for connect, read, and write timeouts.
  - id: http.dependency-injection
    type: pattern
    text: Inject the shared AsyncClient into services via dependencies rather than creating new clients per request.
  - id: http.shutdown
    type: rule
    text: Close the shared AsyncClient during lifespan shutdown to release network resources cleanly.
- id: fastapi-testing-fixtures
  index: 5
  title: Testing with FastAPI fixtures
  category: testing
  summary: Test fixtures for FastAPI applications using connection pools.
  sample_code:
    description: Pytest fixtures for testing FastAPI apps with pools.
    imports:
    - pytest
    - httpx
    - fastapi.FastAPI
    - app.core.factory.create_app
    code: "import pytest\nfrom httpx import AsyncClient, ASGITransport\nfrom fastapi import FastAPI\nfrom app.core.settings\
      \ import Settings\nfrom app.core.factory import create_app\n@pytest.fixture\ndef test_settings() -> Settings:\n    \"\
      \"\"Create Settings instance for tests.\"\"\"\n    return Settings()\n@pytest.fixture\nasync def test_app(test_settings:\
      \ Settings, monkeypatch) -> FastAPI:\n    \"\"\"Create a FastAPI app instance with mocked pools.\"\"\"\n    # Monkeypatch\
      \ pool factories to return mocks\n    async def mock_create_pool(settings):\n        return MockSurrealDBPool()\n  \
      \  monkeypatch.setattr(\n        \"app.infrastructure.surrealdb.pool.create_surrealdb_pool\",\n        mock_create_pool,\n\
      \    )\n    return create_app(test_settings)\n@pytest.fixture\nasync def async_client(test_app: FastAPI):\n    \"\"\"\
      Create an async HTTP client for testing.\"\"\"\n    async with AsyncClient(\n        transport=ASGITransport(app=test_app),\n\
      \        base_url=\"http://test\",\n    ) as client:\n        yield client"
  items:
  - id: test.test-settings
    type: pattern
    text: Define a test_settings fixture that instantiates Settings with safe defaults suitable for tests.
  - id: test.test-app
    type: pattern
    text: Define a test_app fixture that calls create_app(test_settings) with monkeypatched pool factories to provide isolated
      FastAPI instances.
  - id: test.async-client
    type: pattern
    text: Define an async_client fixture using httpx.AsyncClient with ASGITransport to make HTTP requests against the test
      app.
  - id: test.dependency-overrides
    type: rule
    text: Prefer FastAPI's dependency override system (app.dependency_overrides) to replace pools while still exercising the
      same create_app wiring.
  - id: test.e2e-live
    type: note
    text: Use live_server and api_client fixtures (defined in tests/conftest.py) for end-to-end tests that hit a dockerized
      stack with real SurrealDB and Elasticsearch services.
