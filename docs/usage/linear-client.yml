doc_id: linear-client-usage
title: Linear Client Usage Guide
version_hint: 2025
kind: usage_guide
scope: Developers using the Linear client for issue management and automation
description: |
  Comprehensive guide for setting up and using the Linear client wrappers. This project
  provides a canonical Python LinearClient at scripts/clients/linear_client.py with direct
  GraphQL support, plus a backwards-compatible facade at scripts/pr/linear_dao.py for
  existing scripts.

  For new code, prefer importing from scripts.clients.linear_client directly.
domain:
  - linear
  - automation
  - cli
  - python
  - typescript
primary_runtime_references:
  - path: scripts/pr/linear_dao.py
    description: Pure stdlib LinearClient using urllib/json (no external dependencies)
  - path: scripts/clients/linear_client.py
    description: Python wrapper for Linear TypeScript CLI scripts
  - path: scripts/clients/linear/src/client.ts
    description: TypeScript Linear SDK client (uses @linear/sdk ^64.0.0)
external_references:
  - url: https://developers.linear.app/docs/sdk/getting-started
    title: Linear SDK Documentation
  - url: https://linear.app/settings/api
    title: Linear API Settings

two_client_distinction:
  title: Two-Client Architecture
  summary: |
    This project provides two LinearClient implementations with different backends,
    trade-offs, and use cases. Choose the appropriate client based on your needs.

  comparison_table:
    headers:
      - Class
      - Location
      - Role
      - Use Case
    rows:
      - class: LinearClient
        location: scripts/clients/linear_client.py
        role: Canonical implementation
        use_case: New Python code - direct GraphQL client with full API coverage

      - class: LinearClient (re-export)
        location: scripts/pr/linear_dao.py
        role: Backwards-compatible facade
        use_case: Existing PR tooling scripts only - re-exports from linear_client.py

  decision_guide:
    title: Quick Decision Checklist
    summary: |
      Use these rules of thumb to quickly determine which client to use:
    rules:
      - rule: "No Node.js available? Use stdlib client."
        explanation: |
          If your environment cannot run Node.js (e.g., minimal containers,
          restricted CI), use scripts/pr/linear_dao.py
      - rule: "Simple PR tooling or merge scripts? Use stdlib client."
        explanation: |
          For straightforward automation like updating ticket states or adding
          comments during PR workflows, the stdlib client is simpler and faster
      - rule: "CI/CD pipeline with minimal dependencies? Use stdlib client."
        explanation: |
          Reduces build times and avoids Node.js installation steps in
          CI environments
      - rule: "Need advanced SDK features or rich type information? Use Node client."
        explanation: |
          When you need the full Linear SDK capabilities, pagination abstractions,
          or TypeScript type safety, use scripts/clients/linear_client.py
      - rule: "Already have Node.js toolchain in your project? Use Node client."
        explanation: If your project already uses Node.js and TypeScript, the Node client integrates more naturally

  when_to_use:
    canonical_client:
      import: from scripts.clients.linear_client import LinearClient
      description: |
        Use this client for all new Python code. This is the canonical, single-source-of-truth
        implementation with full API coverage. Ideal for:
        - Any new Python scripts or automation
        - PR tooling and merge scripts (new code)
        - CI/CD pipelines
        - All environments (no Node.js required)

    facade_client:
      import: from scripts.pr.linear_dao import LinearClient  # For existing scripts only
      description: |
        This is a backwards-compatible facade that re-exports LinearClient from
        scripts.clients.linear_client. Use only for:
        - Existing scripts that already import from linear_dao
        - Gradual migration of legacy code

        NOTE: New code should import directly from scripts.clients.linear_client.
        The facade import is shown here only for documentation of existing code.

  trade_offs:
    stdlib_client:
      name: stdlib LinearClient (linear_dao.py)
      advantages:
        - No external dependencies (pure Python stdlib)
        - Simpler deployment - no Node.js runtime required
        - Faster cold-start (no Node.js subprocess overhead)
        - Smaller footprint
      limitations:
        - Limited to basic GraphQL operations
        - Direct GraphQL API calls (no SDK abstractions)
        - Manual pagination handling for some operations

    node_client:
      name: Node LinearClient (linear_client.py)
      advantages:
        - Full Linear SDK capabilities via TypeScript CLI
        - Access to all SDK methods and types
        - Automatic pagination and error handling from SDK
        - Rich type information from SDK
      limitations:
        - Requires Node.js runtime (v18.0.0+)
        - TypeScript compilation step required (npm run build)
        - Additional subprocess overhead
        - Larger dependency footprint

sections:
  - id: setup
    index: 1
    title: Setup
    category: setup
    summary: Installation and configuration steps for the Linear client.
    items:
      - id: setup-prerequisites
        title: Prerequisites
        requirements:
          - Node.js 18.0.0 or higher
          - Python 3.14 or higher
          - A Linear API key with appropriate permissions
          - npm or yarn for TypeScript dependencies

      - id: setup-install-dependencies
        title: Install Dependencies
        steps:
          - step: Install TypeScript dependencies
            command: cd scripts/clients/linear && npm install
            description: Installs @linear/sdk (^64.0.0) and other required packages
          - step: Build TypeScript scripts
            command: cd scripts/clients/linear && npm run build
            description: Compiles TypeScript to JavaScript in dist/ directory
          - step: Verify Python environment
            command: uv sync
            description: Ensures Python dependencies are installed

      - id: setup-directory-structure
        title: Directory Structure
        structure: |
          scripts/clients/
          ├── linear_client.py           # Python wrapper
          └── linear/                    # TypeScript scripts
              ├── package.json
              ├── tsconfig.json
              ├── src/
              │   ├── client.ts          # Base Linear client
              │   ├── get-issue.ts       # Fetch issue details
              │   ├── create-issue.ts    # Create new issue
              │   ├── update-issue.ts    # Update existing issue
              │   ├── list-comments.ts   # List issue comments
              │   ├── create-comment.ts  # Create comment
              │   ├── list-projects.ts   # List projects
              │   └── list-teams.ts      # List teams
              └── dist/                  # Compiled JavaScript (generated)

  - id: authentication
    index: 2
    title: Authentication
    category: setup
    summary: How to obtain and configure Linear API credentials.
    items:
      - id: auth-obtain-key
        title: Obtaining an API Key
        steps:
          - step: Navigate to Linear API settings
            url: https://linear.app/settings/api
          - step: Click "Create new personal API key"
          - step: Provide a descriptive name (e.g., "AI Workflow Automation")
          - step: Copy the generated API key
            note: This key will only be shown once - store it securely

      - id: auth-configure-env
        title: Configuring Environment Variables
        text: |
          Set the LINEAR_API_KEY environment variable to authenticate requests.
        methods:
          - method: Shell export
            code: |
              export LINEAR_API_KEY="lin_api_your_key_here"
          - method: .env file
            code: |
              LINEAR_API_KEY=lin_api_your_key_here
            note: Ensure .env is in .gitignore
          - method: Python code
            code: |
              import os
              os.environ["LINEAR_API_KEY"] = "lin_api_your_key_here"

  - id: security
    index: 3
    title: Security Best Practices
    category: security
    summary: Important security considerations when using the Linear client.
    rules:
      - id: security-never-commit-keys
        rule: Never commit API keys to version control
        enforcement: Add .env to .gitignore, use environment variables only

      - id: security-key-rotation
        rule: Rotate API keys regularly
        recommendation: Rotate every 90 days or immediately if compromised

      - id: security-least-privilege
        rule: Use API keys with minimal required permissions
        note: Linear API keys inherit workspace permissions from the user

      - id: security-error-logging
        rule: API keys must not appear in error messages or logs
        implementation: The LinearClient class sanitizes error messages to prevent key leakage

  - id: python-api
    index: 4
    title: LinearClient API Reference (scripts/clients/linear_client.py) - Canonical
    category: api
    summary: |
      Complete reference for the canonical Python LinearClient. This is the single
      source-of-truth implementation for Linear API access in Python. All new code
      should import from this module.
    items:
      - id: python-api-initialization
        title: Client Initialization
        examples:
          - description: Initialize with explicit API key
            language: python
            code: |
              from scripts.clients.linear_client import LinearClient

              client = LinearClient(api_key="lin_api_your_key_here")

          - description: Initialize from environment variable
            language: python
            code: |
              from scripts.clients.linear_client import LinearClient
              import os

              # LINEAR_API_KEY must be set in environment
              client = LinearClient()

          - description: Error handling for missing API key
            language: python
            code: |
              from scripts.clients.linear_client import LinearClient, LinearClientError

              try:
                  client = LinearClient()
              except LinearClientError as e:
                  print(f"Error: {e.code} - {e.message}")
                  # Error: MISSING_API_KEY - LINEAR_API_KEY must be provided or set in environment

      - id: python-api-get-issue
        title: Get Issue Details
        method: get_issue(issue_id)
        description: Fetch detailed information about a Linear issue.
        parameters:
          - name: issue_id
            type: str
            description: Linear issue identifier (e.g., "NES-24") or UUID
        returns:
          type: dict[str, Any]
          fields:
            - id: str
            - identifier: str
            - title: str
            - description: str | None
            - priority: int
            - estimate: int | None
            - url: str
            - branchName: str
            - createdAt: str
            - updatedAt: str
            - completedAt: str | None
            - canceledAt: str | None
            - dueDate: str | None
            - team: dict | None (id, name, key)
            - assignee: dict | None (id, name, email)
            - state: dict | None (id, name, type)
            - project: dict | None (id, name)
            - parent: dict | None (id, identifier, title)
            - commentCount: int
            - childrenCount: int
        examples:
          - language: python
            code: |
              issue = client.get_issue("NES-24")
              print(f"Title: {issue['title']}")
              print(f"Branch: {issue['branchName']}")
              print(f"URL: {issue['url']}")

      - id: python-api-create-issue
        title: Create New Issue
        method: create_issue(team, title, description=None, project=None, priority=None)
        description: Create a new Linear issue.
        parameters:
          - name: team
            type: str
            required: true
            description: Team identifier - UUID, team key (e.g., "NES"), or team name (e.g., "Neshq")
          - name: title
            type: str
            required: true
            description: Issue title
          - name: description
            type: str | None
            required: false
            description: Issue description (supports Markdown)
          - name: project
            type: str | None
            required: false
            description: Project ID to associate the issue with
          - name: priority
            type: int | None
            required: false
            description: Priority level (0=None, 1=Urgent, 2=High, 3=Normal, 4=Low)
        returns:
          type: dict[str, Any]
          fields:
            - id: str
            - identifier: str
            - title: str
            - url: str
            - branchName: str
        examples:
          - language: python
            code: |
              # Team can be a name, key, or UUID - names are resolved automatically
              issue = client.create_issue(
                  team="Neshq",  # Team name - also accepts "NES" (key) or UUID
                  title="Implement user authentication",
                  description="Add JWT-based authentication to the API",
                  priority=2
              )
              print(f"Created: {issue['identifier']} - {issue['url']}")

      - id: python-api-update-issue
        title: Update Existing Issue
        method: update_issue(issue_id, title=None, description=None, status=None, priority=None)
        description: |
          Update fields of an existing Linear issue.

          Note: At least one updatable field (title, description, status, or priority) must be
          provided. If none are supplied, the call will fail with a LinearClientError having
          code NO_UPDATES instead of performing a no-op.
        parameters:
          - name: issue_id
            type: str
            required: true
            description: Linear issue ID
          - name: title
            type: str | None
            required: false
            description: New title
          - name: description
            type: str | None
            required: false
            description: New description
          - name: status
            type: str | None
            required: false
            description: New status/state ID
          - name: priority
            type: int | None
            required: false
            description: New priority level (0-4)
        returns:
          type: dict[str, Any]
          fields:
            - id: str
            - identifier: str
            - title: str
            - url: str
            - updatedAt: str
        examples:
          - language: python
            code: |
              updated = client.update_issue(
                  issue_id="NES-24",
                  title="Updated title",
                  priority=1
              )
              print(f"Updated at: {updated['updatedAt']}")

      - id: python-api-comments
        title: Issue Comments
        methods:
          - name: list_comments(issue_id)
            description: List all comments on an issue
            returns: list[dict[str, Any]]
          - name: create_comment(issue_id, body)
            description: Create a new comment on an issue
            returns: dict[str, Any]
        examples:
          - description: List comments
            language: python
            code: |
              comments = client.list_comments("NES-24")
              for comment in comments:
                  print(f"{comment['user']['name']}: {comment['body']}")

          - description: Create comment
            language: python
            code: |
              comment = client.create_comment(
                  issue_id="NES-24",
                  body="Implementation complete, ready for review"
              )
              print(f"Comment created: {comment['id']}")

      - id: python-api-list-operations
        title: List Operations
        methods:
          - name: list_projects()
            description: |
              List projects in the workspace (first page only). Note: Large workspaces
              may have additional projects not returned. For complete coverage, use the
              Linear API pagination directly.
            returns: list[dict[str, Any]]
          - name: list_teams()
            description: List all teams in the workspace
            returns: list[dict[str, Any]]
        examples:
          - description: List projects (first page)
            language: python
            code: |
              projects = client.list_projects()
              for project in projects:
                  print(f"{project['name']}: {project['url']}")

          - description: List teams
            language: python
            code: |
              teams = client.list_teams()
              for team in teams:
                  print(f"{team['key']}: {team['name']}")

      - id: python-api-error-handling
        title: Error Handling
        description: |
          All methods raise LinearClientError on failure. Error codes fall into two categories:
          client-side errors (raised by the Python wrapper) and API-level errors (returned by
          the Linear API via the TypeScript scripts).
        exception:
          name: LinearClientError
          attributes:
            - name: code
              type: str
              description: Error code identifying the type of error
            - name: message
              type: str
              description: Human-readable error message
        client_error_codes:
          description: Errors raised by the Python wrapper before reaching the API
          codes:
            - code: MISSING_API_KEY
              description: No API key provided or found in environment
            - code: SCRIPTS_NOT_FOUND
              description: TypeScript scripts directory not found
            - code: SCRIPT_NOT_FOUND
              description: Specific TypeScript script not found
            - code: NODE_NOT_FOUND
              description: Node.js is not installed or not found on PATH
            - code: SUBPROCESS_ERROR
              description: Failed to run script due to OS error
            - code: PARSE_ERROR
              description: Failed to parse JSON response from script
        api_error_codes:
          description: Errors returned by the Linear API or TypeScript scripts
          codes:
            - code: NOT_FOUND
              description: Requested resource (issue, project, etc.) not found
            - code: ISSUE_NOT_FOUND
              description: Requested issue identifier or ID was not found
            - code: TEAM_NOT_FOUND
              description: Specified team ID was not found
            - code: UNAUTHORIZED
              description: Invalid or expired API key
            - code: INVALID_INPUT
              description: Invalid input parameters (empty required fields, invalid priority, etc.)
            - code: NO_UPDATES
              description: No fields provided to update
            - code: CREATE_ISSUE_FAILED
              description: Failed to create issue
            - code: UPDATE_ISSUE_FAILED
              description: Failed to update issue
            - code: LIST_PROJECTS_FAILED
              description: Failed to list projects
            - code: LIST_TEAMS_FAILED
              description: Failed to list teams
            - code: LIST_COMMENTS_FAILED
              description: Failed to list comments
            - code: CREATE_COMMENT_FAILED
              description: Failed to create comment
            - code: GET_ISSUE_FAILED
              description: Failed to fetch issue details
            - code: UNKNOWN_ERROR
              description: Unspecified error from Linear API
        examples:
          - language: python
            code: |
              from scripts.clients.linear_client import LinearClient, LinearClientError

              client = LinearClient()
              try:
                  issue = client.get_issue("INVALID-123")
              except LinearClientError as e:
                  print(f"Error {e.code}: {e.message}")
                  # Handle client-side errors
                  if e.code == "MISSING_API_KEY":
                      print("Set LINEAR_API_KEY environment variable")
                  elif e.code == "NODE_NOT_FOUND":
                      print("Install Node.js to use the Linear client")
                  # Handle API-level errors
                  elif e.code == "NOT_FOUND":
                      print("Issue does not exist")
                  elif e.code == "UNAUTHORIZED":
                      print("Invalid API key")

  - id: stdlib-api
    index: 5
    title: stdlib LinearClient API Reference (scripts/pr/linear_dao.py)
    category: api
    facade_notice: |
      IMPORTANT: scripts/pr/linear_dao.py is now a thin, backwards-compatible facade
      that re-exports LinearClient from scripts/clients/linear_client.py.

      For new code, import directly from the canonical location:
        from scripts.clients.linear_client import LinearClient, LinearClientError

      The linear_dao module exists only to maintain compatibility with existing scripts.
    summary: |
      Reference for the backwards-compatible facade module. This module re-exports
      LinearClient and related types from scripts/clients/linear_client.py.
    items:
      - id: stdlib-api-initialization
        title: Client Initialization
        examples:
          - description: Initialize with explicit API key (PREFERRED - canonical import)
            language: python
            code: |
              from scripts.clients.linear_client import LinearClient

              client = LinearClient(api_key="lin_api_your_key_here")

          - description: Initialize with explicit API key (legacy facade import - existing scripts only)
            language: python
            code: |
              # LEGACY: For existing scripts only - new code should use scripts.clients.linear_client
              # This import path is maintained for backwards compatibility
              from scripts.pr.linear_dao import LinearClient

              client = LinearClient(api_key="lin_api_your_key_here")

          - description: Initialize from environment variable
            language: python
            code: |
              from scripts.clients.linear_client import LinearClient

              # LINEAR_API_KEY must be set in environment
              client = LinearClient()

          - description: Error handling for missing API key
            language: python
            code: |
              from scripts.clients.linear_client import LinearClient, LinearClientError

              try:
                  client = LinearClient()
              except LinearClientError as e:
                  print(f"Error: {e.code} - {e.message}")
                  # Error: MISSING_API_KEY - LINEAR_API_KEY must be provided or set in environment

      - id: stdlib-api-list-teams
        title: List Teams
        method: list_teams(include_archived=False)
        description: List all teams in the Linear workspace with full pagination support.
        parameters:
          - name: include_archived
            type: bool
            default: "False"
            description: Whether to include archived teams
        returns:
          type: list[dict[str, Any]]
          fields:
            - id (str): Team UUID
            - name (str): Team name
            - key (str): Team key (e.g., "NES")
            - description (str): Team description
            - createdAt (str): ISO timestamp when team was created
            - updatedAt (str): ISO timestamp when team was last updated
            - archivedAt (str | None): ISO timestamp when archived
            - private (bool): Whether the team is private
            - timezone (str): Team timezone
        example:
          language: python
          code: |
            teams = client.list_teams()
            for team in teams:
                print(f"{team['key']}: {team['name']}")

      - id: stdlib-api-list-projects
        title: List Projects
        method: list_projects(team_id=None, include_archived=False)
        description: |
          List all projects in the Linear workspace with full pagination support.
          Optionally filter by team.
        parameters:
          - name: team_id
            type: str | None
            default: "None"
            description: Optional team UUID, key, or name to filter projects
          - name: include_archived
            type: bool
            default: "False"
            description: Whether to include archived projects
        returns:
          type: list[dict[str, Any]]
          fields:
            - id (str): Project UUID
            - name (str): Project name
            - description (str): Project description
            - url (str): Project URL
            - slugId (str): Project slug ID
            - startedAt (str | None): ISO timestamp when started
            - completedAt (str | None): ISO timestamp when completed
            - targetDate (str | None): Target completion date
            - createdAt (str): ISO timestamp when created
            - updatedAt (str): ISO timestamp when last updated
            - archivedAt (str | None): ISO timestamp when archived
            - state (str): Project state
            - lead (dict | None): Project lead user info
            - teams (dict): List of associated teams
        example:
          language: python
          code: |
            # List all projects
            projects = client.list_projects()

            # List projects for a specific team
            projects = client.list_projects(team_id="NES")

      - id: stdlib-api-create-issue
        title: Create Issue
        method: |
          create_issue(title, team, description=None, assignee_id=None,
                       project_id=None, priority=None, state_id=None,
                       parent_id=None, label_ids=None)
        description: Create a new issue in Linear.
        parameters:
          - name: title
            type: str
            required: true
            description: The title of the issue
          - name: team
            type: str
            required: true
            description: Team identifier - UUID, team key (e.g., "NES"), or team name
          - name: description
            type: str | None
            required: false
            description: Issue description in Markdown format
          - name: assignee_id
            type: str | None
            required: false
            description: UUID of the user to assign the issue to
          - name: project_id
            type: str | None
            required: false
            description: UUID of the project to add the issue to
          - name: priority
            type: int | None
            required: false
            description: Priority level (0=No priority, 1=Urgent, 2=High, 3=Normal, 4=Low)
          - name: state_id
            type: str | None
            required: false
            description: UUID of the workflow state
          - name: parent_id
            type: str | None
            required: false
            description: UUID of the parent issue (for sub-issues)
          - name: label_ids
            type: list[str] | None
            required: false
            description: List of label UUIDs to apply
        returns:
          type: dict[str, Any]
          fields:
            - id (str): Issue UUID
            - identifier (str): Issue identifier (e.g., "NES-123")
            - title (str): Issue title
            - url (str): Issue URL
            - branchName (str): Suggested branch name
        example:
          language: python
          code: |
            issue = client.create_issue(
                title="Implement user authentication",
                team="NES",  # Can be UUID, key, or name
                description="Add JWT-based authentication",
                priority=2
            )
            print(f"Created: {issue['identifier']}")

      - id: stdlib-api-update-issue
        title: Update Issue
        method: |
          update_issue(issue_id, title=None, description=None, assignee_id=None,
                       project_id=None, priority=None, state_id=None,
                       parent_id=None, label_ids=None)
        description: |
          Update an existing issue in Linear. At least one field must be provided.
        parameters:
          - name: issue_id
            type: str
            required: true
            description: UUID or identifier of the issue to update
          - name: title
            type: str | None
            required: false
            description: New title for the issue
          - name: description
            type: str | None
            required: false
            description: New description in Markdown format
          - name: assignee_id
            type: str | None
            required: false
            description: UUID of the user to assign
          - name: project_id
            type: str | None
            required: false
            description: UUID of the project
          - name: priority
            type: int | None
            required: false
            description: Priority level (0-4)
          - name: state_id
            type: str | None
            required: false
            description: UUID of the workflow state
          - name: parent_id
            type: str | None
            required: false
            description: UUID of the parent issue
          - name: label_ids
            type: list[str] | None
            required: false
            description: List of label UUIDs
        returns:
          type: dict[str, Any]
          fields:
            - id (str): Issue UUID
            - identifier (str): Issue identifier
            - title (str): Issue title
            - url (str): Issue URL
            - updatedAt (str): ISO timestamp when updated
        example:
          language: python
          code: |
            updated = client.update_issue(
                issue_id="NES-24",
                title="Updated title",
                priority=1
            )

      - id: stdlib-api-create-comment
        title: Create Comment
        method: create_comment(issue_id, body)
        description: Create a comment on a Linear issue.
        parameters:
          - name: issue_id
            type: str
            required: true
            description: Issue identifier (e.g., "NES-123") or UUID
          - name: body
            type: str
            required: true
            description: Comment body in Markdown format
        returns:
          type: dict[str, Any]
          fields:
            - id (str): Comment UUID
            - body (str): Comment body text
            - createdAt (str): ISO timestamp when created
            - issueId (str): UUID of the issue
            - user (dict | None): User info (id, name, email)
        example:
          language: python
          code: |
            comment = client.create_comment(
                issue_id="NES-24",
                body="Implementation complete, ready for review"
            )

      - id: stdlib-api-list-comments
        title: List Comments
        method: list_comments(issue_id)
        description: List all comments for a Linear issue with full pagination support.
        parameters:
          - name: issue_id
            type: str
            required: true
            description: Issue identifier (e.g., "NES-123") or UUID
        returns:
          type: dict[str, Any]
          fields:
            - issueId (str): UUID of the issue
            - issueIdentifier (str): Issue identifier (e.g., "NES-123")
            - comments (list): List of comment dictionaries
            - totalCount (int): Total number of comments
        example:
          language: python
          code: |
            result = client.list_comments("NES-24")
            for comment in result['comments']:
                print(f"{comment['user']['name']}: {comment['body']}")

      - id: stdlib-api-fetch-github-attachments
        title: Fetch GitHub Attachments
        method: fetch_github_attachments(ticket_id)
        description: Fetch all GitHub PR attachments for a ticket with pagination.
        parameters:
          - name: ticket_id
            type: str
            required: true
            description: Linear ticket ID (e.g., "NES-123")
        returns:
          type: list[dict[str, Any]]
          fields:
            - url (str): GitHub PR URL
            - title (str): Attachment title
        example:
          language: python
          code: |
            attachments = client.fetch_github_attachments("NES-24")
            for att in attachments:
                print(f"{att['title']}: {att['url']}")

      - id: stdlib-api-get-ticket-info
        title: Get Ticket Info
        method: get_ticket_info(ticket_id)
        description: Get basic ticket info from Linear.
        parameters:
          - name: ticket_id
            type: str
            required: true
            description: Linear ticket ID (e.g., "NES-123")
        returns:
          type: dict[str, Any]
          fields:
            - id (str): Issue UUID
            - identifier (str): Issue identifier
            - title (str): Issue title
            - branch_name (str): Suggested branch name
            - state (str): Current state name
            - state_type (str): State type (e.g., "completed")
            - team_id (str): Team UUID
        example:
          language: python
          code: |
            info = client.get_ticket_info("NES-24")
            print(f"State: {info['state']} ({info['state_type']})")

      - id: stdlib-api-get-done-state-id
        title: Get Done State ID
        method: get_done_state_id(team_id)
        description: Get the 'Done' workflow state ID for a team.
        parameters:
          - name: team_id
            type: str
            required: true
            description: Linear team UUID
        returns:
          type: str
          description: The workflow state ID for 'Done' state
        example:
          language: python
          code: |
            done_state_id = client.get_done_state_id(team_id)
            print(f"Done state ID: {done_state_id}")

      - id: stdlib-api-set-ticket-state
        title: Set Ticket State
        method: set_ticket_state(issue_uuid, state_id)
        description: Update a Linear ticket's state.
        parameters:
          - name: issue_uuid
            type: str
            required: true
            description: Linear issue UUID (not the identifier like NES-123)
          - name: state_id
            type: str
            required: true
            description: Target workflow state ID
        returns:
          type: dict[str, Any]
          description: Dictionary containing the updated issue state with stateName key
        raises:
          - LinearClientError if the API call fails or update is unsuccessful
        example:
          language: python
          code: |
            # Get ticket info first to get UUIDs
            info = client.get_ticket_info("NES-24")
            done_id = client.get_done_state_id(info['team_id'])
            result = client.set_ticket_state(info['id'], done_id)
            print(f"State changed to: {result['stateName']}")

      - id: stdlib-api-error-handling
        title: Error Handling
        description: |
          All methods raise LinearAPIError on failure. LinearAPIError is now an alias
          for LinearClientError from scripts.clients.linear_client. Error strings now
          include a code prefix: "CODE: message" (e.g., "NOT_FOUND: Ticket not found:
          INVALID-999"). Code that parses error messages should be updated accordingly.
        exception:
          name: LinearAPIError
          parent: RuntimeError
          description: |
            Raised when any Linear API operation fails. This is an alias for
            LinearClientError from scripts.clients.linear_client.
          attributes:
            - name: code
              type: str
              description: Error code identifying the type of error (e.g., "NOT_FOUND", "MISSING_API_KEY")
            - name: message
              type: str
              description: Human-readable error message
        error_format_note: |
          LinearAPIError is now an alias for LinearClientError. Error strings now include
          a code prefix: "CODE: message" (e.g., "MISSING_API_KEY: LINEAR_API_KEY environment
          variable not set"). Code that parses error messages should be updated accordingly.
        error_conditions:
          - LINEAR_API_KEY environment variable not set
          - HTTP errors from the Linear API
          - Network connection failures
          - Invalid or malformed API responses
          - GraphQL errors returned by the API
          - Resource not found (tickets, teams, etc.)
        example:
          language: python
          code: |
            # Preferred import for new code
            from scripts.clients.linear_client import LinearClient, LinearClientError

            # Or for existing scripts using the facade
            from scripts.pr.linear_dao import LinearClient, LinearAPIError

            client = LinearClient()
            try:
                info = client.get_ticket_info("INVALID-999")
            except LinearClientError as e:  # or LinearAPIError (same class)
                print(f"Error code: {e.code}")
                print(f"Error message: {e.message}")
                print(f"Full error: {e}")  # "NOT_FOUND: Ticket not found: INVALID-999"

  - id: python-cli
    index: 6
    title: Python CLI (uv run linear)
    category: api
    summary: Simple command-line interface for common Linear operations.
    items:
      - id: python-cli-overview
        title: Overview
        text: |
          The Python CLI provides simple commands for common Linear operations, suitable for
          use in shell scripts and Claude command files. All commands output JSON.

          Note: The Python CLI intentionally exposes only a subset of fields for shell-script
          friendliness (e.g., create-issue lacks --priority, update-issue only supports
          --description). For advanced options like priority, title/status updates, and labels,
          use the Python LinearClient API or the TypeScript CLI directly.

      - id: python-cli-usage
        title: Usage
        commands:
          - command: uv run linear get-issue <ISSUE_ID>
            description: Fetch issue details
            example: uv run linear get-issue NES-24

          - command: uv run linear list-projects
            description: List projects in the workspace (first page only)
            example: uv run linear list-projects

          - command: uv run linear list-teams
            description: List all teams in the workspace
            example: uv run linear list-teams

          - command: uv run linear list-comments <ISSUE_ID>
            description: List comments on an issue
            example: uv run linear list-comments NES-24

          - command: >-
              uv run linear create-issue --team <TEAM> --title <TITLE>
              [--description <DESC>] [--project <PROJECT>]
            description: Create a new issue (team can be UUID, name, or key)
            example: >-
              uv run linear create-issue --team Neshq --title "New feature"
              --description "Feature description"

          - command: uv run linear update-issue <ISSUE_ID> [--description <DESC>]
            description: |
              Update an issue description. Fails with NO_UPDATES if no updatable
              fields are provided.
            example: uv run linear update-issue NES-24 --description "Updated description"

          - command: uv run linear create-comment <ISSUE_ID> --body <BODY>
            description: Create a comment on an issue
            example: uv run linear create-comment NES-24 --body "Implementation complete"

  - id: typescript-cli
    index: 7
    title: TypeScript CLI Scripts
    category: api
    summary: Direct usage of TypeScript CLI scripts (advanced).
    items:
      - id: typescript-cli-overview
        title: Overview
        text: |
          The TypeScript scripts can be invoked directly using Node.js. The Python wrapper
          is the recommended interface, but direct CLI usage is available for scripting
          and debugging.

      - id: typescript-cli-authentication
        title: Authentication
        text: |
          All scripts require the LINEAR_API_KEY environment variable to be set.
        example:
          command: export LINEAR_API_KEY="lin_api_your_key_here"

      - id: typescript-cli-response-format
        title: Response Format
        text: |
          All scripts output JSON in a standardized format.
        success_response:
          language: json
          code: |
            {
              "ok": true,
              "data": {
                // Response data specific to the operation
              }
            }
        error_response:
          language: json
          code: |
            {
              "ok": false,
              "error": {
                "code": "ERROR_CODE",
                "message": "Human-readable error message"
              }
            }

      - id: typescript-cli-scripts
        title: Available Scripts
        scripts:
          - script: get-issue.js
            usage: node dist/get-issue.js --issue-id <ID>
            description: Fetch issue details
            example: node dist/get-issue.js --issue-id NES-24

          - script: create-issue.js
            usage: >-
              node dist/create-issue.js --team <TEAM> --title <TITLE>
              [--description <DESC>] [--project <PROJECT>] [--priority <PRIORITY>]
            description: Create a new issue (team can be UUID, name, or key)
            example: >-
              node dist/create-issue.js --team Neshq --title "New feature"
              --description "Feature description"
            note: >-
              Additional options available (--assignee, --state, --parent-id, --labels,
              --body as alias for --description). Run with --help for full list.

          - script: update-issue.js
            usage: >-
              node dist/update-issue.js --issue-id <ID> [--title <TITLE>]
              [--description <DESC>] [--state <STATE>] [--priority <PRIORITY>]
            description: Update an existing issue
            example: >-
              node dist/update-issue.js --issue-id NES-24 --title "Updated title"
              --description "New description"
            note: >-
              Additional options available (--assignee, --project, --parent-id, --labels,
              --body as alias for --description). Run with --help for full list.
              At least one updatable field must be provided; otherwise the command fails
              with error code NO_UPDATES.

          - script: list-comments.js
            usage: node dist/list-comments.js --issue-id <ID>
            description: List comments on an issue
            example: node dist/list-comments.js --issue-id NES-24

          - script: create-comment.js
            usage: node dist/create-comment.js --issue-id <ID> --body <BODY>
            description: Create a comment on an issue
            example: node dist/create-comment.js --issue-id NES-24 --body "Comment text"

          - script: list-projects.js
            usage: node dist/list-projects.js
            description: |
              List projects (first page only). Large workspaces may have additional
              projects not returned by this command.
            example: node dist/list-projects.js

          - script: list-teams.js
            usage: node dist/list-teams.js
            description: List all teams
            example: node dist/list-teams.js

  - id: migration-guide
    index: 8
    title: Migration Guide
    category: guide
    summary: Guidance for migrating from direct API calls to the Linear client.
    items:
      - id: migration-benefits
        title: Benefits of Using the Client
        benefits:
          - Consistent error handling with structured exceptions
          - Automatic JSON parsing and response validation
          - Type hints for better IDE support
          - Simplified authentication management
          - Abstraction over subprocess execution

      - id: migration-from-direct-api
        title: Migrating from Direct REST API Calls
        before:
          description: Direct API call using requests
          language: python
          code: |
            import requests

            headers = {"Authorization": f"Bearer {api_key}"}
            response = requests.get(
                f"https://api.linear.app/graphql",
                headers=headers,
                json={"query": "{ issue(id: \"NES-24\") { title } }"}
            )
            data = response.json()
        after:
          description: Using LinearClient
          language: python
          code: |
            from scripts.clients.linear_client import LinearClient

            client = LinearClient()
            issue = client.get_issue("NES-24")
            title = issue["title"]

      - id: migration-from-subprocess
        title: Migrating from Direct Subprocess Calls
        before:
          description: Direct subprocess call
          language: python
          code: |
            import subprocess
            import json

            result = subprocess.run(
                ["node", "scripts/clients/linear/dist/get-issue.js", "--issue-id", "NES-24"],
                env={"LINEAR_API_KEY": api_key},
                capture_output=True,
                text=True
            )
            data = json.loads(result.stdout)["data"]
        after:
          description: Using LinearClient
          language: python
          code: |
            from scripts.clients.linear_client import LinearClient

            client = LinearClient()
            issue = client.get_issue("NES-24")

      - id: migration-testing
        title: Testing After Migration
        recommendations:
          - Run existing tests to ensure functionality is preserved
          - Add error handling with LinearClientError
          - Update type hints to use the return types documented in this guide
          - Verify authentication works with environment variables
        test_command: uv run pytest scripts/tests/clients/test_linear_client.py -v
