  - id: 6-best-practices
    index: 20
    title: 6. Best Practices
    category: standard
    items: []
  - id: 61-registry-maintenance
    index: 21
    title: 6.1 Registry Maintenance
    category: standard
    items:
  - id: 61-registry-maintenance-update-testsuse_casesyaml
    text: Update `tests/docs/use_cases.yaml` when adding new endpoints or discovering new scenarios
  - id: 61-registry-maintenance-add-pytestmarkusecaseuc
    text: Add `@pytest.mark.usecase("UC-XXX-NNN")` markers to tests for automatic coverage detection
  - id: 61-registry-maintenance-review-the-registry-during-spr
    text: Review the registry during sprint planning to identify coverage gaps
  - id: 61-registry-maintenance-archive-deprecated-use-cases-r
    text: 'Archive deprecated use-cases rather than deleting them (add `deprecated: true` field)'
  - id: 62-ci-enforcement
    index: 22
    title: 6.2 CI Enforcement
    category: standard
    items:
  - id: 62-ci-enforcement-run-use-case-coverage-reports
    text: Run use-case coverage reports in CI
  - id: 62-ci-enforcement-set-a-minimum-coverage-thresho
    text: Set a minimum coverage threshold in project settings
  - id: 62-ci-enforcement-block-merges-that-reduce-cover
    text: Block merges that reduce coverage without justification
  - id: 62-ci-enforcement-review-new-endpoints-to-ensure
    text: Review new endpoints to ensure corresponding use-cases are added
  - id: 63-traceability
    index: 23
    title: 6.3 Traceability
    category: standard
    items:
  - id: 63-traceability-include-use-case-ids-in-test-d
    text: Include use-case IDs in test docstrings for documentation
  - id: 63-traceability-reference-use-case-ids-in-pull
    text: Reference use-case IDs in pull request descriptions when adding coverage
  - id: 63-traceability-link-test-failures-to-use-case
    text: Link test failures to use-case IDs in bug reports
  - id: 64-review-unlinked-tests
    index: 24
    title: 6.4 Review Unlinked Tests
    category: standard
    items:
  - id: 64-review-unlinked-tests-1
    text: 'Periodically audit tests without use-case markers:'
  - id: 64-review-unlinked-tests-code-2
    text: |
      # Find tests without usecase markers (future tooling) pytest --collect-only -q | grep -v usecase
  - id: 64-review-unlinked-tests-3
    text: 'Tests without markers may indicate:'
  - id: 64-review-unlinked-tests-missing-use-cases-in-the-regis
    text: Missing use-cases in the registry
  - id: 64-review-unlinked-tests-tests-that-should-be-removed-o
    rule: Tests that should be removed or consolidated
  - id: 64-review-unlinked-tests-implementation-tests-that-belo
    text: Implementation tests that belong at the unit level
  - id: 65-human-readable-descriptions
    index: 25
    title: 6.5 Human-Readable Descriptions
    category: standard
    items:
  - id: 65-human-readable-descriptions-1
    text: 'Write descriptions and expected behaviors that non-developers can understand:'
  - id: 65-human-readable-descriptions-avoid-implementation-jargon
    text: Avoid implementation jargon
  - id: 65-human-readable-descriptions-focus-on-what-the-user-or-syst
    text: Focus on what the user or system observes
  - id: 65-human-readable-descriptions-include-concrete-examples-of-i
    text: Include concrete examples of inputs and outputs
  - id: 7-integration-with-existing-testing-tiers
    index: 26
    title: 7. Integration with Existing Testing Tiers
    category: standard
    items:
  - id: 7-integration-with-existing-testing-tiers-1
    text: |
      This use-case approach integrates with the four-tier testing architecture. Different tiers have different coverage
      requirements:
  - id: 71-coverage-types-by-tier
    index: 27
    title: 7.1 Coverage Types by Tier
    category: standard
    items:
  - id: 71-coverage-types-by-tier-1
    rule: |
      Coverage types by tier:
      - Unit: Line/branch per function, use-case markers not used
      - Component: Line/branch per function, use-case markers not used
      - Integration: Use-case coverage, markers required
      - E2E: Use-case coverage, markers required
  - id: 71-coverage-types-by-tier-2
    text: Coverage thresholds are configured in project settings.
  - id: 72-tier-assignment
    index: 28
    title: 7.2 Tier Assignment
    category: standard
    items:
  - id: 72-tier-assignment-1
    rule: |
      Tier assignment rules:
      - Unit tests: Do not need use-case markers; test implementation details with
        per-function coverage
      - Component tests: Do not need use-case markers; test service layer with
        per-function coverage
      - Integration tests: Primary tier for use-case validation; most use-cases
        live here
      - E2E tests: For scenarios requiring full stack validation (startup, Docker,
        network)
  - id: 73-test-tier-field
    index: 29
    title: 7.3 Test Tier Field
    category: standard
    items:
  - id: 73-test-tier-field-1
    rule: 'The `test_tier` field in the use-case registry indicates where tests should live:'
  - id: 73-test-tier-field-integration-use-async_clie
    text: '`integration`: Use `async_client` fixture, in-process testing'
  - id: 73-test-tier-field-e2e-use-api_client-fixtur
    text: '`e2e`: Use `api_client` fixture, requires Docker stack'
  - id: 73-test-tier-field-4
    text: Reference the test tier when creating new tests to ensure consistent organization.
  - id: 74-fixture-selection
    index: 30
    title: 7.4 Fixture Selection
    category: standard
    items:
  - id: 74-fixture-selection-1
    text: |
      Fixture selection by tier:
      - Unit: Mocks/fakes with direct function calls
      - Component: Mocks/fakes with direct function calls
      - Integration: async_client fixture with httpx.ASGITransport (in-process)
      - E2E: api_client fixture with HTTP to live server
  - id: 75-per-function-vs-use-case-coverage
    index: 31
    title: 7.5 Per-Function vs Use-Case Coverage
    category: standard
    items:
  - id: 75-per-function-vs-use-case-coverage-1
    rule: |
      * Unit/Component/Scripts tiers: Each function must individually meet the configured line and branch coverage
      threshold. This is not an average—every single function is validated separately. * Integration/E2E tiers:
      Use-cases must have corresponding tests with `@pytest.mark.usecase` markers (threshold configured in settings).
  - id: 8-examples
    index: 32
    title: 8. Examples
    category: example
    items: []
  - id: 81-complete-example-use-case-to-test
    index: 33
    title: '8.1 Complete Example: Use-Case to Test'
    category: example
    items:
  - id: 81-complete-example-use-case-to-test-use-case-definition-in-test
    text: 'Use-case definition in `tests/docs/use_cases.yaml`:'
  - id: 81-complete-example-use-case-to-test-code-2
    text: |
      - id: UC-EXAMPLE-002
        endpoint: /api/v1/examples/process
        method: POST
        description: Process endpoint succeeds with valid message
        expected_behavior: |
          Given a valid ExampleRequest with message between 1-500 chars,
          returns HTTP 200 with ExampleResponse containing processed result.
        test_tier: integration
  - id: 81-complete-example-use-case-to-test-corresponding-test-in-tests
    text: 'Corresponding test in `tests/integration/test_example_process.py`:'
  - id: 81-complete-example-use-case-to-test-code-4
    text: |
      import pytest
      from datetime import datetime, UTC

      @pytest.mark.usecase("UC-EXAMPLE-002")
      async def test_process_valid_message_succeeds(async_client):
          """Process endpoint returns ExampleResponse for valid input.

          Use-case: UC-EXAMPLE-002
          """
          payload = {"message": "Hello World", "type": "info"}

          response = await async_client.post("/api/v1/examples/process", json=payload)

          assert response.status_code == 200
          data = response.json()
          assert "[PROCESSED]" in data["result"]
          assert data["original_length"] == len("Hello World")
          assert "processed_at" in data
  - id: 82-stub-test-example
    index: 34
    title: 8.2 Stub Test Example
    category: example
    items:
  - id: 82-stub-test-example-code-1
    text: |
      import pytest

      @pytest.mark.skip(reason="Not implemented yet")
      @pytest.mark.usecase("UC-EXAMPLE-014")
      async def test_get_message_returns_404_for_nonexistent_id(async_client):
          """Get processed message returns 404 for non-existent ID.

          Use-case: UC-EXAMPLE-014

          TODO: Implement by:
          1. Request /api/v1/examples/processed-messages/nonexistent-id
          2. Assert HTTP 404
          3. Assert response body contains AppError with appropriate message
          """
          pass
  - id: 83-test-covering-multiple-use-cases
    index: 35
    title: 8.3 Test Covering Multiple Use-Cases
    category: standard
    items:
  - id: 83-test-covering-multiple-use-cases-code-1
    text: |
      import pytest

      @pytest.mark.usecase("UC-EXAMPLE-004")
      @pytest.mark.usecase("UC-EXAMPLE-005")
      async def test_process_message_length_validation(async_client):
          """Process endpoint validates message length constraints.

          Use-cases:
          - UC-EXAMPLE-004: Message exceeding 500 chars fails
          - UC-EXAMPLE-005: Empty message fails
          """
          # Too long
          long_message = "x" * 501
          response = await async_client.post(
              "/api/v1/examples/process",
              json={"message": long_message}
          )
          assert response.status_code == 422

          # Too short (empty after validation)
          response = await async_client.post(
              "/api/v1/examples/process",
              json={"message": ""}
          )
          assert response.status_code == 422
