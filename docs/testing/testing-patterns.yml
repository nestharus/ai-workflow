- id: 81-complete-example-use-case-to-test
  index: 33
  title: '8.1 Complete Example: Use-Case to Test'
  category: example
  summary: ''
  items:
  - id: 81-complete-example-use-case-to-test-use-case-definition-in-test
    type: text
    text: '**Use-case definition in `tests/use_cases.yaml`:**'
  - id: 81-complete-example-use-case-to-test-code-2
    type: code
    text: |
      - id: UC-EXAMPLE-002
        endpoint: /api/v1/examples/process
        method: POST
        description: Process endpoint succeeds with valid message
        expected_behavior: |
          Given a valid ExampleRequest with message between 1-500 chars,
          returns HTTP 200 with ExampleResponse containing processed result.
        test_tier: integration
  - id: 81-complete-example-use-case-to-test-corresponding-test-in-tests
    type: text
    text: '**Corresponding test in `tests/integration/test_example_process.py`:**'
  - id: 81-complete-example-use-case-to-test-code-4
    type: code
    text: |
      import pytest
      from datetime import datetime, UTC

      @pytest.mark.usecase("UC-EXAMPLE-002")
      async def test_process_valid_message_succeeds(async_client):
          """Process endpoint returns ExampleResponse for valid input.

          Use-case: UC-EXAMPLE-002
          """
          payload = {"message": "Hello World", "type": "info"}

          response = await async_client.post("/api/v1/examples/process", json=payload)

          assert response.status_code == 200
          data = response.json()
          assert "[PROCESSED]" in data["result"]
          assert data["original_length"] == len("Hello World")
          assert "processed_at" in data
