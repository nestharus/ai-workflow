doc_id: original-testing-testing-patterns
title: Use-Case-Based Test Coverage
description: This document defines the approach for tracking test coverage at the use-case level, ensuring
  that tests validate user-facing scenarios and system requirements rather than just exercising code paths.
domain: []
scope: general
sections:
  - id: 1-introduction
    index: 1
    title: 1. Introduction
    category: standard
    items:
  - id: 1-introduction-1
    rule: Traditional code coverage metrics (line coverage, branch coverage) measure which code is executed
      during tests but do not indicate whether user scenarios are actually validated. Use-case coverage
      addresses this gap by tracking which user-facing scenarios have corresponding tests.
  - id: 1-introduction-key-distinctions
    text: 'Key distinctions:'
  - id: 1-introduction-code-coverage-measures-wh
    text: |
      Code coverage: Measures what percentage of source lines or branches are executed during tests.
  - id: 1-introduction-use-case-coverage-measure
    text: 'Use-case coverage: Measures how many defined user scenarios have tests that validate them.'
  - id: 1-introduction-5
    text: A codebase can have 100% line coverage but still miss critical user scenarios if tests only
      exercise code paths without asserting on expected behaviors. Conversely, well-designed use-case
      tests often achieve high code coverage as a side effect of validating real functionality.
  - id: 1-introduction-6
    text: This approach aligns testing with user needs and system requirements, making test gaps visible
      and actionable.
  - id: 2-use-case-registry
    index: 2
    title: 2. Use-Case Registry
    category: standard
    items:
  - id: 2-use-case-registry-1
    text: The canonical use-case registry lives at `tests/docs/use_cases.yaml`. This file catalogs all testable
      scenarios for the API, organized by feature area.
  - id: 21-registry-structure
    index: 3
    title: 2.1 Registry Structure
    category: standard
    items:
  - id: 21-registry-structure-code-1
    text: |
      features:
        health:
          name: Health Checks
          description: Liveness and readiness probes for monitoring
          use_cases:
            - id: UC-HEALTH-001
              endpoint: /health
              method: GET
              description: Root liveness check returns 200 OK
              expected_behavior: |
                Returns HTTP 200 with JSON body {"status": "ok"}.
              test_tier: e2e
  - id: 22-field-definitions
    index: 4
    title: 2.2 Field Definitions
    category: standard
    items:
  - id: 22-field-definitions-1
    rule: |
      Use case field definitions:
      - id: Unique identifier following UC-{FEATURE}-{NUMBER} pattern
      - endpoint: Full API path (e.g., /api/v1/health)
      - method: HTTP method (GET, POST, PUT, DELETE, PATCH)
      - description: Human-readable scenario description
      - expected_behavior: Detailed expected outcome including status codes and
        response characteristics
      - test_tier: Where the test should live (integration or e2e)
  - id: 22-field-definitions-2
    note: |
      Note: Coverage status is calculated dynamically from `@pytest.mark.usecase` markers in tests, not stored in
      the registry. Uncovered use cases will appear in coverage reports.
  - id: 23-naming-convention
    index: 5
    title: 2.3 Naming Convention
    category: standard
    items:
  - id: 23-naming-convention-1
    text: 'Use-case IDs follow the pattern `UC-{FEATURE}-{NUMBER}`:'
  - id: 23-naming-convention-uc-health-001-first-health
    text: '`UC-HEALTH-001`: First health-related use-case'
  - id: 23-naming-convention-uc-example-007-seventh-exam
    text: '`UC-EXAMPLE-007`: Seventh example-feature use-case'
  - id: 23-naming-convention-uc-auth-003-third-authentic
    text: '`UC-AUTH-003`: Third authentication use-case'
  - id: 23-naming-convention-5
    text: Numbers are zero-padded to three digits for consistent sorting. When adding new use-cases, use
      the next available number in the sequence.
  - id: 24-when-to-add-use-cases
    index: 6
    title: 2.4 When to Add Use-Cases
    category: standard
    items:
  - id: 24-when-to-add-use-cases-1
    text: 'Add new use-cases when:'
  - id: 24-when-to-add-use-cases-adding-a-new-api-endpoint
    text: Adding a new API endpoint
  - id: 24-when-to-add-use-cases-discovering-new-scenarios-duri
    text: Discovering new scenarios during testing or code review
  - id: 24-when-to-add-use-cases-identifying-edge-cases-that-sh
    rule: Identifying edge cases that should be explicitly tested
  - id: 24-when-to-add-use-cases-documenting-validation-rules-t
    text: Documenting validation rules that need test coverage
  - id: 24-when-to-add-use-cases-breaking-down-complex-behavior
    text: Breaking down complex behaviors into atomic testable scenarios
  - id: 24-when-to-add-use-cases-7
    rule: Each use-case should represent an atomic, testable scenario with a single clear expected
      outcome.
  - id: 3-tagging-tests-with-use-case-markers
    index: 7
    title: 3. Tagging Tests with Use-Case Markers
    category: standard
    items:
  - id: 3-tagging-tests-with-use-case-markers-1
    text: Tests are linked to use-cases using the `@pytest.mark.usecase` marker.
  - id: 31-basic-usage
    index: 8
    title: 3.1 Basic Usage
    category: standard
    items:
  - id: 31-basic-usage-code-1
    text: |
      import pytest

      @pytest.mark.usecase("UC-HEALTH-001")
      async def test_root_health_check_returns_ok(api_client):
          """Verify root liveness probe returns healthy status."""
          response = await api_client.get("/health")
          assert response.status_code == 200
          assert response.json() == {"status": "ok"}
  - id: 32-multiple-use-cases-per-test
    index: 9
    title: 3.2 Multiple Use-Cases per Test
    category: standard
    items:
  - id: 32-multiple-use-cases-per-test-1
    text: 'When a single test validates multiple related scenarios, apply multiple markers:'
  - id: 32-multiple-use-cases-per-test-code-2
    text: |
      @pytest.mark.usecase("UC-EXAMPLE-010")
      @pytest.mark.usecase("UC-EXAMPLE-011")
      async def test_pagination_validation_errors(async_client):
          """Verify pagination parameters are validated."""
          # Test page < 1
          response = await async_client.get("/api/v1/examples/processed-messages?page=0")
          assert response.status_code == 422

          # Test page_size < 1
          response = await async_client.get("/api/v1/examples/processed-messages?page_size=0")
          assert response.status_code == 422
  - id: 33-marker-registration
    index: 10
    title: 3.3 Marker Registration
    category: standard
    items:
  - id: 33-marker-registration-1
    rule: 'The `usecase` marker must be registered in `pyproject.toml` under `[tool.pytest.ini_options]`:'
  - id: 33-marker-registration-code-2
    text: |
      [tool.pytest.ini_options]
      markers = [
          "e2e: marks tests as end-to-end (requires running server)",
          "usecase(id): links test to a use-case ID from tests/docs/use_cases.yaml"
      ]
  - id: 34-best-practice-one-test-per-use-case
    index: 11
    title: '3.4 Best Practice: One Test Per Use-Case'
    category: standard
    items:
  - id: 34-best-practice-one-test-per-use-case-1
    text: 'For maximum traceability, strive for a 1:1 mapping between use-cases and tests:'
  - id: 34-best-practice-one-test-per-use-case-each-use-case-has-exactly-one
    text: Each use-case has exactly one test that validates it
  - id: 34-best-practice-one-test-per-use-case-each-test-links-to-exactly-one
    text: Each test links to exactly one use-case (unless scenarios are closely related)
  - id: 34-best-practice-one-test-per-use-case-test-names-reflect-the-use-cas
    text: Test names reflect the use-case description
  - id: 34-best-practice-one-test-per-use-case-5
    text: This makes it trivial to identify which test validates which scenario and vice versa.
  - id: 4-use-case-coverage-reporting
    index: 12
    title: 4. Use-Case Coverage Reporting
    category: standard
    items:
  - id: 4-use-case-coverage-reporting-1
    text: Coverage reporting will be implemented via pytest hooks in `tests/conftest.py`.
  - id: 41-report-format
    index: 13
    title: 4.1 Report Format
    category: standard
    items:
  - id: 41-report-format-1
    text: 'After test runs, a summary will display:'
  - id: 41-report-format-code-2
    text: |
      ========== Use-Case Coverage Report ==========
      Total use-cases: 20
      Covered: 15 (75%)
      Uncovered: 5

      Uncovered use-cases:
        - UC-HEALTH-003: Readiness check returns "unhealthy" when SurrealDB pool missing
        - UC-HEALTH-004: Readiness check returns "unhealthy" when Elasticsearch client missing
        - UC-EXAMPLE-008: List processed messages supports custom pagination parameters
        - UC-EXAMPLE-009: List processed messages returns page 2 correctly
        - UC-EXAMPLE-015: Get processed message handles different message types
      ==============================================
  - id: 42-ci-integration
    index: 14
    title: 4.2 CI Integration
    category: standard
    items:
  - id: 42-ci-integration-1
    text: 'The coverage report can fail the build if coverage falls below the configured threshold:'
  - id: 42-ci-integration-code-2
    text: |
      # Fail if use-case coverage is below threshold pytest --usecase-coverage-fail-under=<threshold>
  - id: 43-implementation-status
    index: 15
    title: 4.3 Implementation Status
    category: standard
    items:
  - id: 43-implementation-status-1
    rule: Use-case coverage is calculated automatically by scanning test files for `@pytest.mark.usecase`
      markers. The coverage script (`scripts/dev/test_coverage.py`) detects which use-cases have corresponding
      tests and reports coverage accordingly. No manual tracking is required.
  - id: 5-stub-tests-for-uncovered-use-cases
    index: 16
    title: 5. Stub Tests for Uncovered Use-Cases
    category: standard
    items:
  - id: 5-stub-tests-for-uncovered-use-cases-1
    text: For use-cases that are known but not yet implemented, create stub tests with skip decorators.
  - id: 51-stub-pattern
    index: 17
    title: 5.1 Stub Pattern
    category: standard
    items:
  - id: 51-stub-pattern-code-1
    text: |
      import pytest

      @pytest.mark.skip(reason="Not implemented yet")
      @pytest.mark.usecase("UC-HEALTH-003")
      async def test_health_unhealthy_when_surrealdb_missing(async_client):
          """Readiness check returns unhealthy when SurrealDB pool is missing.

          TODO: Implement by:
          1. Override app.state to set surrealdb_pool = None
          2. Call /api/v1/health
          3. Assert status is "unhealthy"
          """
          pass
  - id: 52-benefits-of-stub-tests
    index: 18
    title: 5.2 Benefits of Stub Tests
    category: standard
    items:
  - id: 52-benefits-of-stub-tests-visibility-missing-covera
    text: 'Visibility: Missing coverage is explicit in test reports, not silently absent'
  - id: 52-benefits-of-stub-tests-documentation-stubs-descr
    text: 'Documentation: Stubs describe what needs to be tested and how'
  - id: 52-benefits-of-stub-tests-planning-easy-to-see-tota
    text: 'Planning: Easy to see total test work remaining'
  - id: 52-benefits-of-stub-tests-ci-integration-skipped-te
    text: 'CI integration: Skipped tests appear in reports with clear reasons'
  - id: 53-todo-comments
    index: 19
    title: 5.3 TODO Comments
    category: standard
    items:
  - id: 53-todo-comments-1
    text: 'Include implementation guidance in stub docstrings:'
  - id: 53-todo-comments-what-setup-is-required
    rule: What setup is required
  - id: 53-todo-comments-what-actions-to-perform
    text: What actions to perform
  - id: 53-todo-comments-what-assertions-to-make
    text: What assertions to make
