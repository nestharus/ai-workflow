    text: 'The `test_tier` field in the use-case registry indicates where tests should live:'
  - id: 73-test-tier-field-integration-use-async_clie
    type: text
    text: '`integration`: Use `async_client` fixture, in-process testing'
  - id: 73-test-tier-field-e2e-use-api_client-fixtur
    type: text
    text: '`e2e`: Use `api_client` fixture, requires Docker stack'
  - id: 73-test-tier-field-4
    type: text
    text: Reference the test tier when creating new tests to ensure consistent organization.
- id: 74-fixture-selection
  index: 30
  title: 7.4 Fixture Selection
  category: standard
  summary: ''
  items:
  - id: 74-fixture-selection-1
    type: text
    text: |
      Fixture selection by tier:
      - Unit: Mocks/fakes with direct function calls
      - Component: Mocks/fakes with direct function calls
      - Integration: async_client fixture with httpx.ASGITransport (in-process)
      - E2E: api_client fixture with HTTP to live server
- id: 75-per-function-vs-use-case-coverage
  index: 31
  title: 7.5 Per-Function vs Use-Case Coverage
  category: standard
  summary: ''
  items:
  - id: 75-per-function-vs-use-case-coverage-1
    type: rule
    text: '* **Unit/Component/Scripts tiers**: Each function must individually meet the configured line
      and branch coverage threshold. This is not an average—every single function is validated separately.
      * **Integration/E2E tiers**: Use-cases must have corresponding tests with `@pytest.mark.usecase`
      markers (threshold configured in settings).'
