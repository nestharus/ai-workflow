# Lint script configuration for pyproject.toml [project.scripts] naming conventions
# Uses glob patterns following coderabbit path_filters format

# Rules for script entry point naming conventions:
# Scripts whose module path starts with the key must have names starting with the value.
prefix_rules:
  scripts.knowledge.: knowledge.
  scripts.dev.review.: review.
  scripts.app.: app.

# Paths to include for script validation
included_paths:
  - "pyproject.toml"
