"knowledge.query-comparisons" = "scripts.knowledge.query_comparisons:main"
"knowledge.query-iterative-movements" = "scripts.knowledge.movement_tracker:main_query_iterative"
"knowledge.record-iterative-movement" = "scripts.knowledge.movement_tracker:main_record_iterative"
