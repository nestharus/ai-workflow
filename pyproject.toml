[project]
name = "ai-workflow"
version = "0.1.0"
description = "Automated, orchestrator-based AI workflow system with 5-role agent skeleton."
readme = "README.md"
# ADR-0001: Use Python 3.14+ as the supported runtime range.
requires-python = ">=3.14.0,<3.15.0"
# Allow patch-level updates; review dependencies monthly for minor/major releases.
dependencies = [
    "fastapi>=0.121.3,<0.122.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "orjson>=3.11.5,<3.12.0",
    "pydantic>=2.12.5,<2.13.0",
    "pydantic-settings>=2.12.0,<2.13.0",
    "surrealdb>=1.0.8,<1.1.0",
    "elasticsearch>=9.2.0,<9.3.0",
    "anyio>=4.11.0,<4.12.0",
    "duckdb>=1.4.3,<1.5.0",
    "tqdm>=4.67.1,<4.68.0",
    "openai>=2.16.0,<2.17.0",
    "anthropic>=0.77.0,<0.78.0",
    "urllib3>=2.6.3,<3.0.0",
    "aiohttp>=3.13.3,<4.0.0",
    "scikit-learn>=1.6.1,<1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
exclude = ["tests*", "scripts/dev*", "scripts/knowledge*", "scripts/tests*"]

[dependency-groups]
# Core testing dependencies for tests/ (app tests)
test = [
    "httpx==0.28.1",
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-check==2.6.0",
    "pytest-cov>=7.0.0,<7.1.0",
    "pytest-mock>=3.15.1,<3.16.0",
    "pytest-randomly>=4.0.1,<4.1.0",
    "pytest-xdist==3.8.0",
    "pyfakefs>=5.8.0,<5.9.0",
    "jsonschema>=4.23.0,<5.0.0",
    "pytz>=2025.2,<2026.0",
]
# Linters, formatters, type checkers, and pre-commit hooks
dev = [
    { include-group = "test" },
    "pytest-benchmark>=5.2.3,<5.3.0",
    "pytest-timeout>=2.4.0,<2.5.0",
    "ast-grep-cli>=0.31.0,<0.41.0",
    "pyyaml>=6.0.3,<6.1.0",
    "mypy>=1.18.2,<1.19.0",
    "ruff>=0.14.10,<0.15",
    "checkov>=3.2.495,<3.3",
    "pymarkdownlnt==0.9.33",
    "pre-commit>=4.4.0,<4.5",
    "hadolint-coatl>=2.14.0,<2.15.0",
    "types-pyyaml>=6.0.12.20250915,<6.0.13",
    "types-jsonschema>=4.23.0,<4.24.0",
    "types-regex>=2024.11.6,<2024.12.0",
    "types-tqdm>=4.67.0.20250809,<4.68.0",
    "yamllint>=1.37.1,<1.38.0",
    "detect-secrets>=1.5.0,<1.6.0",
    "language-tool-python>=3.2.0,<3.3.0",
    "tomli-w>=1.2.0,<1.3.0",
]
# Knowledge management system dependencies (scripts/knowledge/)
knowledge = [
    { include-group = "test" },
    "duckdb>=1.4.3,<1.5.0",
    "nltk>=3.9.2,<3.10.0",
    "pypdf>=6.5.0,<6.6.0",
    "ijson>=3.4.0.post0,<3.5.0",
    "regex>=2025.11.3,<2025.12.0",
    "torch>=2.9.1,<3.0.0",
    "transformers>=4.57.3,<4.58.0",
]
demo = [
    "numpy>=2.4.0,<2.5.0",
    "matplotlib >=3.10.8,<3.11.0",
    "ipython >=9.8.0,<9.9.0",
]

[project.scripts]
# Runtime scripts
"app.start" = "scripts.app.start_server:main"
"app.api.generate" = "scripts.app.gen_openapi:main"
# Development scripts
setup = "scripts.dev.setup:main"
zip-changes = "scripts.dev.zip_changes:main"
lint = "scripts.dev.linter.lint_cli:main"
"lint-fix" = "scripts.lint_fixer.__main__:main"
"dev.ensure-env" = "scripts.dev.ensure_dev_env:main"
"dev.count-test-lines" = "scripts.dev.count_test_lines:main"
"dev.diff-test-functions" = "scripts.dev.diff_test_functions:main"
