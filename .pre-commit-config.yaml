repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            \.venv.*|
            node_modules/.*|
            uv\.lock|
            htmlcov/.*|
            \.coverage.*|
            openapi/.*|
            \.review/.*|
            \.tmp/.*|
            \.worktrees/.*|
            \.tasks/store/.*|
            \.huggingface/.*|
            \.serena/.*|
            \.mypy_cache/.*|
            \.pytest_cache/.*|
            \.ruff_cache/.*|
            \.git-rewrite/.*|
            to_adapt/.*|
            \.idea/.*|
            build/.*|
            dist/.*
          )$
  # Gitleaks secret scanner - runs alongside detect-secrets for defense-in-depth.
  # detect-secrets uses .secrets.baseline for allowlisting; gitleaks uses .gitleaks.toml.
  # Both hooks share the same exclude patterns to ensure consistent file coverage.
  # The --config argument explicitly loads .gitleaks.toml to guarantee config consistency.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml']
        exclude: |
          (?x)^(
            \.venv.*|
            node_modules/.*|
            uv\.lock|
            htmlcov/.*|
            \.coverage.*|
            openapi/.*|
            \.review/.*|
            \.tmp/.*|
            \.worktrees/.*|
            \.tasks/store/.*|
            \.huggingface/.*|
            \.serena/.*|
            \.mypy_cache/.*|
            \.pytest_cache/.*|
            \.ruff_cache/.*|
            \.git-rewrite/.*|
            to_adapt/.*|
            \.idea/.*|
            build/.*|
            dist/.*
          )$
  - repo: local
    hooks:
      - id: project-lint
        name: Run project lint pipeline (ruff + mypy)
        entry: uv run lint
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/dotenv-linter/dotenv-linter
    rev: v3.3.0  # Pinned version - must match documentation and plan references
    hooks:
      - id: dotenv-linter
        name: Lint .env files
        types: [file]
        files: ^\.env.*$
