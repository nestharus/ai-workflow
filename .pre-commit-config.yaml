repos:
  - repo: local
    hooks:
      - id: project-lint
        name: Run project lint pipeline (ruff + mypy)
        entry: uv run lint
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/dotenv-linter/dotenv-linter
    rev: v3.3.0  # Pinned version - must match documentation and plan references
    hooks:
      - id: dotenv-linter
        name: Lint .env files
        types: [file]
        files: ^\.env.*$
