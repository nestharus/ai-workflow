# Configuration for markdown file restriction linter
# Enforces that only README.md and AGENTS.md are allowed as markdown files
# in root, app/**, docs/**, scripts/**, and tests/** directories.
# All other documentation must be in YAML format.

# Directories to scan for markdown files
restricted_dirs:
  - .
  - app
  - docs
  - scripts
  - tests

# Markdown files that are explicitly allowed (paths relative to repo root)
allowed_files:
  - README.md
  - AGENTS.md

# Directories to exclude from scanning.
# Each entry is matched in two ways:
#   1. As a relative path under repo root (e.g., ".tasks/store" excludes only
#      that specific directory).
#   2. As a bare directory name matched anywhere in the path ancestry
#      (e.g., "node_modules" excludes any directory named "node_modules"
#      regardless of where it appears in the tree).
exclude_dirs:
  - .venv
  - node_modules
  - __pycache__
  - .git
  - .github
  - .claude
  - .huggingface
  - .opencode
  - .factory
  - .knowledge
  - .serena
  - .tasks  # Generated task files (all subdirectories)
  - store  # Generated task store (top-level directory)
  - .tmp
  - .worktrees
  - .git-rewrite
  - to_adapt
  - build
  - dist
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .sonar
  - .review
  - openapi
  - .idea
  - htmlcov
  - .coverage
  - .uv-cache
  - .cache
  - out
