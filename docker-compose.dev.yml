# Dev-tools stack for AI Workflow
#
# This compose file defines persistent development support services that run
# independently of WSL shell sessions. Use project name: ai-workflow-devtools
#
# Start:  docker compose -p ai-workflow-devtools -f docker-compose.dev.yml up -d
# Stop:   docker compose -p ai-workflow-devtools -f docker-compose.dev.yml down
# Logs:   docker logs ai-workflow-mcp-bridge-dev
#         docker logs ai-workflow-sandbox-server-dev
#         docker logs ai-workflow-ollama-dev
#
# Preferred: Use `uv run dev.ensure-env` for automated startup with locking
# and health checks.

services:
  # MCP Bridge Service
  # REST-to-MCP bridge that exposes MCP tools via Unix socket.
  # Local development only - must not be exposed to untrusted networks.
  #
  # SOCKET MODE: The bridge listens on a Unix socket at /tmp/mcp-bridge.sock
  # inside the container. A dedicated host directory (/tmp/mcp-sockets) is
  # mounted to container /tmp so host processes can access the socket at
  # /tmp/mcp-sockets/mcp-bridge.sock. This targeted mount reduces attack surface.
  #
  # PERMISSIONS: The container runs as appuser (UID 10000). The host
  # /tmp/mcp-sockets directory must be writable by this user for socket creation.
  mcp-bridge:
    build:
      context: ./scripts/servers/mcp
      dockerfile: Dockerfile
    container_name: ai-workflow-mcp-bridge-dev
    # Bind mount targeted socket directory from host to container /tmp
    # This allows host processes to communicate via /tmp/mcp-sockets/mcp-bridge.sock
    # Using targeted mount reduces attack surface compared to mounting entire /tmp
    volumes:
      - /tmp/mcp-sockets:/tmp
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_BRIDGE_SOCKET=/tmp/mcp-bridge.sock
      # Default MCP server - mcp-background-job provides time/scheduling tools
      - MCP_COMMAND=uvx mcp-background-job
    healthcheck:
      test: ["CMD", "curl", "-f", "--unix-socket", "/tmp/mcp-bridge.sock", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # Sandbox Server Service
  # Git rebase/merge operations in isolated sandbox checkout.
  # Local development only - must not be exposed to untrusted networks.
  #
  # SOCKET MODE: The server listens on a Unix socket at /tmp/sandbox.sock
  # inside the container. Host directory /tmp/sandbox-sockets is mounted to
  # container /tmp so host processes access the socket at
  # /tmp/sandbox-sockets/sandbox.sock.
  #
  # PERMISSIONS: Runs as root to handle WSL2 Windows filesystem permission
  # quirks when mounting the repository.
  sandbox-server:
    build:
      context: ./scripts/servers/sandbox
      dockerfile: Dockerfile
    container_name: ai-workflow-sandbox-server-dev
    # Run as root to handle WSL2 Windows filesystem permission quirks
    user: root
    volumes:
      # Mount repository as read-write for sandbox operations
      - ./:/repo:rw
      # Bind mount socket directory from host to container /tmp
      - /tmp/sandbox-sockets:/tmp
      # Mount SSH key for authentication to remote repositories
      - ~/.ssh/github:/ssh-key:ro
    environment:
      - SANDBOX_SOCKET_PATH=/tmp/sandbox.sock
      - SANDBOX_REPO_PATH=/repo
      # Use SSH with the mounted key, bypassing config file ownership checks
      - GIT_SSH_COMMAND=ssh -i /ssh-key -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket,json; s=socket.socket(socket.AF_UNIX); s.settimeout(3);
          s.connect('/tmp/sandbox.sock'); s.sendall(b'{"command":"status"}\n');
          r=s.recv(4096); s.close(); d=json.loads(r); exit(0 if d.get('status')=='success'
          else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Ollama SmolLM2 Service
  # Runs SmolLM2 models (135M, 360M) for cheap polling and complexity classification.
  # Local development only - exposes Ollama API on localhost:11434.
  #
  # Models pre-loaded in image:
  #   - smollm2:135m - Ultra-fast polling checks
  #   - smollm2:360m - Complexity classification
  #
  # API: curl http://localhost:11434/api/generate -d '{"model":"smollm2:135m","prompt":"...","stream":false}'
  ollama-smol:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    container_name: ai-workflow-ollama-dev
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=10
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  ollama_storage:
