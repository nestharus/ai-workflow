[mypy]
# Project uses Python 3.14; keep this aligned with runtime version.
python_version = 3.14
exclude = (?x)(
    ^\.venv
    | ^build/
    | ^dist/
    | ^tests/
    | ^scripts/tests/
    | ^\.coverage$
    | ^\.review/
    | ^\.coverage\..*
    | ^coverage\.xml
    | ^junit\.xml$
    | ^htmlcov/
    | ^\.pytest_cache/
    | ^\.mypy_cache/
    | ^openapi/
    | ^to_adapt/
    | ^\.idea/
    | ^\.tmp/
    | ^\.worktrees/
    | ^uv\.lock$
    )
packages = app, scripts
ignore_missing_imports = False
strict = True
warn_unused_configs = True
plugins = pydantic.mypy

[pydantic-mypy]
init_typed = true
init_forbid_extra = true

[mypy-surrealdb.*]
ignore_missing_imports = True

[mypy-elasticsearch.*]
ignore_missing_imports = True

[mypy-anyio.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-spacy.*]
ignore_missing_imports = True

[mypy-thinc.*]
ignore_missing_imports = True
