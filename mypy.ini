[mypy]
# Project uses Python 3.14; keep this aligned with runtime version.
python_version = 3.14
exclude = (?x)(
    ^\.venv
    | ^build/
    | ^dist/
    | ^tests/
    | ^scripts/tests/
    | ^\.coverage$
    | ^\.review/
    | ^\.coverage\..*
    | ^coverage\.xml
    | ^junit\.xml$
    | ^htmlcov/
    | ^\.pytest_cache/
    | ^\.mypy_cache/
    | ^openapi/
    | ^to_adapt/
    | ^\.idea/
    | ^\.tmp/
    | ^\.worktrees/
    | ^uv\.lock$
    )
packages = app, scripts
ignore_missing_imports = False
strict = True
warn_unused_configs = True
plugins = pydantic.mypy

[pydantic-mypy]
init_typed = true
init_forbid_extra = true

# surrealdb: SurrealDB Python client - no type stubs available
[mypy-surrealdb.*]
ignore_missing_imports = True

# elasticsearch: Elasticsearch Python client - no type stubs available
[mypy-elasticsearch.*]
ignore_missing_imports = True

# torch: PyTorch deep learning framework - no type stubs available
[mypy-torch.*]
ignore_missing_imports = True

# transformers: Hugging Face transformers library - no type stubs available
[mypy-transformers.*]
ignore_missing_imports = True

# ijson: Iterative JSON parser (github.com/ICRAR/ijson) - no type stubs available
[mypy-ijson.*]
ignore_missing_imports = True

# nltk: Natural Language Toolkit - no complete type stubs available
[mypy-nltk.*]
ignore_missing_imports = True

# spacy: spaCy NLP library - no type stubs available
[mypy-spacy.*]
ignore_missing_imports = True

# spec_manager: standalone project under scripts/ with its own pyproject.toml.
# Internal imports use bare `spec_manager.*` which mypy cannot resolve from
# the root config (it sees the package as `scripts.spec_manager.spec_manager.*`).
# ignore_missing_imports targets the imported namespace (spec_manager.*).
[mypy-spec_manager.*]
ignore_missing_imports = True

# Relax strict checks for spec_manager source files where imported types
# resolve to Any due to the unresolvable bare spec_manager.* namespace.
[mypy-scripts.spec_manager.spec_manager.*]
disallow_any_unimported = False
disallow_subclassing_any = False
warn_return_any = False
