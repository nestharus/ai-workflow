[project]
name = "spec-manager"
version = "1.0.0"
description = "General-purpose specification management library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
]

[project.scripts]
spec-manager = "spec_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Use project-local venv
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm_required'"
markers = [
    "slow: marks tests as slow",
    "llm_required: marks tests that require LLM API access (run with '-m llm_required')",
]

[dependency-groups]
dev = [
    "jsonschema>=4.20.0",
    "pyfakefs>=5.8.0,<5.9.0",
    "pytest>=9.0.2",
]
