# Ackermann Function Specification
# A classic example of a total computable function that is not primitive recursive.

spec_id: ackermann_function
title: Ackermann Function
description: |
  Compute the Ackermann function A(m, n). This is a two-argument recursive function
  that grows faster than any primitive recursive function. It is total and computable
  but demonstrates the limits of primitive recursion. The function has significant
  importance in computability theory and algorithm analysis.

complexity_score: 8
tags:
  - function
  - recursion
  - computability
  - non-primitive-recursive
  - exponential-growth
  - theory-of-computation

sections:
  OVERVIEW: |
    The Ackermann function is a classic example in computability theory, originally
    defined by Wilhelm Ackermann in 1928. It demonstrates that not all total
    computable functions are primitive recursive. The function grows extremely
    rapidly, making it impractical to compute for all but the smallest inputs.
    It serves as a benchmark for testing compiler recursion handling.

  DEFINITION: |
    The Ackermann function A(m, n) is defined for non-negative integers m and n.
    It is defined using nested recursion, where the recursion depth depends on
    the values of both arguments. This double recursion is what makes the function
    non-primitive recursive - it cannot be expressed using bounded loops alone.

  BASE_CASES: |
    The function has one base case for when m = 0:
    A(0, n) = n + 1

    This is the only terminating case that does not require further recursion.
    All other cases eventually reduce to this base through recursive calls.

  RECURSIVE_RULES: |
    For m > 0, the function has two recursive cases:

    Case 1: When n = 0
    A(m, 0) = A(m-1, 1)

    Case 2: When n > 0
    A(m, n) = A(m-1, A(m, n-1))

    The nested recursion in Case 2 causes the extreme growth rate.
    The inner call A(m, n-1) must complete before the outer call proceeds.

  GROWTH_ANALYSIS: |
    The Ackermann function exhibits hyper-exponential growth:
    - A(0, n) = n + 1 (linear)
    - A(1, n) = n + 2 (linear)
    - A(2, n) = 2n + 3 (linear)
    - A(3, n) = 2^(n+3) - 3 (exponential)
    - A(4, n) = 2^2^...^2 - 3 (tower of n+3 twos, tetration)
    - A(5, n) and beyond grow faster than any stack of exponentials

    The inverse Ackermann function alpha(n) grows so slowly that for all
    practical values it is effectively constant (at most 4 for n < 2^65536).

  EXAMPLES: |
    Small values of A(m, n):

    A(0, 0) = 1
    A(0, 1) = 2
    A(1, 0) = 2
    A(1, 1) = 3
    A(1, 2) = 4
    A(2, 0) = 3
    A(2, 1) = 5
    A(2, 2) = 7
    A(2, 3) = 9
    A(3, 0) = 5
    A(3, 1) = 13
    A(3, 2) = 29
    A(3, 3) = 61
    A(4, 0) = 13
    A(4, 1) = 65533
    A(4, 2) = 2^65536 - 3 (a number with ~19729 digits)

rules:
  - rule_id: RULE-001
    rule_type: base
    description: When m is 0, return n + 1.
    formal_expression: A(0, n) = n + 1
    dependencies: []
    examples:
      - [[0, 0], 1]
      - [[0, 1], 2]
      - [[0, 5], 6]
      - [[0, 10], 11]

  - rule_id: RULE-002
    rule_type: recursive
    description: When m > 0 and n is 0, recurse with m-1 and 1.
    formal_expression: A(m, 0) = A(m-1, 1) for m > 0
    dependencies:
      - RULE-001
    examples:
      - [[1, 0], 2]
      - [[2, 0], 3]
      - [[3, 0], 5]
      - [[4, 0], 13]

  - rule_id: RULE-003
    rule_type: recursive
    description: When m > 0 and n > 0, apply nested recursion.
    formal_expression: A(m, n) = A(m-1, A(m, n-1)) for m > 0, n > 0
    dependencies:
      - RULE-001
      - RULE-002
    examples:
      - [[1, 1], 3]
      - [[1, 2], 4]
      - [[2, 1], 5]
      - [[2, 2], 7]
      - [[3, 1], 13]
      - [[3, 2], 29]

  - rule_id: RULE-004
    rule_type: constraint
    description: Both arguments must be non-negative integers.
    formal_expression: m >= 0, n >= 0, m, n in Z
    dependencies: []
    examples: []

  - rule_id: RULE-005
    rule_type: property
    description: The function is total - it terminates for all valid inputs.
    formal_expression: A(m, n) is defined for all m, n in N
    dependencies:
      - RULE-001
      - RULE-002
      - RULE-003
    examples: []

ground_truth:
  sectionization:
    expected_sections:
      - OVERVIEW
      - DEFINITION
      - BASE_CASES
      - RECURSIVE_RULES
      - GROWTH_ANALYSIS
      - EXAMPLES

  summarization:
    expected_libraries:
      - AckermannFunction

  library_synthesis:
    expected_libraries: []
    expected_requirements:
      - Base case A(0, n) = n + 1
      - Recursive case A(m, 0) = A(m-1, 1)
      - Nested recursive case A(m, n) = A(m-1, A(m, n-1))
      - Non-negative integer constraints
      - Totality guarantee

  spec_building:
    expected_requirements:
      - Base case implementation for m = 0
      - Recursive case implementation for n = 0
      - Nested recursion implementation
      - Input validation for non-negative integers
      - Stack overflow protection for large inputs
    expected_elements: []

  overall_requirements_count: 5
  overall_elements_count: 5
  convergence_iterations_max: 6
