# Sylvester's Sequence Specification
# A multiplicative recurrence sequence with fascinating number-theoretic properties.

spec_id: sylvester_sequence
title: Sylvester's Sequence
description: |
  Compute Sylvester's sequence s(n). Unlike additive sequences like Fibonacci,
  Sylvester's sequence uses a multiplicative recurrence: each term is one more
  than the product of all preceding terms. This creates a sequence that grows
  doubly exponentially and has remarkable coprimality properties.

complexity_score: 6
tags:
  - sequence
  - multiplicative
  - coprime
  - exponential-growth
  - number-theory
  - egyptian-fractions

sections:
  OVERVIEW: |
    Sylvester's sequence, named after James Joseph Sylvester (1814-1897), is a
    sequence of rapidly growing integers with remarkable properties. Each term
    is coprime to all other terms, and the sum of reciprocals converges to 1.
    The sequence arises naturally in the greedy algorithm for Egyptian fractions
    and has connections to coding theory and combinatorics.

  DEFINITION: |
    Sylvester's sequence s(n) is defined for non-negative integers n >= 0.
    The sequence represents the denominators that appear when expressing 1
    as a sum of distinct unit fractions using the greedy algorithm:
    1 = 1/2 + 1/3 + 1/7 + 1/43 + 1/1807 + ...

    The sequence grows doubly exponentially: s(n) is approximately 1.264^(2^n).

  INITIAL_VALUE: |
    s(0) = 2

    This is the starting point of the sequence. The choice of 2 as the initial
    value is natural because 1/2 is the largest unit fraction less than 1,
    which is what the greedy algorithm selects first.

  RECURRENCE: |
    For n >= 1:
    s(n) = s(0) * s(1) * ... * s(n-1) + 1

    Equivalently, using the previous term:
    s(n) = s(n-1) * (s(n-1) - 1) + 1
    s(n) = s(n-1)^2 - s(n-1) + 1

    This quadratic recurrence causes doubly exponential growth.

  PROPERTIES: |
    Key properties of Sylvester's sequence:

    1. Coprimality: gcd(s(m), s(n)) = 1 for all m != n
       Every pair of terms is coprime.

    2. Sum of reciprocals: Sum of 1/s(n) for n >= 0 equals 1
       This is exact, not an approximation.

    3. Product formula: s(n) - 1 = s(0) * s(1) * ... * s(n-1)
       The product of all previous terms is always s(n) - 1.

    4. Growth rate: s(n) is approximately E^(2^n) where E approximately 1.264

  EXAMPLES: |
    The first several terms of Sylvester's sequence:

    s(0) = 2
    s(1) = 2 + 1 = 3
    s(2) = 2*3 + 1 = 7
    s(3) = 2*3*7 + 1 = 43
    s(4) = 2*3*7*43 + 1 = 1807
    s(5) = 2*3*7*43*1807 + 1 = 3263443
    s(6) = 10650056950807
    s(7) = 113423713055421844361000443

    The sequence grows so rapidly that s(8) has 56 digits.

rules:
  - rule_id: RULE-001
    rule_type: base
    description: The zeroth Sylvester number is 2.
    formal_expression: s(0) = 2
    dependencies: []
    examples:
      - [0, 2]

  - rule_id: RULE-002
    rule_type: recurrence
    description: Each term is one more than the product of all preceding terms.
    formal_expression: s(n) = 1 + product(s(k) for k in 0..n-1) for n >= 1
    dependencies:
      - RULE-001
    examples:
      - [1, 3]       # 2 + 1
      - [2, 7]       # 2*3 + 1
      - [3, 43]      # 2*3*7 + 1
      - [4, 1807]    # 2*3*7*43 + 1
      - [5, 3263443] # 2*3*7*43*1807 + 1

  - rule_id: RULE-003
    rule_type: property
    description: The quadratic recurrence form using only the previous term.
    formal_expression: s(n) = s(n-1)^2 - s(n-1) + 1 for n >= 1
    dependencies:
      - RULE-001
      - RULE-002
    examples:
      - [1, 3]    # 2^2 - 2 + 1 = 4 - 2 + 1 = 3
      - [2, 7]    # 3^2 - 3 + 1 = 9 - 3 + 1 = 7
      - [3, 43]   # 7^2 - 7 + 1 = 49 - 7 + 1 = 43
      - [4, 1807] # 43^2 - 43 + 1 = 1849 - 43 + 1 = 1807

  - rule_id: RULE-004
    rule_type: property
    description: All pairs of terms are coprime (mutually prime).
    formal_expression: gcd(s(m), s(n)) = 1 for all m != n
    dependencies:
      - RULE-002
    examples:
      - [[2, 3], 1]    # gcd(s(0), s(1)) = gcd(2, 3) = 1
      - [[7, 43], 1]   # gcd(s(2), s(3)) = gcd(7, 43) = 1
      - [[3, 1807], 1] # gcd(s(1), s(4)) = gcd(3, 1807) = 1

ground_truth:
  sectionization:
    expected_sections:
      - OVERVIEW
      - DEFINITION
      - INITIAL_VALUE
      - RECURRENCE
      - PROPERTIES
      - EXAMPLES

  summarization:
    expected_libraries:
      - SylvesterSequence

  library_synthesis:
    expected_libraries: []
    expected_requirements:
      - Initial value s(0) = 2
      - Product recurrence s(n) = product + 1
      - Quadratic recurrence s(n) = s(n-1)^2 - s(n-1) + 1
      - Coprimality property for all term pairs

  spec_building:
    expected_requirements:
      - Initial value initialization for s(0) = 2
      - Product-based recurrence implementation
      - Alternative quadratic recurrence implementation
      - Coprimality verification property
    expected_elements: []

  overall_requirements_count: 4
  overall_elements_count: 4
  convergence_iterations_max: 5
