overall_requirements_count: 52
overall_elements_count: 52
# Note: CrossSystemInvariants is NOT a library. Cross-system invariants
# (rate freshness, dead-letter audit, settlement finality, correlation tracing)
# are system-level constraints with no library assignment. The requirements
# they represent are still counted in the totals above.
convergence_iterations_max: 20
