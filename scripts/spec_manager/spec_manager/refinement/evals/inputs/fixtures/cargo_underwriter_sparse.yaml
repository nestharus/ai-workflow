ground_truth:
  sectionization:
    expected_sections:
      - OVERVIEW
      - UNDERWRITING_JOURNEY
      - CLAIMS_AND_RECOVERY
      - ACTUARIAL_BACKBONE
      - TREATY_MANAGEMENT
      - INTEGRITY_AND_DETECTION
      - OPERATIONAL_FABRIC
      - ANALYSIS

  summarization:
    expected_libraries:
      - Policy lifecycle management including underwriting, premium calculation, endorsements, and renewals
      - Actuarial risk scoring with route-level models, catastrophe loading, and loss-history weighting
      - Claims intake, assessment, and settlement with severity-based triage and partial payment capability
      - Treaty management including excess-of-loss and quota-share cession with bordereau reporting
      - Claim fraud detection using velocity checks, document analysis, and behavioral scoring
      - Regulatory compliance including sanctions screening, AML checks, and large-loss reporting
      - Immutable event-sourced audit trail with cryptographic hash chain and reconstruction capability
      - Alert routing and notification delivery with priority channels and catastrophe digest batching

  library_synthesis:
    expected_libraries:
      - PolicyEngine
      - RiskModeler
      - ClaimsProcessor
      - ReinsuranceBroker
      - FraudDetector
      - ComplianceGateway
      - AuditLedger
      - NotificationHub
    expected_requirements:
      # PolicyEngine (10)
      - Policy application must include insured value, cargo type, origin, destination, transport mode, and coverage period
      - Premium base rate is $2.50 per $1,000 of insured value for standard cargo
      - Route risk score ranges from 1.0 to 3.5 and multiplies the base rate
      - Marine peril surcharge is 15%, air is 8%, multimodal is 12%
      - Deductible credit equals deductible divided by insured value, capped at 20%
      - Endorsements take effect at midnight UTC on requested effective date
      - Renewal premium increases by 30% of base rate when prior-year loss ratio exceeds 75%
      - Coverage gap exceeding 48 hours requires new application instead of renewal
      - Automatic war and sanctions exclusion on all policies
      - Mid-term cancellation refund is pro-rata less 15% short-rate penalty
      # RiskModeler (6)
      - High-risk routes with score above 2.5 require mandatory physical survey
      - Loss-history weighting is 50% for years 1-3, 30% for years 4-7, 20% for years 8-10
      - Catastrophe loading of 25% applied when route passes through catastrophe zone
      - Catastrophe zone defined as region with insured losses exceeding $50M in past 5 years
      - Risk model recalibrated quarterly or when loss ratio deviates more than 15% from projected
      - Catastrophe loading compounds with route risk score applied before multiplication
      # ClaimsProcessor (8)
      - Claims must be filed within 30 days of loss discovery
      - Claims assessment SLA is 4 hours from submission to decision
      - Claims above $250,000 require senior adjuster approval
      - Payment issued within 5 business days of claim approval
      - Subrogation rights preserved for claims exceeding $100,000
      - Partial payment at 60% of undisputed amount during coverage disputes
      - Salvage value deducted from claim before reinsurance recovery calculation
      - Claims below $25,000 handled by automated fast-track queue
      # ReinsuranceBroker (7)
      - Insurer retains first $500,000 of any individual loss under excess-of-loss treaty
      - Losses above retention ceded up to $10M treaty ceiling per occurrence
      - Quota share of 40% on retained portion triggered by multi-policy catastrophe events
      - Bordereau reports due monthly by T+15 calendar days
      - Reinsurance recovery updates claim reserve within 48 hours of cession confirmation
      - Treaty inception January 1 with pro-rata premium allocation for mid-year policies
