ground_truth:
  sectionization:
    expected_sections:
      - OVERVIEW
      - SETTLEMENT_PROCESSING
      - RISK_ENGINE
      - RECONCILIATION_SERVICE
      - EVENT_PIPELINE
      - REGULATORY_COMPLIANCE
      - NOTIFICATION_AND_AUDIT

  summarization:
    expected_libraries:
      - Settlement netting and gross processing with FX conversion
      - Counterparty credit exposure and margin call management
      - Ledger reconciliation with tolerance-based break detection
      - Pub/sub event distribution with dead-letter handling
      - Regulatory reporting windows and hold-period enforcement
      - Immutable audit trail with routed notifications

  library_synthesis:
    expected_libraries:
      - SettlementProcessor
      - RiskEngine
      - ReconciliationService
      - EventPipeline
      - RegulatoryCompliance
      - AuditNotification
    expected_requirements:
      - Settlement instructions must contain counterparty ID, value date, currency pair, and notional amount
      - Netting threshold is $1,000,000 for same counterparty and value date
      - Instructions at or above netting threshold are processed gross
      - FX conversion uses ECB reference rate captured at T-1 with EUR triangulation fallback
      - Counterparty credit limit capped at $50M
      - Exposure calculated across T+0 to T+2 window
      - Margin call issued when exposure reaches 80% of limit
      - No single counterparty may exceed 25% of total exposure
      - Tier-1 override bypasses credit cap and concentration limit
      - Reconciliation matching on exact amount, counterparty, and value date
      - Domestic tolerance band of 0.01%
      - Cross-border tolerance band of 0.05%
      - Breaks below $1,000 are auto-resolved
      - Event ordering guaranteed within topic partition
      - Exponential backoff retry at 1s, 4s, 16s
      - Dead-letter queue after 3 failed attempts
      - Dead-letter events purged after 90 days
      - Event payloads must not exceed 256 KB
      - Settlements above $10M reported within 15 minutes
      - Cross-border settlements above $5M subject to 24-hour hold
      - Transactions above $25M flagged as suspicious
      - Audit writes must complete within 50ms
      - Notification routing by event type to email, dashboard, or Slack
      - Audit entry written before notification dispatch
      - Audit snapshot emitted on settlement confirmation
      - Exposure snapshots published to audit every five minutes
      - Structuring detection aggregates sub-threshold transactions against $10M reporting threshold
      - Regulatory reports retained for seven years
      - Unmatched reconciliation entries escalated after seven business days
      - Notification batching consolidates alerts during high-volume periods
    expected_ambiguities:
      - "netting threshold amount unspecified"
      - "FX rate source unspecified"
      - "reconciliation tolerance band unspecified"
      - "event ordering guarantee unspecified"
      - "regulatory reporting window unspecified"
      - "audit latency requirement unspecified"
      - "dead letter retry policy unspecified"
      - "Tier-1 override vs risk cap conflict unresolved"

