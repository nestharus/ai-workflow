# Complex Recurrence Sequence Specification
# A challenging test case with many dependencies (15 rules) for evaluating refinement.

spec_id: complex_recurrence
title: Complex Multi-Recurrence Sequence
description: |
  A sophisticated sequence system with multiple interrelated recurrence relations,
  conditional branches, and aggregation rules. This specification tests the
  refinement system's ability to handle complex dependencies and extract
  intricate requirements.

complexity_score: 9
tags:
  - sequence
  - recurrence
  - complex
  - dependency-heavy
  - aggregation

sections:
  OVERVIEW: |
    This system computes three interrelated sequences A, B, and C, where each
    sequence depends on values from the others. Additionally, an aggregation
    sequence S combines values from all three.

  SEQUENCE_A_DEFINITION: |
    Sequence A is a modified Fibonacci-like sequence that also depends on B:
    A(0) = 1
    A(1) = 1
    A(n) = A(n-1) + A(n-2) + floor(B(n-1)/2) for n ≥ 2

  SEQUENCE_B_DEFINITION: |
    Sequence B is a Lucas-like sequence that depends on A:
    B(0) = 2
    B(1) = 1
    B(n) = B(n-1) + B(n-2) + A(n-1) mod 3 for n ≥ 2

  SEQUENCE_C_DEFINITION: |
    Sequence C uses a conditional recurrence based on parity:
    C(0) = 0
    C(1) = 1
    If n is even: C(n) = C(n/2) + A(n)
    If n is odd: C(n) = C(n-1) + B(n)

  AGGREGATION_SEQUENCE: |
    Sequence S aggregates all three:
    S(n) = A(n) + B(n) + C(n)

  CONVERGENCE_RATIO: |
    The ratio R(n) = A(n) / B(n) converges to approximately 0.618...
    This can be used as a validation check.

  BOUNDARY_CONDITIONS: |
    - All indices must be non-negative integers
    - Results must fit within 64-bit integers for n ≤ 50
    - Overflow handling for larger computations

  MEMOIZATION: |
    Due to cross-dependencies, memoization is essential:
    - Cache A, B, C values to avoid exponential recomputation
    - Compute in order: A(k), B(k), C(k) for k = 0, 1, 2, ...

  VALIDATION_PROPERTIES: |
    Property 1: S(n) is always positive for n ≥ 0
    Property 2: A(n) < B(n) + C(n) for n ≥ 5
    Property 3: The growth rate is exponential

  ERROR_CASES: |
    - Negative index: raise ValueError
    - Integer overflow: raise OverflowError
    - Stack overflow (recursion too deep): use iterative approach

  OPTIMIZATION_HINTS: |
    1. Bottom-up computation avoids recursion overhead
    2. Only need to store last 2 values of A and B
    3. C requires full history due to C(n/2) access

  TESTING_VALUES: |
    n=0: A=1, B=2, C=0, S=3
    n=1: A=1, B=1, C=1, S=3
    n=2: A=3, B=4, C=3, S=10
    n=3: A=6, B=6, C=7, S=19
    n=4: A=12, B=13, C=15, S=40

  DEPENDENCIES_GRAPH: |
    A depends on: A(previous), B(previous)
    B depends on: B(previous), A(previous)
    C depends on: C(previous or half), A(current), B(current)
    S depends on: A(current), B(current), C(current)

  COMPUTATION_ORDER: |
    For each n from 0:
    1. Compute A(n) using cached A(n-1), A(n-2), B(n-1)
    2. Compute B(n) using cached B(n-1), B(n-2), A(n-1)
    3. Compute C(n) using A(n), B(n), and cached C values
    4. Compute S(n) from A(n), B(n), C(n)

  PARALLEL_COMPUTATION: |
    A(n) and B(n) can be computed in parallel once dependencies are ready.
    C(n) must wait for both A(n) and B(n).

rules:
  - rule_id: RULE-001
    rule_type: base
    description: Base case for sequence A at index 0.
    formal_expression: A(0) = 1
    dependencies: []
    examples:
      - [0, 1]

  - rule_id: RULE-002
    rule_type: base
    description: Base case for sequence A at index 1.
    formal_expression: A(1) = 1
    dependencies: []
    examples:
      - [1, 1]

  - rule_id: RULE-003
    rule_type: base
    description: Base case for sequence B at index 0.
    formal_expression: B(0) = 2
    dependencies: []
    examples:
      - [0, 2]

  - rule_id: RULE-004
    rule_type: base
    description: Base case for sequence B at index 1.
    formal_expression: B(1) = 1
    dependencies: []
    examples:
      - [1, 1]

  - rule_id: RULE-005
    rule_type: base
    description: Base case for sequence C at index 0.
    formal_expression: C(0) = 0
    dependencies: []
    examples:
      - [0, 0]

  - rule_id: RULE-006
    rule_type: base
    description: Base case for sequence C at index 1.
    formal_expression: C(1) = 1
    dependencies: []
    examples:
      - [1, 1]

  - rule_id: RULE-007
    rule_type: recurrence
    description: Recurrence for A using previous A values and B.
    formal_expression: A(n) = A(n-1) + A(n-2) + floor(B(n-1)/2)
    dependencies:
      - RULE-001
      - RULE-002
      - RULE-003
      - RULE-004
    examples:
      - [2, 3]
      - [3, 6]

  - rule_id: RULE-008
    rule_type: recurrence
    description: Recurrence for B using previous B values and A.
    formal_expression: B(n) = B(n-1) + B(n-2) + A(n-1) mod 3
    dependencies:
      - RULE-001
      - RULE-002
      - RULE-003
      - RULE-004
    examples:
      - [2, 4]
      - [3, 6]

  - rule_id: RULE-009
    rule_type: recurrence
    description: Recurrence for C when n is even.
    formal_expression: C(n) = C(n/2) + A(n) when n mod 2 = 0
    dependencies:
      - RULE-005
      - RULE-007
    examples:
      - [2, 3]
      - [4, 15]

  - rule_id: RULE-010
    rule_type: recurrence
    description: Recurrence for C when n is odd.
    formal_expression: C(n) = C(n-1) + B(n) when n mod 2 = 1
    dependencies:
      - RULE-006
      - RULE-008
    examples:
      - [3, 7]

  - rule_id: RULE-011
    rule_type: constraint
    description: Aggregation formula for S.
    formal_expression: S(n) = A(n) + B(n) + C(n)
    dependencies:
      - RULE-007
      - RULE-008
      - RULE-009
      - RULE-010
    examples:
      - [2, 10]
      - [3, 19]
      - [4, 40]

  - rule_id: RULE-012
    rule_type: constraint
    description: Non-negative index constraint.
    formal_expression: n ≥ 0
    dependencies: []
    examples: []

  - rule_id: RULE-013
    rule_type: boundary
    description: Memoization requirement for efficiency.
    formal_expression: cache[A], cache[B], cache[C] required
    dependencies:
      - RULE-007
      - RULE-008
      - RULE-009
      - RULE-010
    examples: []

  - rule_id: RULE-014
    rule_type: boundary
    description: Integer overflow detection for large n.
    formal_expression: result ≤ MAX_INT64
    dependencies:
      - RULE-011
    examples: []

  - rule_id: RULE-015
    rule_type: constraint
    description: Computation ordering requirement.
    formal_expression: compute_order = A(k), B(k), C(k) for k = 0..n
    dependencies:
      - RULE-007
      - RULE-008
      - RULE-009
      - RULE-010
      - RULE-013
    examples: []

