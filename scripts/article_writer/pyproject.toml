[project]
name = "article-writer"
version = "0.1.0"
description = "Multi-agent writing workflow with pausable state machine"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
article-writer = "article_writer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "agents", "workflow", "prompts", "references"]

[dependency-groups]
dev = []
