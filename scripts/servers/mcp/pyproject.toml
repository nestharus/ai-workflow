[project]
name = "mcp-bridge"
version = "1.0.0"
description = "Socket-based MCP bridge server that exposes MCP tools via Unix socket"
requires-python = ">=3.14.0,<3.15.0"
dependencies = [
    "pyyaml>=6.0.3,<6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["server"]
