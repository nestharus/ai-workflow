[project]
name = "sandbox-server"
version = "1.0.0"
description = "Git rebase/merge sandbox server for isolated git operations"
requires-python = ">=3.14.0,<3.15.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["."]
