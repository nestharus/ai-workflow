# Standalone sandbox server (for debugging/testing only)
#
# PREFERRED: Use the dev-tools compose stack instead:
#   docker compose -p ai-workflow-devtools -f docker-compose.dev.yml up -d
#   Or: uv run dev.ensure-env
#
# This standalone compose is kept for debugging/isolation testing.
#
# Usage:
#   # Create host socket directory first (required):
#   mkdir -p /tmp/sandbox-sockets && chmod 1777 /tmp/sandbox-sockets
#
#   # Start the server:
#   docker compose -f scripts/servers/sandbox/docker-compose.yml up -d
#   docker compose -f scripts/servers/sandbox/docker-compose.yml logs -f
#   docker compose -f scripts/servers/sandbox/docker-compose.yml down
#
# The socket will be available at the host path defined by SANDBOX_SOCKET_HOST_DIR
# (defaults to /tmp/sandbox-sockets). The CLI uses /tmp/sandbox-sockets/sandbox.sock.

services:
  sandbox-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-workflow/sandbox-server:dev
    container_name: sandbox-server
    restart: unless-stopped
    # Run as root to handle WSL2 Windows filesystem permission quirks
    user: root

    volumes:
      # Mount repository as read-write for sandbox operations
      - ../../../:/repo:rw
      # Bind-mount host directory so socket is accessible from host CLI
      # Default: /tmp/sandbox-sockets on host -> /tmp in container
      # Socket will be at /tmp/sandbox-sockets/sandbox.sock on host
      - ${SANDBOX_SOCKET_HOST_DIR:-/tmp/sandbox-sockets}:/tmp
      # Mount only the SSH private key file for authentication
      - ~/.ssh/github:/ssh-key:ro

    environment:
      - SANDBOX_SOCKET_PATH=/tmp/sandbox.sock
      - SANDBOX_REPO_PATH=/repo
      # Use SSH with the mounted key, bypassing config file ownership checks
      - GIT_SSH_COMMAND=ssh -i /ssh-key -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
      # Health check is defined in Dockerfile (validates socket and server response)

# No named volumes needed - using bind mount for socket directory
volumes: {}
