[project]
name = "mcp-bridge"
version = "1.0.0"
description = "REST-to-MCP bridge server that exposes MCP tools via HTTP"
requires-python = ">=3.14.0,<3.15.0"
dependencies = [
    "fastapi>=0.121.2,<0.124.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "pydantic>=2.12.4,<2.13.0",
    "httpx>=0.28.1,<0.29.0",
    "pyyaml>=6.0.3,<6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["app", "client"]
