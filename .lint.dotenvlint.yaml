# Lint script driver configuration for dotenv-linter
# Paths to include for .env file linting (glob patterns)

# Paths to include in scanning (glob patterns)
included_paths:
  # Root-level .env files
  - ".env"
  - ".env.*"
  # App directory
  - "app/.env"
  - "app/.env.*"
  # Scripts directory
  - "scripts/.env"
  - "scripts/.env.*"
  # Tests directory
  - "tests/.env"
  - "tests/.env.*"
