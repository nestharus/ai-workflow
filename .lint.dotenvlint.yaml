# Lint script driver configuration for dotenv-linter
# Uses glob patterns following coderabbit path_filters format

# Patterns to scan for .env files
targets:
  - .env.example
  - .env.*.example

# Paths to include in scanning (glob patterns)
included_paths:
  - "*"
  - "app/**"
  - "tests/**"
  - "scripts/**"
  - ".ai/**"
  - ".claude/**"
  - ".github/**"
  - "agents/**"

# Exclusion patterns (following coderabbit format with ! prefix)
exclude_patterns:
  - "!*.local"  # Exclude all .env.local files
  - "!*.env.*.local"
