# Lint script configuration for pymarkdown
# Paths to include for markdown linting (glob patterns)

included_paths:
  # Root-level markdown files
  - "README.md"
  - "AGENTS.md"
  # Docs directory (excluding plans and references)
  - "docs/architecture/**/*.md"
  - "docs/development/**/*.md"
  - "docs/processes/**/*.md"
  - "docs/testing/**/*.md"
  - "docs/usage/**/*.md"
  # README files in subdirectories
  - "scripts/knowledge/README.md"
