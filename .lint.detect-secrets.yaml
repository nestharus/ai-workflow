# Lint configuration for detect-secrets file filtering
# These files are excluded from secret scanning as they are binary/non-text files
# or files that don't need to be scanned.

# File extensions to exclude from scanning (binary and non-text files)
excluded_extensions:
  - .pyc
  - .pyo
  - .so
  - .dll
  - .exe
  - .bin
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .ico
  - .svg
  - .woff
  - .woff2
  - .ttf
  - .eot
  - .zip
  - .tar
  - .gz
  - .bz2
  - .db
  - .sqlite
  - .sqlite3

# Specific file names to exclude from scanning
excluded_names:
  - uv.lock
  - .secrets.baseline
