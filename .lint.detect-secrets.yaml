# Lint configuration for detect-secrets file filtering
# Uses glob patterns following coderabbit path_filters format

# File extensions to exclude (binary/non-text files)
excluded_extensions:
  - .pyc
  - .pyo
  - .so
  - .dll
  - .exe
  - .bin
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .ico
  - .svg
  - .woff
  - .woff2
  - .ttf
  - .eot
  - .zip
  - .tar
  - .gz
  - .bz2
  - .db
  - .sqlite
  - .sqlite3

# Specific file names to exclude
excluded_names:
  - uv.lock
  - .secrets.baseline

# Paths to include in scanning (glob patterns, following coderabbit format)
# Patterns without ! are inclusions, patterns with ! are exclusions
included_paths:
  - "*"
  - "app/**"
  - "tests/**"
  - "scripts/**"
  - ".ai/**"
  - ".claude/**"
  - ".github/**"
  - "agents/**"
  - "!tests/**/*.pyc"
  - "!scripts/**/*.pyc"
