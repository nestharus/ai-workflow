# Lint configuration for detect-secrets file filtering
# Paths to include in scanning (glob patterns)

# File extensions to exclude (binary/non-text files)
excluded_extensions:
  - .pyc
  - .pyo
  - .so
  - .dll
  - .exe
  - .bin
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .ico
  - .svg
  - .woff
  - .woff2
  - .ttf
  - .eot
  - .zip
  - .tar
  - .gz
  - .bz2
  - .db
  - .sqlite
  - .sqlite3

# Specific file names to exclude
excluded_names:
  - uv.lock
  - .secrets.baseline

# Paths to include in scanning (glob patterns)
included_paths:
  # Exclusions (must come first)
  - "!**/.venv/**"
  # Root-level files
  - "*"
  # App directory
  - "app/**"
  # Tests directory
  - "tests/**"
  # Scripts directory
  - "scripts/**"
  # Config directories
  - ".claude/**"
  - ".ai/**"
  - ".github/**"
  # Docs directory (excluding plans and references)
  - "docs/**"
  - "!docs/plans/**"
  - "!docs/references/**"
  # Exclude surgeon logs anywhere
  - "!**/surgeon_logs/**"
