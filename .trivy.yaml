# Trivy security scanner configuration
# See: https://aquasecurity.github.io/trivy/latest/docs/references/configuration/config-file/

severity:
  - HIGH
  - CRITICAL

exit-code: 1

scan:
  scanners:
    - vuln

vulnerability:
  # Skip vulnerabilities with no available fix — nothing actionable
  ignore-unfixed: true

# Do not include dev dependencies by default for security scanning
# Run with --include-dev-deps flag for comprehensive checks
