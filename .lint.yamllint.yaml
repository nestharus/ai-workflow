# Lint script configuration for yamllint
# Paths to include for YAML linting (glob patterns)

included_paths:
  # Exclusions (must come first)
  - "!**/.venv/**"
  # Root-level YAML files
  - "*.yaml"
  - "*.yml"
  # App directory
  - "app/**/*.yaml"
  - "app/**/*.yml"
  # Tests directory
  - "tests/**/*.yaml"
  - "tests/**/*.yml"
  # Scripts directory
  - "scripts/**/*.yaml"
  - "scripts/**/*.yml"
  # Claude/AI config directories
  - ".claude/**/*.yaml"
  - ".claude/**/*.yml"
  - ".ai/**/*.yaml"
  - ".ai/**/*.yml"
  # Docs directory (excluding plans and references)
  - "docs/**/*.yaml"
  - "docs/**/*.yml"
  - "!docs/plans/**"
  - "!docs/references/**"
  # GitHub workflows
  - ".github/workflows/**/*.yaml"
  - ".github/workflows/**/*.yml"
