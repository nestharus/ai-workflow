# Lint script configuration for yamllint
# Uses glob patterns following coderabbit path_filters format

# Paths to include for YAML linting
included_paths:
  - "*"
  - "app/**"
  - "tests/**"
  - "scripts/**"
  - ".ai/**"
  - ".claude/**"
  - ".github/**"
  - "agents/**"

# Exclusion patterns (following coderabbit format with ! prefix)
excludes:
  - "!**/__pycache__/**"
  - "!**/.pyc"
  - "!.venv/**"
  - "!.venv*"
  - "!.mypy_cache/**"
  - "!.pytest_cache/**"
  - "!.ruff_cache/**"
  - "!.sonar/**"
  - "!.review/**"
  - "!.tasks/store/**"
  - "!.tmp/**"
  - "!.worktrees/**"
  - "!.git-rewrite/**"
  - "!.idea/**"
  - "!.idea*"
  - "!.git/**"
  - "!.github/workflows/**"  # Linted by actionlint instead
  - "!.huggingface/**"
  - "!.cache/**"
  - "!.uv-cache/**"
  - "!node_modules/**"
  - "!.knowledge/**"
