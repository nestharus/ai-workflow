# Lint script configuration for yamllint
# Directories to exclude when searching for YAML files

exclude_dirs:
  - .venv
  - .venv2
  - __pycache__
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .sonar
  - .review
  - .idea
  - .git
  - .github
  - .cache
  - .uv-cache
  - node_modules
  # Exclude timestamped YAML originals in .knowledge/originals/
  - .knowledge
